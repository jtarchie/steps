# yaml-language-server: $schema=../steps.schema.json
#
# Release the steps CLI (.goreleaser.yml in the steps repo).
#
#   snapshot   main: gate, goreleaser snapshot, run the binary. Publishes nothing.
#   release    new v* tag: gate, approval, goreleaser release, check the published archive.
#
#   git tag v0.1.0 && git push origin v0.1.0
#   steps approvals list -p release                          # the release job parks here; approve <id>
#   steps web --config steps.yml --worker docker-box=docker+ssh://me@box && steps pipeline set -c examples/release.yml
#
# Needs: git, task, goreleaser, jq, go, a docker+ssh worker for docker-box, and a daemon secret source named `op` answering `gh_token` (`repo` scope).
# `steps run`/`steps test` refuse a ((source:name)) reference without `--config steps.yml`, the daemon's file: it alone defines `op` (docs/secrets.md).
#
# The tag is the trigger: pushing it is the decision, and this pipeline never
# writes to the source repo. Built from github.com, not the local clone,
# because a release must come from what is pushed. The gate is `task` (the
# repo has no CI); --skip=before stops goreleaser's own `go test` running twice.

resource_types:
# A put, not a task: a succeeded task is cached and skipped, a publish must not be.
- name: github-release
  config:
    out: |
      set -e
      cd repo
      tag=$(git describe --tags --exact-match)
      GITHUB_TOKEN=$GH_TOKEN goreleaser release --clean --skip=before 1>&2
      printf '{"tag":"%s"}\n' "$tag"

resources:
- name: main
  type: git
  secrets:
    GH_TOKEN: ((op:gh_token))
  source:
    uri: https://github.com/jtarchie/steps.git
    branch: main
    token_env: GH_TOKEN   # public, but a credential is what keeps the operator's git config out
# Oldest first, and the commit is in the version, so a moved tag re-runs — and goreleaser then refuses the existing release.
- name: tag
  type: git
  secrets:
    GH_TOKEN: ((op:gh_token))
  source:
    uri: https://github.com/jtarchie/steps.git
    tag_pattern: "v*"
    token_env: GH_TOKEN   # public, but a credential is what keeps the operator's git config out: an https-to-ssh insteadOf would send this 30s poll to the ssh agent
- name: release
  type: github-release
  source: {}
  secrets:
    GH_TOKEN: ((op:gh_token))

tasks:
# Runs on a docker+ssh worker (tag docker-box, mapped by --worker): the laptop VM's daemon timed out under the parallel -race shards.
- name: gate
  inputs: [repo]
  image: docker:dind                   # stock, not prebuilt: a placed step's image is pulled every run, so a worker-local image fails
  privileged: true                     # the docker-backed tests need a daemon inside this container, and dind only runs privileged
  user: root                           # dind's daemon will not start unprivileged
  network: bridge                      # modules, toolchain, the tests' images
  timeout: 40m                         # module, build and image caches start cold every run
  run: |
    set -e
    case "$(uname -m)" in
      x86_64) arch=amd64 ;;
      aarch64) arch=arm64 ;;
      *) echo "no toolchain mapping for $(uname -m)" >&2; exit 1 ;;
    esac
    # ponytail: toolchain installed per run (~1-2 min); bake it into an image FROM docker:dind when that hurts.
    apk add -q gcc musl-dev git git-daemon curl tar procps   # -race needs cgo; git-daemon holds http-backend, which the git tests serve a remote with; procps because busybox ps has no -p, which the ssh tests use
    go=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1)
    curl -fsSL "https://go.dev/dl/$go.linux-$arch.tar.gz" | tar -xz -C /usr/local
    curl -fsSL "https://github.com/go-task/task/releases/latest/download/task_linux_$arch.tar.gz" \
      | tar -xz -C /usr/local/bin task
    lint=2.14.0   # the laptop's version, so lint answers the same in both places
    curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v$lint/golangci-lint-$lint-linux-$arch.tar.gz" \
      | tar -xz -C /usr/local/bin --strip-components=1 "golangci-lint-$lint-linux-$arch/golangci-lint"
    export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"   # $HOME/go/bin: govulncheck, nilaway

    # The postgres tests skip under root (initdb refuses it — #251) and the rest of the suite is exercised as
    # written, so dockerd stays root (dind needs it) while the tests run as tester, who reaches its socket
    # through the docker group. Docker lets any user bind port 0 and up; the suite uses 127.0.0.1:1 as a port
    # nothing answers, and a parallel test's server took it.
    sysctl -w net.ipv4.ip_unprivileged_port_start=1024
    adduser -D -h /home/tester tester
    addgroup tester docker 2>/dev/null || { addgroup -S docker && addgroup tester docker; }
    dind dockerd --host=unix:///var/run/docker.sock >/tmp/dockerd.log 2>&1 &   # dind nests cgroups; bare dockerd fails on cgroup v2
    # The docker-backed tests skip silently without a daemon. Refuse instead.
    i=0
    until docker info >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -gt 60 ]; then
        echo "no docker daemon reachable" >&2
        tail -20 /tmp/dockerd.log >&2
        exit 1
      fi
      sleep 1
    done
    chown -R tester "$PWD/repo"
    cat > /tmp/asuser.sh <<'INNER'
    set -e
    export HOME=/home/tester PATH="/usr/local/go/bin:/home/tester/go/bin:/usr/local/bin:$PATH"
    export GOMEMLIMIT=6GiB   # golangci-lint took 9 GiB in 40s on a 12 GiB worker with no swap, which stopped answering ssh; a soft limit trades that for GC time
    # Skipped in this container only (the laptop's `task` runs them): the probe test rm's /usr/bin/find, which a
    # non-root container user cannot; the two ssh tests time TERM/KILL against a process tree dind changes; the
    # keep-workspace test hangs to the 10m timeout here and takes a whole e2e shard with it.
    export GOFLAGS='-skip=^(TestProbeRefusesAnImageWithoutTheFileUtilities|TestSSHWorkerCancelKillsACommandIgnoringTERM|TestSSHWorkerCancelGivesTERMItsGrace|TestKeepWorkspaceKeepsSpilledToolOutput)$'
    export STEPS_TESTSHARD_SKIP='^(TestProbeRefusesAnImageWithoutTheFileUtilities|TestSSHWorkerCancelKillsACommandIgnoringTERM|TestSSHWorkerCancelGivesTERMItsGrace|TestKeepWorkspaceKeepsSpilledToolOutput)$'   # the same names for the sharded packages, which go test -skip does not reach
    cd "$1/repo"
    # `task fmt` minus its stamp: seal refuses a run under STEPS_TESTSHARD_SKIP by design, and nothing here commits. Keep in step with the Taskfile's fmt list.
    task lint kindswitch vuln nilaway test build
    INNER
    su tester -c "sh /tmp/asuser.sh $PWD"

jobs:
- name: snapshot
  timeout: 60m
  plan:
  - get: repo
    resource: main
  - task: gate
    tags: [docker-box]
  - task: build
    inputs: [repo]
    outputs: [dist]
    timeout: 15m
    run: |
      set -e
      cd repo
      goreleaser release --snapshot --clean --skip=before
      mv dist/* ../dist/
  - task: verify
    inputs: [dist]
    run: |
      set -e
      version=$(jq -r .version dist/metadata.json)
      archives=$(jq '[.[] | select(.type == "Archive")] | length' dist/artifacts.json)
      [ "$archives" -eq 4 ] || { echo "expected 4 archives, got $archives" >&2; exit 1; }
      test -s dist/checksums.txt || { echo "no checksums.txt" >&2; exit 1; }
      bin=$(jq -r --arg os "$(go env GOOS)" --arg arch "$(go env GOARCH)" \
        '.[] | select(.type == "Binary" and .goos == $os and .goarch == $arch) | .path' dist/artifacts.json)
      test -n "$bin" || { echo "no binary for this machine" >&2; exit 1; }
      got=$("$bin" --version)
      [ "$got" = "$version" ] || { echo "binary reports '$got', built '$version'" >&2; exit 1; }
      echo "version stamped: $version"
    assert:
      stdout: "version stamped:"
  assert:
    outcome: succeeded

- name: release
  serial: true
  timeout: 1h
  plan:
  - get: repo
    resource: tag
    trigger: true
    version: every
  - task: gate
    tags: [docker-box]
  # Separate artifact: a file in the checkout would dirty the tree for goreleaser.
  - task: name
    inputs: [repo]
    outputs: [meta]
    run: git -C repo describe --tags --exact-match > meta/tag
  - load_var: tag
    inputs: [meta]
    file: meta/tag
  - approval:
      message: "Publish ((tag)) of steps to github.com/jtarchie/steps (release + homebrew cask on main)?"
      timeout: 24h
  - put: release
    inputs: [repo]
  # Checks what GitHub serves, not the local dist. 4 archives + checksums.txt.
  - task: verify
    secrets:
      GH_TOKEN: ((op:gh_token))
    inputs: [repo]
    run: |
      set -e
      tag=$(git -C repo describe --tags --exact-match)
      assets=$(gh release view "$tag" --repo jtarchie/steps --json assets --jq '.assets | length')
      [ "$assets" -eq 5 ] || { echo "release $tag has $assets assets, expected 5" >&2; exit 1; }
      archive="steps_${tag#v}_$(go env GOOS)_$(go env GOARCH).tar.gz"
      gh release download "$tag" --repo jtarchie/steps --pattern "$archive" --dir .
      tar xzf "$archive"
      got=$(./steps --version)
      [ "$got" = "${tag#v}" ] || { echo "published binary reports '$got', tag is $tag" >&2; exit 1; }
      echo "released $tag"
    assert:
      stdout: "released v"
  assert:
    outcome: succeeded
