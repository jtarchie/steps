# N-way agent verdict routing (the FSM judge). ILLUSTRATIVE, not a runnable
# `steps test` fixture: an agent needs a live model, and there is no
# mock-provider seam at the CLI (same gap as examples/review.yml). The behavior
# is covered by unit tests in internal/agent/verdict_test.go and
# internal/pipeline/route_test.go. Point the agents at a local model
# (lmstudio/ollama on :1234) to run it for real.
#
# An agent that declares `verdicts:` gets a synthesized REQUIRED `verdict` tool
# whose enum is exactly those verdicts. The model must call it (the same
# required-tool + tool_choice forcing the `required:` custom tools use); the
# chosen value is the outcome `to:` routes on. Every verdict must have a `to:`
# target; `failure:` is the reserved catch for "the agent never produced a
# verdict / failed".

agents:
- name: writer
  source: { model: lmstudio/qwen2.5-coder }
  system: You draft short summaries.
- name: critic
  source: { model: lmstudio/qwen2.5-coder }
  system: You review a draft and decide whether it ships, needs revision, or must escalate.
- name: publisher
  source: { model: lmstudio/qwen2.5-coder }
  system: You publish the approved draft.
- name: escalator
  source: { model: lmstudio/qwen2.5-coder }
  system: You write a note handing the draft to a human.

jobs:
- name: judged-loop
  plan:
  - agent: writer
    prompt: Draft a two-sentence summary of the repository.

  - agent: critic
    prompt: >
      Review the draft. Call the verdict tool with "approve" if it ships,
      "revise" if the writer should try again, or "escalate" if a human is
      needed.
    verdicts: [approve, revise, escalate]
    # Targets are step NAMES — an agent step's name is its `agent:` value.
    to:
      approve:  publisher     # forward — ship it
      revise:   writer        # BACKWARD — bounded revise loop
      escalate: escalator     # forward — human hand-off
      failure:  escalator     # reserved: critic never decided → escalate
    max_visits: 3             # critic runs at most 3 times

  - agent: publisher
    prompt: Publish the approved draft.

  - agent: escalator
    prompt: Write a short note explaining why this draft needs a human.
