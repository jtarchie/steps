# yaml-language-server: $schema=../steps.schema.json
# steps-test: skip -- clones over the network, and the release jobs need a live
# LLM (OPENROUTER_API_KEY)
# Demonstrates workspace isolation mechanics in depth. Isolation is not
# optional — every pipeline runs this way: each task/agent step sees only the
# named inputs:/outputs: it declares, materialized as a fresh copy, and only
# declared outputs are captured back. The workspace: block below is TUNING
# (which strategy materializes trees, where the root lives), not a switch;
# an absent block means strategy: copy under a system temp root.
workspace:
  strategy: copy   # the default, spelled out for the tour
  # For strategy: btrfs (Linux only; instant copy-on-write via subvolume
  # snapshots instead of copying file contents), root is required — the
  # system temp directory is commonly tmpfs, not btrfs:
  #
  # workspace:
  #   strategy: btrfs
  #   root: /mnt/btrfs/steps
  #   options:
  #     compression: zstd   # zstd | lzo | zlib | none
  #
  # subvolume delete (used for cleanup) is unprivileged only on filesystems
  # mounted with user_subvol_rm_allowed; steps falls back to a plain
  # directory removal otherwise, which still reclaims the space — just
  # without the instant subvolume-metadata cleanup.

# Every agent below inherits this model, so it is named once rather than on
# every agent. openrouter/qwen/qwen3.7-flash is a cheap tool-calling model
# ($0.03/M in, $0.13/M out, 1M context); the openrouter/ prefix supplies both
# the base URL and the OPENROUTER_API_KEY env var name, so no api_key_env: is
# needed -- but a key IS. Point it anywhere else for a run, including a local
# server that costs nothing and needs no key:
#   STEPS_MODEL=lmstudio/your-model steps run examples/workspace.yml --job <name>
# A single agent can still pin its own with source.model:.
defaults:
  model: openrouter/qwen/qwen3.7-flash

# Fetching a repo needs no resource_types: block — `git` ships with steps.
# Publishing does: what "publish" means is specific to where you're sending
# it, so a put target is a type you write. This one just lists what it was
# handed, standing in for a real upload.
resource_types:
- name: artifact-store
  config:
    check: 'echo ''[{"ref":"latest"}]'''
    in: "true"
    out: |
      echo "publishing to {{ .source.bucket | shellquote }}:" && find . -type f | head -20

resources:
- name: repo
  type: git
  source:
    uri: https://github.com/jtarchie/ci.git
    branch: main
- name: results
  type: artifact-store
  source:
    bucket: releases

agents:
- name: reviewer
  system: |
    You review a build's release notes for obvious mistakes. The build's
    output is checked out under ./built in your working directory — nothing
    else is visible to you.
  tools:
  - read_file
  - list_dir

# Reusable task: inputs:/outputs: declared here apply to every step
# referencing it (task: build, no run:) unless a step sets its own —
# mirroring how fix: overrides work.
tasks:
- name: build
  run: cd repo && go build -o ../built/steps . && echo built > ../built/NOTES.md
  inputs: [repo]
  outputs: [built]

jobs:
- name: release
  plan:
  - get: repo
    trigger: true

  # Sees only repo/ (its declared input): a fresh copy, never mutated by an
  # earlier step, and this step's own writes never leak back into repo/
  # itself. Its outputs: [built] is captured after it succeeds, so later
  # steps can name "built" as one of their own inputs.
  - task: build

  # Sees only built/ — not repo/, even though repo/ was fetched earlier in
  # this same build. A step that never declares an input for a resource
  # simply cannot reach it, by construction, not by convention.
  - task: test
    run: test -x built/steps
    inputs: [built]

  # Sees only built/ too. Its file tools (read_file/list_dir) are separately
  # lexically confined to its working directory, but it's this step's own
  # inputs: that keeps repo/ out of view in the first place.
  - agent: reviewer
    prompt: does NOTES.md read like a real release note, or a placeholder?
    inputs: [built]

  # inputs: selects exactly what the out: command can see. Omitted/empty
  # means an empty (but still isolated) working directory — there is no
  # implicit "all artifacts fetched/produced so far" view for put steps;
  # declare whatever the out: command actually needs.
  - put: results
    inputs: [built]

# The same build, wired with Concourse-style name mapping and a get alias — so
# a reusable task with pinned input/output names can be pointed at whatever a
# job actually fetched/produced without editing the task.
- name: release-mapped
  plan:
  # get: aliases the resource — the fetched artifact is named "source" (the
  # get:), while the resource whose check/in runs is "repo" (the resource:).
  - get: source
    resource: repo
    trigger: true

  # The reusable `build` task declares inputs: [repo], outputs: [built].
  # input_mapping feeds its "repo" input from the plan artifact "source";
  # output_mapping captures its "built" output under the name "release-bits".
  # The task itself is untouched — it still cd's into repo/ and writes built/.
  - task: build
    input_mapping:  { repo: source }
    output_mapping: { built: release-bits }

  # inputs: all composes the read view from every artifact produced so far
  # (here "source" and "release-bits") — the escape hatch for a put that needs
  # everything, versus naming each input explicitly as the release job does.
  - put: results
    inputs: all
