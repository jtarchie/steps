# yaml-language-server: $schema=../steps.schema.json
# steps-test: skip -- every job invokes a live LLM (needs OPENROUTER_API_KEY;
# the mcp-tools job additionally needs GITHUB_PAT)
# Agent features, consolidated. Every job here invokes an LLM, so — unlike
# examples/flow.yml — this file can't be a `steps test` fixture (no
# mock-provider seam at the CLI). It's a reference: read the job whose feature
# you want. Each job's header says what it needs (a local model, `gh`, etc.).
# Point the agents at any local OpenAI-compatible server (lmstudio/ollama) or
# swap the model refs for a cloud provider.

# Every agent below inherits this model, so it is named once rather than on
# every agent. openrouter/qwen/qwen3.7-flash is a cheap tool-calling model
# ($0.03/M in, $0.13/M out, 1M context); the openrouter/ prefix supplies both
# the base URL and the OPENROUTER_API_KEY env var name, so no api_key_env: is
# needed -- but a key IS. Point it anywhere else for a run, including a local
# server that costs nothing and needs no key:
#   STEPS_MODEL=lmstudio/your-model steps run examples/agents.yml --job <name>
# A single agent can still pin its own with source.model:.
defaults:
  model: openrouter/qwen/qwen3.7-flash

resource_types:
# For the `review` job: list/checkout open PRs and post a verdict via gh.
- name: pull-request
  config:
    check: gh pr list --json id,title,number,createdAt,updatedAt,headRefOid --repo {{ .source.repo }} --state open -q 'sort_by(.updatedAt)'
    in: gh repo clone {{ .source.repo }} . && gh pr checkout {{ .version.number }}
    out: gh pr update-branch --repo {{ .source.repo }} {{ .version.number }}
# (The `self-heal` jobs fetch a plain checkout, which needs no resource type
# at all — see the `repo` resource below, which uses the built-in `git`.)
# For the `delegate` job: fabricate a checkout with one long file, fully
# offline (no network/credentials) so only a local model is needed.
- name: fixture
  config:
    check: echo '[{"ref":"v1"}]'
    in: seq 1 400 | sed 's/^/line /' > NOTES.txt
# For the `judge` job: fabricate a small fake project (README + a source file +
# a changelog), fully offline, so the writer has real material to summarize and
# the critic real material to check it against.
- name: project-fixture
  config:
    check: echo '[{"ref":"v1"}]'
    in: |
      cat > README.md <<'EOF'
      # widgetd

      widgetd is a tiny daemon that serves widgets over HTTP. It keeps an
      in-memory catalog, exposes GET /widgets and POST /widgets, and persists
      nothing across restarts — the catalog is seeded from widgets.json on boot.
      EOF
      cat > main.go <<'EOF'
      package main

      // widgetd serves an in-memory widget catalog over HTTP.
      func main() { serve(":8080") }
      EOF
      cat > CHANGELOG.md <<'EOF'
      # Changelog
      - v1: initial release — in-memory catalog, GET/POST /widgets.
      EOF

# For the `mcp-tools` job: GitHub's own MCP server, bearer-authenticated —
# see docs/mcp.md. No interactive login needed to read/run this job, unlike
# an oauth-configured server (examples/infra.yml's `linear` demonstrates
# that half).
mcp_servers:
- name: github-mcp
  endpoint: https://api.githubcopilot.com/mcp/
  auth: { type: bearer, api_key_env: GITHUB_PAT }

resources:
- name: prs
  type: pull-request
  source: { repo: jtarchie/ci }
- name: repo
  type: git
  source: { uri: https://github.com/jtarchie/ci.git, branch: main }
- name: notes
  type: fixture
  source: {}
- name: project
  type: project-fixture
  source: {}

agents:
# The reviewer: reads, runs read-only git/gh, and posts a verdict through a
# custom tool that shows off the tool-call guards (required/max_calls/args).
- name: reviewer
  system: |
    You are a security-focused reviewer. Be terse, cite file:line, prioritize
    correctness over style, and never claim to have read a diff you didn't.
  max_turns: 12
  tools:
  - read_file
  - list_dir
  - run_shell
  - name: post_review
    description: Post a review verdict on the current PR. action is approve or comment.
    # shellquote renders each value as one safely-quoted shell word, so
    # metacharacters in a model-authored body are posted literally.
    run: gh pr review --repo {{ .args.repo | shellquote }} --{{ .args.action | shellquote }} -b {{ .args.body | shellquote }}
    required: true    # the step can't finish until this succeeds (exit 0) once
    max_calls: 1      # gh doesn't stop a double-post; this does
    args:             # machine-pinned — the model never sees or sets repo
      repo: jtarchie/ci

# A fix agent must be able to EDIT. edit_file is the tool for that: it takes
# an exact old_string/new_string, so a small change stays a small change
# instead of re-emitting a whole file through run_shell heredoc quoting.
# search_files finds the failure site without a shell grep flooding the
# conversation. Neither is in the default grant (adding one would change every
# zero-config step's merkle hash), so both are listed explicitly.
- name: fixer
  system: |
    You fix failing checks. The repo is under ./repo. Make the smallest change
    that makes the check pass. Never weaken assertions or delete tests.

    Find the failure site with search_files (output_mode "content" gives you
    line numbers). Change it with edit_file, copying old_string VERBATIM from
    a read_file result — read_file returns raw bytes, so what you read is
    byte-exact input for an edit. write_file replaces a whole file; reach for
    it only when creating one.
  max_turns: 20       # the fix<->re-run loop budget (turns carry memory)
  tools: [read_file, list_dir, search_files, edit_file, write_file, run_shell]

# The fan-in-review cast. Each needs read_file, because a delivered handoff
# note arrives as a synthetic read_file result — a receiver without that grant
# is a load error rather than a silently empty conversation.
- name: planner
  system: You decide what a review should look for, and hand that plan on.
- name: security-reviewer
  system: You review for security issues and report what you found.
- name: perf-reviewer
  system: You review for performance issues and report what you found.

# Sub-agent delegation: `lead` grants `summarizer` as a callable tool, so it can
# offload bulk reading to a cheaper model instead of pulling a whole file in.
- name: summarizer
  system: You compress files. Given a path, read it and return only the gist.
  tools: [read_file]
- name: lead
  system: |
    You are a lead reviewer. Prefer to delegate bulk reading to the
    `summarizer` tool (pass the path in `request`) rather than reading large
    files yourself, then reason over the gist it returns.
  tools:
  - read_file
  - list_dir
  - agent: summarizer          # a sub-agent, exposed as a callable tool
    description: Summarize a file. Pass the path in `request`; returns the gist.

# MCP tool grant: `triager` is granted a named subset of github-mcp's tools
# (see docs/mcp.md for the three grant forms — single tool / named subset /
# every tool). No sub-delegation here, just tools sourced from a remote MCP
# server instead of a shell command.
- name: triager
  system: You triage GitHub issues, finding ones needing attention and summarizing them.
  tools:
  - mcp: github-mcp
    tools: [search_issues, get_issue]
    # Narrow THIS grant's inline output budget below the global 32,000-byte
    # cap: a search that returns a long ranked list costs context on every
    # later turn, and the answer is the first few entries. It can only lower
    # the cap, never raise it, and nothing is lost — overflow still spills to
    # a file the model can read back. Valid on all three mcp grant forms
    # (unlike description/required/max_calls), so one noisy tool in a subset
    # doesn't have to be split into its own grant and a second connection.
    max_output_bytes: 8000

# Verdict routing: `critic` declares a verdict vocabulary and emits one via a
# synthesized required `verdict` tool; the step's to: routes N-way on it. The
# draft flows between these agents as a real artifact (the `draft` output the
# writer produces), so every agent that touches it is granted the tools to read
# it — and the judge job below declares that flow with inputs:/outputs:.
- name: writer
  system: You draft short summaries. You read files and write your draft to disk.
  tools: [read_file, list_dir, run_shell]
- name: critic
  system: You review a draft and decide whether it ships, needs revision, or must escalate.
  tools: [read_file, list_dir]
- name: publisher
  system: You publish the approved draft.
  tools: [read_file]
- name: escalator
  system: You write a note handing the draft to a human.
  tools: [read_file]

# Reusable task: defined once, referenced by name (task: unit, no run:). On a
# green run it's a plain shell command and NO model is invoked ($0); only a
# nonzero exit summons the fix agent.
tasks:
- name: unit
  run: cd repo && go test ./...
  fix: fixer
  inputs: [repo]         # the task operates on the repo an earlier get fetched

jobs:
# ─── custom tools: required / max_calls / args (needs a model + gh + network) ─
- name: review
  plan:
  - get: prs
    trigger: true
  - agent: reviewer
    dir: prs
    attempts: 3       # whole-conversation restarts for non-tool failures
    prompt: |
      Review the checked-out PR. Use `git diff main...HEAD` and read the
      touched files, then call post_review exactly once. Check `gh pr view
      --json reviews` first: if a prior run posted, don't post again.
    # assert.tool_calls verifies the TRAJECTORY (ordered subsequence, subset
    # args), not just prose. Commented because this job needs a live model and
    # a real PR. Note: `repo` is machine-pinned above, so it's not matchable —
    # assert on what the MODEL chose (action).
    #
    # assert:
    #   tool_calls:
    #   - name: run_shell
    #   - name: post_review
    #     args: { action: comment }

# ─── fix: agent self-heal loop (needs a model + gh + network) ────────────────
# The task is the honest primary step: green = a plain command, $0. Only a
# nonzero exit summons the fixer, seeded with the failure output and given the
# task as a rerun tool; after it stops the command re-runs, and that is the
# verdict.
- name: self-heal
  plan:
  - get: repo
    trigger: true
  - task: unit            # references tasks: unit — its run:/fix: come from there

# The mapping form of fix:, for per-step overrides (a distinct prompt + an
# amnesiac whole-conversation restart count).
- name: self-heal-lint
  plan:
  - get: repo
    trigger: true
  - task: vet
    run: cd repo && go vet ./...
    inputs: [repo]
    fix:
      agent: fixer
      attempts: 2
      prompt: |
        go vet failed (output below). Code is under ./repo. Fix with minimal
        edits, then re-run the `vet` tool. Do not silence vet with //nolint.

# ─── run context store (needs a model) ──────────────────────────────────────
# context: write grants a set_context(key, value) tool. The investigator
# records named facts while it still holds the context; every later step in the
# run can read them back. A handoff note is a whole document addressed to the
# NEXT agent; a context key is one fact addressed to all of them.
#
# The tool is never required — the agent is offered somewhere to put a
# conclusion, not made to produce one. Writing a key twice replaces it.
- name: record-facts
  plan:
  - get: notes
  - agent: lead
    dir: notes
    context: write
    prompt: |
      Read NOTES.txt. Record what it is about with set_context under the key
      `subject`, then reply with one sentence describing the file.
  # Reading is automatic: this step declares no context: at all and still opens
  # with a recap of what lead recorded, delivered as a synthetic read_context
  # result. fidelity: controls how much of each value it sees — off opts out
  # entirely, summary shows values in full. Default is compact.
  - agent: summarizer
    prompt: |
      Using the recorded `subject` fact, write one sentence for a changelog.
  - agent: summarizer
    context: { fidelity: "off" }
    prompt: |
      Write a haiku about pipelines. You are shown no recorded facts.

# ─── handoff notes across a concurrent block (needs a model) ────────────────
# A note is a shift-change report: the departing agent writes it WHILE IT STILL
# HOLDS the context, and the next agent gets it automatically. Unlike a context
# key (one fact for everyone), a note is a whole document for whoever comes
# next.
#
# Both directions cross an in_parallel: block. planner's note is broadcast into
# every branch — a note is read-only, so one report with many readers is free.
# Each branch then writes its own, and synthesizer receives ALL of them, as
# separate documents in declaration order: which reviewer said what is part of
# what they said, so merging them into one file would destroy the answer.
#
# Each delivered note arrives fenced and labelled as data rather than
# instructions. Several model-authored documents landing in one conversation is
# the widest injection surface here.
- name: fan-in-review
  plan:
  - agent: planner
    handoff: { note: true }
    prompt: |
      Decide what a review of this pipeline should look for. Write your
      handoff note for the reviewers who run next.
  - in_parallel:
      steps:
      - agent: security-reviewer
        handoff: { note: true }
        prompt: Review for security issues, following the plan you were handed.
      - agent: perf-reviewer
        handoff: { note: true }
        prompt: Review for performance issues, following the plan you were handed.
  - agent: summarizer
    prompt: |
      You were handed one note per reviewer. Combine them into a single
      verdict, saying which reviewer raised what.

# ─── sub-agent delegation (needs a local model; otherwise offline) ───────────
- name: delegate
  plan:
  - get: notes
  - agent: lead
    dir: notes
    prompt: |
      Summarize what NOTES.txt contains by delegating to the summarizer tool,
      then reply with one sentence describing the file.

# ─── MCP tool grant (needs a model + a real GITHUB_PAT) ──────────────────────
- name: mcp-tools
  plan:
  - agent: triager
    prompt: |
      Search for open issues labeled "bug" in this repository and summarize
      the two most recently updated ones.

# ─── verdict routing / bounded agent loop (needs a model) ────────────────────
# The draft is a real artifact that flows writer -> critic -> publisher/
# escalator: writer reads the fetched `project` and writes draft/summary.md;
# every later agent declares inputs: [draft] (or [project, draft]) so it sees
# exactly what it needs. Without the get: project and these declarations the
# writer would have nothing to summarize — the mistake this required-inputs
# design turns into a load/plan-time error instead of a wasted model run.
- name: judge
  plan:
  - get: project
  # handoff: {tool: true} — writer is the target of critic's `revise:` route,
  # so on a revise loop it gets a <transition_context> block (which step/
  # verdict sent it here, which visit this is) appended to its prompt, plus a
  # previous_run tool to pull critic's full response/note on demand. Neither
  # fires on the FIRST execution (nothing routed here yet) — see docs/control-
  # flow.md's "Handoff context" section.
  - agent: writer
    inputs: [project]
    outputs: [draft]
    prompt: >
      Read the files under project/ (README.md, main.go, CHANGELOG.md), then
      write a two-sentence summary of what this project does to
      draft/summary.md (create the draft directory first with run_shell). If a
      transition context block is present below, you are revising after a
      critique — call previous_run to see the critic's full reasoning and note
      before you rewrite.
    handoff: { tool: true }
  - agent: critic
    inputs: [project, draft]
    prompt: >
      Read draft/summary.md and spot-check it against the files under project/.
      Call verdict with approve, revise, or escalate — pass a short `note`
      explaining your reasoning; it's what the writer sees if you send it back
      for revision.
    # The vocabulary AND the routing, in one ordered list. Targets are step
    # NAMES (an agent step's name is its agent: value); the order is the enum
    # the model is offered.
    verdicts:
      - approve:  publisher   # forward — ship it
      - revise:   writer      # backward — bounded revise loop
      - escalate: escalator   # forward — human hand-off
      - failure:  escalator   # reserved: critic never decided
    max_visits: 3
  - agent: publisher
    inputs: [draft]
    prompt: Read draft/summary.md and publish the approved draft.
  - agent: escalator
    inputs: [draft]
    prompt: Read draft/summary.md and write a short note explaining why this draft needs a human.

# ─── Built-in agents (@builtin/<name>) ──────────────────────────────────────
# Ships with the binary: @builtin/builder, @builtin/planner, @builtin/explorer,
# @builtin/reviewer. Each bundles a system prompt, a tool grant, and dials.
#
# They carry no source: — which model to call is the one thing only you know —
# so declare one and inherit everything else:
#   agents:
#   - name: "@builtin/builder"
#     source: { model: openrouter/qwen/qwen3.7-flash }
#
#   jobs:
#   - name: refactor
#     plan:
#     - agent: "@builtin/builder"
#       prompt: Refactor api/handlers.go to use generics.
#
# Anything the entry sets wins over the profile, so the same block can raise
# max_turns: or narrow tools: while keeping the built-in persona.
#
# system_file: "@builtin/<name>" still works to borrow only the prompt:
#   agents:
#   - name: my-coder
#     source: { model: openrouter/qwen/qwen3.7-flash }
#     system_file: "@builtin/builder"
#     tools: [read_file, list_dir, run_shell, write_file, edit_file, search_files]
