# Agent features, consolidated. Every job here invokes an LLM, so — unlike
# examples/flow.yml — this file can't be a `steps test` fixture (no
# mock-provider seam at the CLI). It's a reference: read the job whose feature
# you want. Each job's header says what it needs (a local model, `gh`, etc.).
# Point the agents at any local OpenAI-compatible server (lmstudio/ollama) or
# swap the model refs for a cloud provider.

resource_types:
# For the `review` job: list/checkout open PRs and post a verdict via gh.
- name: pull-request
  config:
    check: gh pr list --json id,title,number,createdAt,updatedAt,headRefOid --repo {{ .source.repo }} --state open -q 'sort_by(.updatedAt)'
    in: gh repo clone {{ .source.repo }} . && gh pr checkout {{ .version.number }}
    out: gh pr update-branch --repo {{ .source.repo }} {{ .version.number }}
# For the `self-heal` jobs: pin a branch to its head SHA and clone it.
- name: github
  config:
    check: |
      gh api repos/{{ .source.owner }}/{{ .source.repo }}/branches/{{ .source.branch }} -q '.commit.sha' | jq -R '{ref: .}' | jq -s .
    in: |
      gh repo clone {{ .source.owner }}/{{ .source.repo }} . && git -C . checkout {{ .version.ref }}
# For the `delegate` job: fabricate a checkout with one long file, fully
# offline (no network/credentials) so only a local model is needed.
- name: fixture
  config:
    check: echo '[{"ref":"v1"}]'
    in: seq 1 400 | sed 's/^/line /' > NOTES.txt

resources:
- name: prs
  type: pull-request
  source: { repo: jtarchie/ci }
- name: repo
  type: github
  source: { owner: jtarchie, repo: ci, branch: main }
- name: notes
  type: fixture
  source: {}

agents:
# The reviewer: reads, runs read-only git/gh, and posts a verdict through a
# custom tool that shows off the tool-call guards (required/max_calls/args).
- name: reviewer
  source: { model: lmstudio/google/gemma-4-26b-a4b }
  system: |
    You are a security-focused reviewer. Be terse, cite file:line, prioritize
    correctness over style, and never claim to have read a diff you didn't.
  max_turns: 12
  tools:
  - read_file
  - list_dir
  - run_shell
  - name: post_review
    description: Post a review verdict on the current PR. action is approve or comment.
    # shellquote renders each value as one safely-quoted shell word, so
    # metacharacters in a model-authored body are posted literally.
    run: gh pr review --repo {{ .args.repo | shellquote }} --{{ .args.action | shellquote }} -b {{ .args.body | shellquote }}
    required: true    # the step can't finish until this succeeds (exit 0) once
    max_calls: 1      # gh doesn't stop a double-post; this does
    args:             # machine-pinned — the model never sees or sets repo
      repo: jtarchie/ci

# A fix agent must be able to EDIT, and the only edit path is run_shell.
- name: fixer
  source: { model: lmstudio/google/gemma-4-26b-a4b }
  system: |
    You fix failing checks. The repo is under ./repo. Make the smallest change
    that makes the check pass. Never weaken assertions or delete tests.
  max_turns: 20       # the fix<->re-run loop budget (turns carry memory)
  tools: [read_file, list_dir, run_shell]

# Sub-agent delegation: `lead` grants `summarizer` as a callable tool, so it can
# offload bulk reading to a cheaper model instead of pulling a whole file in.
- name: summarizer
  source: { model: lmstudio/qwen2.5-coder }
  system: You compress files. Given a path, read it and return only the gist.
  tools: [read_file]
- name: lead
  source: { model: lmstudio/qwen2.5-coder }
  system: |
    You are a lead reviewer. Prefer to delegate bulk reading to the
    `summarizer` tool (pass the path in `request`) rather than reading large
    files yourself, then reason over the gist it returns.
  tools:
  - read_file
  - list_dir
  - agent: summarizer          # a sub-agent, exposed as a callable tool
    description: Summarize a file. Pass the path in `request`; returns the gist.

# Verdict routing: `critic` declares a verdict vocabulary and emits one via a
# synthesized required `verdict` tool; the step's to: routes N-way on it.
- name: writer
  source: { model: lmstudio/qwen2.5-coder }
  system: You draft short summaries.
- name: critic
  source: { model: lmstudio/qwen2.5-coder }
  system: You review a draft and decide whether it ships, needs revision, or must escalate.
- name: publisher
  source: { model: lmstudio/qwen2.5-coder }
  system: You publish the approved draft.
- name: escalator
  source: { model: lmstudio/qwen2.5-coder }
  system: You write a note handing the draft to a human.

# Reusable task: defined once, referenced by name (task: unit, no run:). On a
# green run it's a plain shell command and NO model is invoked ($0); only a
# nonzero exit summons the fix agent.
tasks:
- name: unit
  run: cd repo && go test ./...
  fix: fixer

jobs:
# ─── custom tools: required / max_calls / args (needs a model + gh + network) ─
- name: review
  plan:
  - get: prs
    trigger: true
  - agent: reviewer
    dir: prs
    attempts: 3       # whole-conversation restarts for non-tool failures
    prompt: |
      Review the checked-out PR. Use `git diff main...HEAD` and read the
      touched files, then call post_review exactly once. Check `gh pr view
      --json reviews` first: if a prior run posted, don't post again.
    # assert.tool_calls verifies the TRAJECTORY (ordered subsequence, subset
    # args), not just prose. Commented because this job needs a live model and
    # a real PR. Note: `repo` is machine-pinned above, so it's not matchable —
    # assert on what the MODEL chose (action).
    #
    # assert:
    #   tool_calls:
    #   - name: run_shell
    #   - name: post_review
    #     args: { action: comment }

# ─── fix: agent self-heal loop (needs a model + gh + network) ────────────────
# The task is the honest primary step: green = a plain command, $0. Only a
# nonzero exit summons the fixer, seeded with the failure output and given the
# task as a rerun tool; after it stops the command re-runs, and that is the
# verdict.
- name: self-heal
  plan:
  - get: repo
    trigger: true
  - task: unit            # references tasks: unit — its run:/fix: come from there

# The mapping form of fix:, for per-step overrides (a distinct prompt + an
# amnesiac whole-conversation restart count).
- name: self-heal-lint
  plan:
  - get: repo
    trigger: true
  - task: vet
    run: cd repo && go vet ./...
    fix:
      agent: fixer
      attempts: 2
      prompt: |
        go vet failed (output below). Code is under ./repo. Fix with minimal
        edits, then re-run the `vet` tool. Do not silence vet with //nolint.

# ─── sub-agent delegation (needs a local model; otherwise offline) ───────────
- name: delegate
  plan:
  - get: notes
  - agent: lead
    dir: notes
    prompt: |
      Summarize what NOTES.txt contains by delegating to the summarizer tool,
      then reply with one sentence describing the file.

# ─── verdict routing / bounded agent loop (needs a model) ────────────────────
- name: judge
  plan:
  - agent: writer
    prompt: Draft a two-sentence summary of the repository.
  - agent: critic
    prompt: >
      Review the draft. Call verdict with approve, revise, or escalate.
    verdicts: [approve, revise, escalate]
    # Targets are step NAMES (an agent step's name is its agent: value).
    to:
      approve:  publisher     # forward — ship it
      revise:   writer        # backward — bounded revise loop
      escalate: escalator     # forward — human hand-off
      failure:  escalator     # reserved: critic never decided
    max_visits: 3
  - agent: publisher
    prompt: Publish the approved draft.
  - agent: escalator
    prompt: Write a short note explaining why this draft needs a human.
