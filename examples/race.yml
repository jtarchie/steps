# yaml-language-server: $schema=../steps.schema.json
# race: — run several steps at once, keep whichever finishes successfully
# first, cancel the rest.
#
# ⚠️ THIS IS A LATENCY HEDGE, NOT A COST SAVER. Running both branches always
# costs both, every time, even when the fast one wins. The value is "never wait
# for the slow path", not "spend less". Anyone reaching for race: to save money
# wants caching or plain retries instead.
#
# ⚠️ Cancelling a loser stops only FUTURE work. A branch that already had a
# real-world side effect — filed an issue, sent a notification — keeps it.
# race: is safe for read/generate-only steps.
#
# workspace: isolation is required and enforced at load: losing branches are
# cancelled while they may be mid-write, and under one shared directory that
# lets a cancelled loser corrupt the winner's files.
#
# Run: steps test examples/race.yml     (no network, credentials, or model)
assert:
  execution:
    - fastest-wins
    - first-SUCCESS-wins
    - every-branch-failed

workspace:
  strategy: copy

jobs:
# The ordinary case: two ways to get the same answer, keep the quicker one.
# The winner's outputs are the step's outputs, so `consumer` neither knows nor
# cares which branch produced them.
- name: fastest-wins
  plan:
  - race:
      steps:
      - task: quick
        inputs: []
        outputs: [answer]
        run: mkdir -p answer && echo quick > answer/text
      - task: thorough
        inputs: []
        outputs: [answer]
        run: sleep 5; mkdir -p answer && echo thorough > answer/text
  - task: consumer
    inputs: [answer]
    run: grep -q quick answer/text
  assert:
    execution: [quick, consumer]
    outcome: succeeded

# "First success", not "first to finish": a branch that fails immediately does
# not decide the block.
- name: first-SUCCESS-wins
  plan:
  - race:
      steps:
      - task: fails-instantly
        inputs: []
        run: exit 1
      - task: succeeds-later
        inputs: []
        run: sleep 0.3; echo ok
  assert:
    execution: [succeeds-later]
    outcome: succeeded

# A hedge, not a guarantee: with nothing to keep, the block fails and reports
# every branch.
- name: every-branch-failed
  plan:
  - race:
      steps:
      - task: alpha
        inputs: []
        run: exit 1
      - task: beta
        inputs: []
        run: exit 1
  assert:
    outcome: failed
