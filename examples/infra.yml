# yaml-language-server: $schema=../steps.schema.json
# steps-test: skip -- reaches a real Linear API and a docker daemon
# Two pipeline-infrastructure features that don't fit the control-flow or agent
# files: cross-job triggering and containerized execution. They share no state;
# read the jobs for the one you want. (Workspace isolation is a third such
# feature but lives in examples/workspace.yml — its `workspace:` block is
# pipeline-global and would force isolation on these jobs too.)

# Every agent below inherits this model, so it is named once rather than on
# every agent. openrouter/qwen/qwen3.7-flash is a cheap tool-calling model
# ($0.03/M in, $0.13/M out, 1M context); the openrouter/ prefix supplies both
# the base URL and the OPENROUTER_API_KEY env var name, so no api_key_env: is
# needed -- but a key IS. Point it anywhere else for a run, including a local
# server that costs nothing and needs no key:
#   STEPS_MODEL=lmstudio/your-model steps run examples/infra.yml --job <name>
# A single agent can still pin its own with source.model:.
defaults:
  model: openrouter/qwen/qwen3.7-flash

resource_types:
# ── Downstream triggers ──────────────────────────────────────────────────────
# A self-contained counter backed by a file, so the trigger flow runs with no
# network or credentials.
- name: counter
  config:
    check: |
      printf '[{"ref": "%s"}]' "$(cat {{ .source.path }})"
    in: |
      echo {{ .version.ref | shellquote }} > ./ref
    out: |
      next=$(( $(cat {{ .source.path }}) + 1 ))
      echo "$next" > {{ .source.path }}
      printf '{"ref": "%s"}' "$next"

# ── MCP-backed downstream trigger (needs a real Linear account) ─────────────
# check: calls Linear's MCP server instead of a shell command — see
# docs/mcp.md. `in:` is omitted, so `get` just writes the selected issue's
# version.json; no second MCP call for this "detect and notify" case.
- name: linear-issues
  config:
    mcp:
      server: linear
      check:
        tool: list_issues   # verify against `steps mcp tools examples/infra.yml linear`
                             # before relying on this name — see docs/mcp.md

# ── Containerized execution ──────────────────────────────────────────────────
# A plain checkout needs no resource type — `git` is built in (see the `repo`
# resource below). This one exists to show image:, which runs check/in in a
# container instead of on the host, so the host needs no git installed.
#
# DockerRunner wraps every command as `sh -c`, so pick images with a shell
# entrypoint (alpine's default), not ones like alpine/git that exec git.
#
# There is no out: because nothing puts to it; a put against a type with no
# out: is a load error rather than a silently successful no-op.
- name: git-alpine
  image: alpine:3
  config:
    check: |
      apk add --no-cache -q git && git ls-remote {{ .source.uri }} {{ .source.branch }} | cut -f1 | sed 's/.*/[{"ref":"&"}]/'
    in: |
      apk add --no-cache -q git && git clone --branch {{ .source.branch }} --depth 1 {{ .source.uri }} . && git checkout {{ .version.ref }}

mcp_servers:
- name: linear
  endpoint: https://mcp.linear.app/mcp
  auth: { type: oauth }   # one-time: steps mcp login examples/infra.yml linear

resources:
- name: counter
  type: counter
  source: { path: /tmp/steps-trigger-example-counter }
- name: repo
  type: git-alpine
  source: { uri: https://github.com/jtarchie/ci, branch: main }
- name: eng-bugs
  type: linear-issues
  source:                  # passed directly as list_issues' arguments — the
    team: ENG               # "criteria config" for detecting new issues
    label: bug
    state: Backlog

agents:
- name: reviewer
  image: python:3.12          # run_shell/custom tools execute in python:3.12
  system: You inspect a checked-out repo and report anything unusual.
  tools: [read_file, list_dir, run_shell]

# A top-level task's image: applies to every step referencing it, unless a step
# overrides it (mirroring how fix: overrides work).
tasks:
- name: inspect
  inputs: [repo]
  outputs: [built]
  run: (cd repo && wc -l $(find . -name '*.go')) > built/LINE_COUNTS.txt && cat /etc/os-release > built/BUILD_IMAGE.txt
  image: golang:1.26

# env: names host variables a containerized command may see. A container
# otherwise starts from its image's own environment with nothing from the host,
# so this is the only way a containerized command reaches a token or a setting
# the operator exported. Names only -- a KEY=VALUE literal is rejected at load
# time, because these fields are hashed into state.db and a literal would be
# written there in cleartext. A name nobody exported is simply absent in the
# container, which is why this example still runs green with none of them set.
- name: report-env
  image: alpine:3
  env: [GREETING, STEPS_BUILD_LABEL]
  run: echo "greeting=${GREETING:-<unset>} label=${STEPS_BUILD_LABEL:-<unset>}"

# network: none cuts the container off from the network entirely -- the knob
# that matters when a step's commands are model-generated, since image: alone
# isolates the filesystem view and leaves egress untouched. It requires image:,
# because a host-executed command uses the host's network and `none` there
# would be isolation in name only. user: is the escape hatch for the Linux
# default (the uid:gid running steps, so containers stop leaving root-owned
# files in the working directory); this image needs nothing privileged, so it
# just demonstrates the spelling.
- name: offline-check
  image: alpine:3
  network: none
  user: root
  run: |
    if wget -q -T 2 -O /dev/null http://example.com; then
      echo "UNEXPECTED: reached the network with network: none" && exit 1
    fi
    echo "network is cut off, as configured"

jobs:
# ─── Downstream triggers — `steps watch` runs `notify` when `publish` puts ────
# Self-contained, no network. Seed the counter first:
#   echo 0 > /tmp/steps-trigger-example-counter
# Then, in one terminal:  steps watch examples/infra.yml --interval 5s
# and in another:         steps run examples/infra.yml --job publish
# `notify` fires on its own within one --interval tick of publish's put landing.

# The producer — run this one directly; its put bumps the counter file.
- name: publish
  plan:
  - put: counter

# Never run directly in the demo: trigger: true is what makes `steps watch` run
# it automatically whenever publish's put lands a counter value it hasn't seen.
- name: notify
  plan:
  - get: counter
    trigger: true
  - task: announce
    inputs: [counter]
    run: echo "counter is now $(cat counter/ref)"

# ─── MCP-backed downstream trigger (needs a real Linear account) ─────────────
# The mcp: equivalent of publish/notify above: check: calls Linear's MCP
# server instead of reading a file. One-time setup:
#   steps mcp tools examples/infra.yml linear   # confirm the real tool name
#   steps mcp login examples/infra.yml linear   # authorize (oauth)
# Then:                steps watch examples/infra.yml --interval 30s
# `notify-linear` fires automatically whenever a new issue matching
# eng-bugs' source: criteria (team/label/state) appears.
- name: notify-linear
  plan:
  - get: eng-bugs
    trigger: true
  - task: announce-issue
    inputs: [eng-bugs]
    run: |
      echo "New Linear issue:"
      cat eng-bugs/version.json

# ─── Containerized execution (needs docker + a local model) ──────────────────
- name: containerized
  plan:
  - get: repo
    trigger: true
  # Runs in golang:1.26 (inherited from the tasks: entry).
  - task: inspect
  # Same task again, but overriding its image for just this step: the identical
  # run: re-executes under alpine (mkdir/find/wc/cat are all in busybox), which
  # proves the step-level image: override takes effect.
  - task: inspect
    image: alpine
  # Try it with `GREETING=hello steps run examples/infra.yml --job ...` to see
  # the value cross into the container.
  - task: report-env
  - task: offline-check
  # run_shell/custom-tool calls below execute in python:3.12.
  - agent: reviewer
    inputs: [repo]
    prompt: does the checked-out repo look like a normal Go project?
