# Demonstrates downstream (cross-job) triggering: `steps watch` polls every
# resource named by a trigger: true get step, across every job below, and
# automatically runs whichever jobs are affected when that resource's latest
# version changes — including a version produced by another job's own put,
# not just an externally-discovered change. Self-contained (no network or
# credentials needed) so the whole flow can be exercised locally.
#
# Before the first run, seed the counter file this pipeline's resource is
# backed by:
#   echo 0 > /tmp/steps-trigger-example-counter
#
# Then, in one terminal:
#   steps watch examples/trigger.yml --interval 5s
# and in another:
#   steps run examples/trigger.yml --job publish
# `notify` fires on its own, without ever being named on the command line,
# within one --interval tick of publish's put landing.
resource_types:
- name: counter
  config:
    check: |
      printf '[{"ref": "%s"}]' "$(cat {{ .source.path }})"
    in: |
      echo {{ .version.ref | shellquote }} > ./ref
    out: |
      next=$(( $(cat {{ .source.path }}) + 1 ))
      echo "$next" > {{ .source.path }}
      printf '{"ref": "%s"}' "$next"

resources:
- name: counter
  type: counter
  source:
    path: /tmp/steps-trigger-example-counter

jobs:
# Run this one directly — it's the producer. Its put bumps the counter
# file, which is what the next `notify` poll (or the immediate poll `steps
# watch` does on startup) will notice.
- name: publish
  plan:
  - put: counter

# Never run this one directly in this demo: trigger: true is what makes
# `steps watch` run it automatically whenever publish's put lands a new
# counter value it hasn't seen before.
- name: notify
  plan:
  - get: counter
    trigger: true
  - task: announce
    run: echo "counter is now $(cat counter/ref)"
