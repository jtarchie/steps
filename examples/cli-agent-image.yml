# yaml-language-server: $schema=../steps.schema.json
# steps-test: skip -- runs the real `claude` CLI inside a container (needs a
# docker daemon, an image with the CLI installed, and credentials)
#
# Containerizing a CLI agent. Without image:, a CLI agent's only fence is the
# subprocess working directory: the CLI runs its own native tools (Read, Bash,
# Edit) directly on the host. Setting image: runs the CLI ITSELF in a
# container, so those tools are confined to it — the isolation an agent with
# this much shell power should have had all along.
#
# The image must have the CLI installed; steps checks that during preflight
# (`docker run --rm <image> claude --version`) rather than letting a wrong
# image fail mid-run.
#
# Run it:
#   steps run examples/cli-agent-image.yml

resources:
- name: repo
  type: git
  source:
    uri: https://github.com/jtarchie/steps

agents:
- name: reviewer
  source:
    model: "@claude/sonnet"
    # How the containerized CLI authenticates. There are two routes and only
    # one of them crosses into a container everywhere:
    #
    #   - On Linux, a subscription login leaves ~/.claude/.credentials.json,
    #     which steps bind-mounts read-only into the container. Nothing else
    #     from ~/.claude goes in.
    #   - On macOS that login lives in the Keychain, which a container cannot
    #     read at all — so api_key_env: is the only route there.
    #
    # Naming it here works on both. Preflight says so plainly if neither
    # route is available.
    api_key_env: ANTHROPIC_API_KEY
  # The image the CLI runs in. It needs the claude CLI on its PATH.
  image: my-registry/claude-cli:latest
  system: |
    You review a repository and judge whether its documentation matches
    its code. Be specific and brief.
  max_turns: 20
  tools:
  - read_file
  - list_dir
  - run_shell

jobs:
- name: review-docs
  plan:
  - get: repo
  - agent: reviewer
    inputs: [repo]
    prompt: |
      Read repo/README.md, then look at the actual code in repo/internal.
      Decide whether the README describes what the code does.
    verdicts: [accurate, stale]
    to:
      accurate: celebrate
      stale: flag
      failure: flag
  - task: flag
    inputs: []
    run: echo "the docs need work"
  - task: celebrate
    inputs: []
    run: echo "docs and code agree"
