resource_types:
- name: pull-request
  config:
    check: gh pr list --json id,title,number,createdAt,updatedAt,headRefOid --repo {{ .source.repo }} --state open -q 'sort_by(.updatedAt)'
    in: gh repo clone {{ .source.repo }} . && gh pr checkout {{ .version.number }}
    out:  gh pr update-branch --repo {{ .source.repo }} {{ .version.number }}

resources:
- name: prs
  type: pull-request
  source:
    repo: jtarchie/ci

# An agent is a reusable worker: its model connection, persona, generation
# dials, limits, and the set of tools a step may draw from. A step supplies
# the per-task prompt, working directory, and tool selection.
agents:
- name: reviewer
  source:
    model: lmstudio/google/gemma-4-26b-a4b
    # endpoint: derived from the "openrouter/" prefix (openrouter.ai/api/v1/)
    # api_key_env: defaults to OPENROUTER_API_KEY
    #
    # Local models work with no key:  model: lmstudio/qwen2.5-coder
    #                                 model: ollama/llama3.1

  # persona — becomes the system message, shared across every step below
  system: |
    You are a security-focused reviewer for pull requests. Be terse, cite
    file:line, prioritize correctness and security over style, and never
    claim to have reviewed a diff you did not actually read.

  # generation dials (all optional)
  temperature: 0.2
  # top_p: 0.9
  # max_tokens: 4096
  # reasoning_effort: high     # low | medium | high, for reasoning models

  # limit — a ceiling every step invoking this agent shares
  max_turns: 12

  # the tool GRANT: the ceiling of what any step may use. run_shell is
  # gated here — a step can pick a subset of these but can't add run_shell
  # if it isn't listed. Custom tools defined here are reusable by name.
  tools:
  - read_file
  - list_dir
  - run_shell
  - name: post_review
    description: Post a review verdict on the current PR. action is approve or comment.
    # shellquote renders each model-supplied value as one safely-quoted shell
    # word (quoting only when needed), so backticks / $(...) / quotes in the
    # review body are posted literally instead of being interpreted by sh -c.
    # Note: no surrounding quotes of our own — shellquote supplies them when
    # the value needs them.
    #
    # {{ .args.repo }} is machine-pinned below, not model-authored — see args:.
    run: gh pr review --repo {{ .args.repo | shellquote }} --{{ .args.action | shellquote }} -b {{ .args.body | shellquote }}
    # required: true means the step can't finish until this tool has
    # actually succeeded (exit 0) at least once. A failure (e.g. a
    # malformed gh invocation) is handed back to the model as normal data
    # so it can see what went wrong and retry in the same session; if it
    # tries to wrap up without a successful call, it's forced to call this
    # tool again rather than being allowed to just summarize and stop.
    required: true
    # max_calls: 1 bounds the double-post hazard the comment below used to
    # only narrate: gh doesn't stop you posting the same review twice, and a
    # model recovering from an earlier failed attempt (see attempts: on the
    # review job) could otherwise call this again in the same session. A
    # rejected (N+1)th call comes back as ordinary data ("call budget (1)
    # exhausted"), same as any other tool failure — never an aborted attempt.
    max_calls: 1
    # args: pins repo so the model can neither see nor override it — "the
    # model chooses when, the machine chooses where." Excluded entirely from
    # the schema the model receives (only action/body are offered).
    args:
      repo: jtarchie/ci

jobs:
# Full review: can read, run read-only git/gh, and post a verdict.
- name: review
  plan:
  - get: prs
    trigger: true
  - agent: reviewer
    dir: prs
    # attempts: 3 only retries the whole conversation from scratch for a
    # non-tool failure (an LLM/transport error, or max_turns exhausted
    # while post_review still hasn't succeeded) — a required tool's own
    # failure is recovered within the same conversation, not by this.
    # post_review isn't idempotent — gh doesn't stop you posting the same
    # review twice — so the agent's max_calls: 1 on post_review bounds a
    # double-post mechanically; the prompt's "check gh pr view first"
    # instruction is still worth keeping so the model doesn't waste a turn
    # hitting that budget wall on a rerun.
    attempts: 3
    # tools omitted -> inherits all of the agent's granted tools
    prompt: |
      Review the checked-out pull request. Use `git diff main...HEAD` and
      read the touched files to understand the change, then call post_review
      exactly once. Check `gh pr view --json reviews` first: if a prior run
      already posted, do not post again.

      Reply with a final short plain-text summary of the review you posted.

# Same worker, locked to read-only for a different task: it selects a subset
# of the agent's tools (so it *cannot* run_shell or post_review, which it
# didn't select) and sets its own attempts, unrelated to the review job's.
- name: triage
  plan:
  - get: prs
  - agent: reviewer
    dir: prs
    attempts: 1
    tools: [read_file, list_dir]
    prompt: |
      Summarize what this pull request changes in two sentences. Post nothing.
