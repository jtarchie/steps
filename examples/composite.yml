# yaml-language-server: $schema=../steps.schema.json
# Features crossing each other, rather than one feature at a time.
#
# Every other example here teaches ONE thing, which is what makes them good
# documentation and exactly what makes them blind to a whole class of bug: the
# seam between two features that each work fine alone. Every fix in the batch
# that prompted this file lived on such a seam — a race: nested in an
# in_parallel: panicked on an empty branch list, a ((var)) was validated in a
# task's run: but not in a put's params:, a matrix cell kept its own cache and
# so ignored the flag that re-runs everything.
#
# Adding a feature? Its own example teaches it. This one is where it meets the
# others. Prefer assert.outcome here: execution: records WHICH steps ran, and a
# swallowed failure runs exactly the same steps as a propagated one, so
# execution: alone matches either way and clears the very difference under test.
#
# Run: steps test examples/composite.yml   (no network, credentials, or model)
assert:
  execution:
    - tried-branch
    - nested-race
    - matrix-tolerant
    - var-params

# race: requires workspace isolation at load time, and it applies file-wide.
workspace:
  strategy: copy

resource_types:
# A resource that publishes nothing and exists to inspect what it was handed.
# The out: script is the assertion: it fails if params still carry an
# unrendered ((var)), so `outcome: succeeded` is what proves substitution
# reached a put's params: at all.
- name: recorder
  config:
    check: echo '[{"ref":"only"}]'
    in: echo only > ./ref
    out: |
      tag={{ .params.tag | shellquote }}
      case "$tag" in
        *'(('*) echo "params reached the resource unrendered: $tag"; exit 1 ;;
      esac
      echo "published $tag"

resources:
- name: release
  type: recorder
  source: {}

jobs:
# ─── try: inside in_parallel: ───────────────────────────────────────────────
# A tolerated failure inside a concurrent branch must stay tolerated. Both
# halves are load-bearing and neither single-feature file can see this:
# in-parallel.yml proves a bare failing branch FAILS the block, try.yml proves
# a wrapped failure is tolerated in a SERIAL plan. Only together do they ask
# whether the block still concludes success — and for a while it did not,
# because toleration lived in the plan walk and a branch never reaches it.
#
# outcome: is the whole assertion. Both steps run either way, so execution:
# alone matches whether the failure was swallowed or propagated.
- name: tried-branch
  plan:
  - in_parallel:
      steps:
      - try:
          task: notify
          run: exit 1
      - task: build
        inputs: []
        run: echo built
  assert:
    execution: [notify, build]
    outcome: succeeded

# ─── race: inside in_parallel: ──────────────────────────────────────────────
# The nesting that panicked. branchOutputs walks a block to collect the names
# its branches produce, and read the first racer to do it — but validate() runs
# every checker and joins their errors, so that walk reached a malformed race
# BEFORE the checker that rejects one could speak. An empty nested race indexed
# [0] and took down `steps watch` on a typo. examples/invalid/ holds the empty
# form; this is the valid one, which has to keep working.
#
# The sibling branch matters: it proves the race resolves to a single winner
# INSIDE a block that is itself still running other work, rather than only as a
# plan step of its own.
- name: nested-race
  plan:
  - in_parallel:
      steps:
      - race:
          steps:
          - task: quick
            inputs: []
            outputs: [answer]
            run: mkdir -p answer && echo quick > answer/text
          - task: thorough
            inputs: []
            outputs: [answer]
            run: sleep 5; mkdir -p answer && echo thorough > answer/text
      - task: sibling
        inputs: []
        run: echo sibling
  assert:
    execution: [quick, sibling]
    outcome: succeeded

# ─── try: inside across: ────────────────────────────────────────────────────
# A matrix cell whose body is a wrapper. Every renderable field — the command,
# and the name the cell is known by — sits on the wrapped step rather than on
# the cell, so a renderer that only looked at the cell substituted nothing at
# all: both cells ran the literal `{{ .vars.shard }}` text under one shared,
# unroutable name. execution: is the assertion that catches it, because the
# names ARE the coordinates.
#
# One cell fails and one passes; the matrix still concludes success, since a
# failing cell never stops the rest and each cell tolerates its own failure.
- name: matrix-tolerant
  plan:
  - across:
    - var: shard
      values: [a, b]
    try:
      task: "flaky-{{ .vars.shard }}"
      inputs: []
      run: test "{{ .vars.shard }}" = a
  assert:
    execution: [flaky-a, flaky-b]
    outcome: succeeded

# ─── load_var: into a put's params: ─────────────────────────────────────────
# The regression that shipped a release literally named ((version)).
# checkStepVars listed the fields it validated and renderStepVars separately
# listed the ones it substituted; params: was in neither, so a var in a put
# reached the resource out: verbatim. The recorder's out: fails on an
# unrendered value, so outcome: succeeded is the assertion that matters here —
# and it is the only one that can be made, since a load_var: step records an
# empty name and would sit in execution: as a blank entry.
#
# The var crosses three things on its way: an output artifact produced by one
# step, a load_var: that reads it out of that artifact (hence inputs:), and a
# put's params: mapping, which is free-form YAML rather than a named field and
# so has to be walked rather than listed.
- name: var-params
  plan:
  - task: pick-tag
    inputs: []
    outputs: [version]
    run: mkdir -p version && printf 'v1.2.3\n' > version/tag.txt
  - load_var: tag
    inputs: [version]
    file: version/tag.txt
  - put: release
    inputs: [version]
    params:
      tag: ((tag))
  assert:
    outcome: succeeded
