# Demonstrates opt-in containerized execution: an `image:` on a
# resource_type, a top-level task (plus a step-level override), and an
# agent. Without image:, every command below would run on the host via
# `sh -c`, exactly as in examples/self-heal.yml/review.yml — that's still
# the default. Setting image: runs that entity's commands in a fresh
# `docker run --rm` container instead, with the step's working directory
# bind-mounted at its own host path so read_file/list_dir and downstream
# steps see the same files. No host environment variables are passed into
# the container.
resource_types:
- name: git-alpine
  # check/in/out for this resource type run inside plain alpine instead of
  # requiring `git` on the host. Note: DockerRunner always wraps a command
  # as `sh -c <command>`, so pick images with a shell entrypoint (alpine's
  # default) rather than ones like alpine/git that override ENTRYPOINT to
  # exec git directly — those don't compose with sh -c.
  image: alpine:3
  config:
    check: |
      apk add --no-cache -q git && git ls-remote {{ .source.uri }} {{ .source.branch }} | cut -f1 | sed 's/.*/[{"ref":"&"}]/'
    in: |
      apk add --no-cache -q git && git clone --branch {{ .source.branch }} --depth 1 {{ .source.uri }} . && git checkout {{ .version.ref }}
    out: "true"

resources:
- name: repo
  type: git-alpine
  source:
    uri: https://github.com/jtarchie/ci
    branch: main

agents:
- name: reviewer
  source:
    model: lmstudio/google/gemma-4-26b-a4b
  # This agent's run_shell/custom tools execute inside python:3.12; the
  # tools themselves stay host-side for read_file/list_dir.
  image: python:3.12
  system: |
    You inspect a checked-out repo and report anything unusual.
  tools:
  - read_file
  - list_dir
  - run_shell

# A top-level task's image: applies to every step referencing it, unless a
# step sets its own — mirroring how fix: overrides work.
tasks:
- name: inspect
  run: mkdir -p built && (cd repo && wc -l $(find . -name '*.go')) > built/LINE_COUNTS.txt && cat /etc/os-release > built/BUILD_IMAGE.txt
  image: golang:1.26

jobs:
- name: containerized
  plan:
  - get: repo
    trigger: true

  # Runs in golang:1.26 (inherited from the tasks: entry above).
  - task: inspect

  # Overrides the task's image for just this step: checks the produced
  # output under a minimal alpine image instead.
  - task: verify
    run: test -s built/LINE_COUNTS.txt && cat built/LINE_COUNTS.txt
    image: alpine

  # run_shell/custom-tool calls below execute in python:3.12.
  - agent: reviewer
    prompt: does the checked-out repo look like a normal Go project?
