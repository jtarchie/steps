# Demonstrates Concourse-style hooks on both steps and jobs, and doubles as a
# self-verifying pipeline via assert.execution. A hook is a full step
# (task/put/agent) that runs in reaction to an outcome:
#
#   on_success  — the guarded work succeeded
#   on_failure  — a task-level failure (a command exited nonzero)
#   on_error    — an infrastructure error (docker, workspace, LLM transport)
#   on_abort    — the run was canceled (SIGINT/SIGTERM)
#   ensure      — always, after any of the above
#
# Hooks are observers: a failed step's on_failure runs, then the failure still
# propagates — the job fails and `steps run` exits nonzero. A failing
# on_success or ensure hook, conversely, fails an otherwise-green step.
#
# Each job's assert.execution names the exact ordered set of task/hook names
# it must run. A MATCHING job assert clears the plan's failure — that's what
# lets `failing` (which deliberately exits 1) still report success below. The
# top-level assert.execution lists the jobs themselves.
#
# Self-contained (no network or credentials). Two ways to run it:
#   steps run examples/hooks.yml --job passing   # on_success + ensure, exit 0
#   steps run examples/hooks.yml --job failing   # on_failure clears via assert, exit 0
#   steps test examples/hooks.yml                # runs both jobs, checks every assert
assert:
  execution:
    - passing
    - failing

jobs:
# The task succeeds, so its on_success and ensure hooks run (not on_failure),
# and the job's own on_success fires. The whole job exits 0.
- name: passing
  plan:
  - task: work
    run: echo "doing the work"
    on_success:
      task: celebrate
      run: echo "step succeeded"
    on_failure:
      task: apologize
      run: echo "step failed"
    ensure:
      task: cleanup
      run: echo "always cleaning up"
  on_success:
    task: announce
    run: echo "job succeeded"
  assert:
    execution:
      - work
      - celebrate
      - cleanup
      - announce

# The task exits nonzero, so its on_failure and ensure hooks run (not
# on_success). The on_failure hook here itself carries a nested ensure,
# showing hooks can recurse. The job's own on_failure then fires too. Without
# an assert this job would fail `steps run`/exit nonzero — but its
# assert.execution matches the recorded order exactly, so the failure is
# cleared and the job reports success.
- name: failing
  plan:
  - task: work
    run: echo "about to fail"; exit 1
    on_success:
      task: celebrate
      run: echo "step succeeded"
    on_failure:
      task: apologize
      run: echo "step failed — notifying"
      ensure:
        task: log
        run: echo "notification attempt finished"
    ensure:
      task: cleanup
      run: echo "always cleaning up"
  on_failure:
    task: alert
    run: echo "job failed"
  assert:
    execution:
      - work
      - apologize
      - log
      - cleanup
      - alert
