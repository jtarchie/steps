# yaml-language-server: $schema=../steps.schema.json
# Control flow, all in one self-verifying pipeline. Four opt-in features that
# shape which steps run and in what order — each modelless, so the whole file
# runs offline as a regression fixture:
#
#   when:              gate whether a step runs at all (exit code: 0 run, nonzero skip)
#   to: / max_visits:  route to another step by outcome, incl. bounded backward loops
#   hooks              on_success / on_failure / ensure reactions (observers)
#   run_file:          load a task's run: from a file next to this pipeline
#
# Verification is `assert.execution`: each job names the exact ordered set of
# task/hook names it must run, and the top-level assert names the jobs. A
# MATCHING job assert clears that job's failure — which is what lets the
# deliberately-failing jobs (`exhaust`, `failing`) still report success. The
# `passing`/`failing` pair adds `assert.outcome`, which pins what the plan
# CONCLUDED — the thing execution: structurally cannot observe. Run:
#
#   steps test examples/flow.yml            # runs every job, checks every assert
#   steps run examples/flow.yml --job <name>
#
# No network, credentials, or model.
assert:
  execution:
    # when: jobs
    - gate-open
    - gate-closed
    - nonzero-is-false
    # to:/max_visits: jobs
    - converge
    - exhaust
    - fall-through
    # hooks jobs
    - passing
    - failing
    # run_file: job
    - external-run-file
    # classification job
    - timeout-fires-on-error

jobs:
# ─── when: (conditional steps) ──────────────────────────────────────────────
# A when: guard runs BEFORE the step and decides whether it runs: exit 0 runs
# it, nonzero skips it. A skipped step behaves like a merkle-cached skip — no
# hooks fire, nothing records, and it's absent from the execution log (which is
# how assert.execution can prove it was skipped).

# Guard TRUE → the gated step runs. The guard's view is the step's own
# declared inputs: — scout publishes what it learned as an artifact, and
# deep-review declares it to read it.
- name: gate-open
  plan:
  - task: scout
    outputs: [findings]
    run: echo high > findings/risk.txt
  - task: deep-review
    inputs: [findings]
    run: echo "running the expensive review"
    when: grep -q high findings/risk.txt
  - task: report
    run: echo done
  assert:
    execution: [scout, deep-review, report]

# Guard FALSE → the gated step is skipped, and the plan CONTINUES (report still
# runs). A false guard skips one step, not the rest of the job. The skipped
# step's on_failure hook must NOT fire (it never ran).
- name: gate-closed
  plan:
  - task: scout
    outputs: [findings]
    run: echo low > findings/risk.txt
  - task: deep-review
    inputs: [findings]
    run: echo "THIS MUST NOT RUN"
    when: grep -q high findings/risk.txt
    on_failure:
      task: notify
      run: echo "THIS MUST NOT RUN EITHER"
  - task: report
    run: echo done
  assert:
    execution: [scout, report]        # deep-review absent: it was skipped

# Any nonzero exit is a legitimate "false", not a failure — an explicit exit,
# a missing file, etc.
- name: nonzero-is-false
  plan:
  - task: gated-by-explicit-exit
    run: echo "THIS MUST NOT RUN"
    when: exit 3
  - task: gated-by-missing-file
    run: echo "THIS MUST NOT RUN"
    when: test -f no-such-file
  - task: survivor
    run: echo still here
  assert:
    execution: [survivor]

# ─── to: / max_visits: (bounded step transitions) ───────────────────────────
# to: routes to another step in the same segment based on this step's outcome,
# AFTER it runs. A backward target forms a loop, bounded by max_visits: (the
# max times the routing step may execute). Exhausting the bound is a job-level
# failure that reaches the job's on_failure hook.

# A converging revise loop: critique fails twice (routing back to draft), then
# succeeds on its third run and falls through to publish.
#
# State across visits rides in an artifact: draft declares `wip` as BOTH input
# and output (read-modify-write — the directory is materialized from the
# artifact's current content and captured back over it), which is how a loop
# carries anything between visits now that a step's view is only what it
# declares. init seeds the artifact so draft's first visit has one to read.
- name: converge
  plan:
  - task: init
    outputs: [wip]
    run: echo 0 > wip/attempts
  - task: draft
    inputs: [wip]
    outputs: [wip]
    run: |
      n=$(cat wip/attempts); n=$((n + 1)); echo "$n" > wip/attempts
      echo "drafting attempt $n"
  - task: critique
    inputs: [wip]
    run: |
      echo "critique attempt $(cat wip/attempts)"
      test "$(cat wip/attempts)" -ge 3   # exit 0 only on the 3rd attempt
    to:
      success: publish                # forward: done
      failure: draft                  # backward: revise
    max_visits: 3
  - task: publish
    run: echo published
  assert:
    execution: [init, draft, critique, draft, critique, draft, critique, publish]

# Exhaustion: flaky always fails and self-loops, hitting max_visits (2
# executions). The loop exhausts → job fails → the JOB's on_failure fires. A
# matching job assert clears the failure so the job still passes `steps test`.
- name: exhaust
  plan:
  - task: flaky
    run: exit 1
    to:
      failure: flaky                  # self-loop
    max_visits: 2
  on_failure:                         # fires once, on exhaustion
    task: escalate
    run: echo escalated
  assert:
    execution: [flaky, flaky, escalate]

# `to: next` — the one target that is not a step name. It means "continue in
# declaration order", which is the only way to route INTO a container: an
# in_parallel:, race:, across: or approval: has no name to be jumped to.
#
# Routing past one instead is not equivalent, and quietly so. If the block
# below were an approval: gate, `success: publish` would skip the human check
# the pipeline exists to have — while looking like it merely moved on.
#
# It is always forward, so it never needs max_visits:. Note that `failure:
# next` is a real route and not a fall-through: it CONSUMES the failure, which
# is what lets probe fail without failing the job.
- name: fall-through
  plan:
  - task: probe
    run: exit 1
    to:
      failure: next                   # carry on anyway, into the block below
      success: next
  - in_parallel:
      steps:
      - task: check-a
        run: echo checking a
      - task: check-b
        run: echo checking b
  - task: publish-result
    run: echo published
  assert:
    execution: [probe, check-a, check-b, publish-result]
    outcome: succeeded

# ─── hooks (reactions) ──────────────────────────────────────────────────────
# A hook is a full step (task/put/agent) that runs in reaction to an outcome:
# on_success, on_failure, on_error, on_abort, ensure. Hooks are OBSERVERS — a
# failed step's on_failure runs, then the failure still propagates (unless a
# job assert clears it); a failing on_success/ensure fails an otherwise-green
# step. Hooks can nest.

# Success path: on_success + ensure fire (not on_failure), and the job's own
# on_success fires. Exits 0.
- name: passing
  plan:
  - task: work
    run: echo "doing the work"
    on_success:
      task: celebrate
      run: echo "step succeeded"
    on_failure:
      task: apologize
      run: echo "step failed"
    ensure:
      task: cleanup
      run: echo "always cleaning up"
  on_success:
    task: announce
    run: echo "job succeeded"
  assert:
    execution: [work, celebrate, cleanup, announce]
    outcome: succeeded

# Failure path: work exits nonzero, so on_failure + ensure fire; the on_failure
# hook carries its OWN nested ensure (hooks recurse), then the job's on_failure
# fires. Without the assert this job would exit nonzero — the matching assert
# clears the failure.
#
# outcome: failed is what makes this a real regression fixture rather than a
# fixture-shaped file. execution: alone cannot tell a propagated failure from a
# swallowed one: the same five names run either way, so the assert matches on a
# build where the error reaches the job AND on one where something ate it — and
# then the match clears the very difference under test. outcome: failed fails
# this job if the plan ever stops concluding failure.
- name: failing
  plan:
  - task: work
    run: echo "about to fail"; exit 1
    on_success:
      task: celebrate
      run: echo "step succeeded"
    on_failure:
      task: apologize
      run: echo "step failed — notifying"
      ensure:
        task: log
        run: echo "notification attempt finished"
    ensure:
      task: cleanup
      run: echo "always cleaning up"
  on_failure:
    task: alert
    run: echo "job failed"
  assert:
    execution: [work, apologize, log, cleanup, alert]
    outcome: failed

# ─── run_file: (external task config) ───────────────────────────────────────
# A task's run: can be loaded from a file next to the pipeline instead of
# written inline (see docs/agents.md's "External files" section) — useful for
# a longer shell script. Resolved once, at LoadConfig time, before any
# hashing or validation, so it behaves exactly like an inline run: from here
# on — including merkle caching (edit tasks/hello.sh and the cache busts,
# rename it with identical contents and it doesn't).
- name: external-run-file
  plan:
  - task: hello
    run_file: tasks/hello.sh
  assert:
    execution: [hello]

# ─── on_error: an operational limit, not the command saying no ──────────────
# Classification decides WHICH hook fires, and the distinction it draws is the
# one worth having a fixture for: on_failure means the work said no, on_error
# means the work never got to answer.
#
# A per-attempt timeout: is the deterministic trigger. It cancels the ATTEMPT's
# context, not the job's, so outcome.Classify sees a live job context and an
# error that is not a task-level Failure — which is Errored. That is what
# distinguishes it from `exit 1` two jobs above, and it needs no docker daemon
# and no bad image, which is why this fixture exists at all now.
- name: timeout-fires-on-error
  plan:
  - task: too-slow
    run: sleep 30
    timeout: 1s
    on_error:
      task: report-outage
      run: echo "the step never finished"
    on_failure:
      task: never-runs
      run: echo "a timeout is not the command failing"
  assert:
    # report-outage, and NOT never-runs: proving the two hooks are actually
    # distinguished rather than both firing on anything non-green.
    execution: [too-slow, report-outage]
    outcome: failed
