# yaml-language-server: $schema=../steps.schema.json
# steps-test: skip -- needs a live LLM (OPENROUTER_API_KEY), the `gh` CLI
# authenticated against a real repo, and its pass/fail depends on what the
# reviewers find, so it can never be a deterministic fixture
#
# ─── Deep PR review, as a pipeline ──────────────────────────────────────────
#
# Three lenses read the diff at once — semantic, mechanical, systemic — each
# proving its own findings against the checked-out code rather than trusting
# the patch. A falsifier tries to knock every finding down, a gatekeeper
# decides what actually blocks the merge, and a synthesizer writes the review
# a human reads. A human approves before anything is posted.
#
# Data flows as files between phases (inputs:/outputs:, context_paths:), the
# same way any other steps pipeline moves an artifact from one step to the
# next — there is no hidden channel underneath it.
#
#   steps validate examples/pr-review.yml
#   PR_REPO=owner/name steps run examples/pr-review.yml --job review
#
# Needs: `gh` (authenticated, or GH_TOKEN set), and a model.

# Required because the three lenses run concurrently — concurrent branches
# writing declared outputs need their own directory each.
workspace:
  strategy: copy

defaults:
  # opencode's Go provider (https://opencode.ai/docs/go/): the `opencode/`
  # prefix supplies the base URL and the OPENCODE_API_KEY env var name, so a
  # model here is just the model. glm-5.2 is the open model pr-af's own
  # benchmark leads with, which makes it the honest default for a pipeline
  # shaped after theirs. Swap per run without editing this file:
  #   STEPS_MODEL=opencode/kimi-k3 steps run examples/pr-review.yml --job review
  model: opencode/glm-5.2

# ─── the PR, in and out ─────────────────────────────────────────────────────
# Both directions are `gh` — what "a PR" and "a review" mean is specific to
# your host, so it is a resource type you own rather than something built in.
resource_types:
- name: github-pr
  config:
    # One version per open PR, newest first. Each becomes a candidate build.
    check: |
      set -e
      gh pr list --repo {{ .source.repo | shellquote }} --state open \
        --json number,headRefOid \
        --jq '[.[] | {ref: ((.number|tostring) + "@" + .headRefOid)}]'
    # The version's ref carries the head SHA, so a new push is a new version —
    # and therefore a new build, rather than a cache hit on the PR number.
    # Fetches the diff AND the code it changed, at the exact commit under
    # review. The code is the half that is easy to forget: every reviewer here
    # is told to read the source rather than trust the patch.
    in: |
      set -e
      ref={{ .version.ref | shellquote }}
      number="${ref%%@*}"
      sha="${ref##*@}"
      gh pr diff --repo {{ .source.repo | shellquote }} "$number" > pr.diff
      gh pr view --repo {{ .source.repo | shellquote }} "$number" \
        --json title,body,files,baseRefName > pr.json
      printf '%s' "$number" > pr.number

      # Checked out INTO this artifact, so a path a lens names reads
      # `pr/internal/thing.go` — the same prefix the diff and metadata use.
      # `checkout <sha> -- .` restores the tree without moving HEAD, which is
      # what keeps the three files above from being clobbered.
      git init -q .
      git remote add origin "https://github.com/{{ .source.repo }}.git"
      git fetch -q --no-tags --depth 1 origin "$sha" 2>/dev/null \
        || git fetch -q --no-tags origin
      git checkout -q --force "$sha" -- . 2>/dev/null \
        || git checkout -q --force FETCH_HEAD -- .

- name: github-review
  config:
    check: 'echo ''[{"ref":"latest"}]'''
    in: "true"
    # Posts the synthesized findings. `--json` output from the synthesizer is
    # what the loop below is for: nothing reaches this step until a falsifier
    # has tried to knock each finding down.
    out: |
      set -e
      test -s review/findings.json || { echo "no findings file"; exit 1; }
      gh pr review --repo {{ .source.repo | shellquote }} "$(cat pr/pr.number)" \
        --comment --body-file review/summary.md

resources:
- name: pr
  type: github-pr
  source:
    repo: ((pr_repo))
- name: pr-review
  type: github-review
  source:
    repo: ((pr_repo))

# ─── the reviewers ──────────────────────────────────────────────────────────
# Read-only, deliberately. Withholding the write tools is what makes "this
# agent reviews, it does not edit" a guarantee rather than a request in a
# prompt. run_shell is granted only where a finding has to be checked against
# the actual repository.
agents:
- name: reviewer
  system: |
    You are a senior engineer reviewing one change through ONE assigned
    lens. If the change carries no risk on your lens, write an empty
    findings array — do not pad.

    Read the target files properly: control flow, data flow, error paths, and
    what happens at boundaries — entry and exit, early returns, exception
    handlers. Then trace implications. If a signature changed, who calls it?
    If a default changed, where is it consumed?

    Think about what is NOT in the diff. The most dangerous bugs live in code
    that was not changed but should have been: a signature that moved and left
    its callers behind, an enum variant with no matching case.

    ## Before you report anything, pass three gates

    1. REACHABILITY. Trace the exact path from a real entry point to the code.
       If you cannot construct a concrete scenario where this triggers, it is
       speculation, not a finding.

    2. EVIDENCE CHAIN. Write the steps out:
         Step 1: <entry point> calls <function> with <args>
         Step 2: <function> passes <value> to <downstream>
         Step 3: <downstream> expects <x> but receives <y>
         Step 4: this fails as <specific failure>
       If you cannot write that chain, you cannot report it.

    3. CONFIDENCE. Rate yourself honestly and report nothing below 0.6.
       0.9+ means you traced the path and verified the failure.

    Three well-proven findings are worth more than ten speculative ones. When
    in doubt, drop it.

    ## Severity is a fixed vocabulary

    Exactly one of: critical, important, suggestion, nitpick. Never "high",
    "medium", "low", or "warning".

      critical    it WILL fail in production — crash, corruption, security
                  hole, or silently wrong results, and you can state the exact
                  failure scenario
      important   it CAN fail under known conditions — missing error handling,
                  contract violation, a race under realistic load
      suggestion  it works, but could be more robust
      nitpick     cosmetic

    Write your findings as a JSON array of flat objects with severity, file,
    line, claim, and the evidence chain you actually traced, to the path your
    prompt names.
  max_turns: 50
  tools: [read_file, list_dir, search_files, run_shell, write_file]

- name: falsifier
  system: |
    You are the adversarial reviewer. You CHALLENGE every finding handed to
    you to decide whether it is real or a false positive. You are skeptical
    by default.

    A finding is a CLAIM ABOUT CODE, and the code is available to you. So the
    protocol is a comparison, not an opinion:

      1. read what the reviewer claims the code does
      2. open the file and read what it ACTUALLY does
      3. claim contradicts the code       -> false positive, drop it
      4. claim matches the code           -> then check the callers, and
                                             confirm the failure is reachable

    A reviewer saying "X uses string comparison" when the code plainly calls
    errors.Is() is the case this step exists to catch.

    Also ask, for each survivor: is this the intended behaviour? Is it already
    mitigated somewhere else? A finding you cannot knock down survives — say
    what made it survive.

    Write the survivors to confirmed.json, as a JSON array of flat objects
    with id, severity, file, line, claim.
  max_turns: 50
  tools: [read_file, list_dir, search_files, run_shell, write_file]

- name: gatekeeper
  system: |
    You are the release manager. For each finding you answer ONE question,
    and it is not the question severity answers.

      severity   how bad is this?
      you        must it be fixed BEFORE this ships?

    Those come apart in both directions. A pedantic `critical` in unreachable
    code can ship. A subtle `important` on a hot path cannot.

    Apply a TIGHT bar. Blocking only if it breaks the build or tests, is a
    security hole reachable from a real user-facing path, causes data loss or
    corruption, breaks a public contract real callers depend on with no
    migration, or regresses behaviour that worked before this change.

    NOT blocking: style, naming, refactors, missing tests, defensive
    programming with no demonstrated reachable exploit, performance that does
    not change correctness, documentation, or "should also handle X" when X is
    not currently reachable.

    When you cannot decide, answer NOT blocking. That asymmetry is deliberate:
    a real blocker that slips through is caught by the human reading the
    review, while an advisory nit that blocks a merge teaches the team to
    ignore the whole tool.

    Write blocking.json: a JSON array of the finding ids that block — and
    only those. An empty array is a legitimate answer and the common one.
  max_turns: 50
  tools: [read_file, list_dir, search_files, write_file]

- name: synthesizer
  system: |
    You write the review a human will read. Cluster related findings into
    compound risks where two of them are worse together than apart. A
    finding whose id is not in blocking.json is advisory, not a blocker —
    say so, do not drop it.

    Explain WHY each finding is a problem, not just what is wrong. Quote the
    exact code or call path as evidence. Give the fix concisely: what to
    change, where, and the tradeoff if there is more than one way.
  max_turns: 50
  tools: [read_file, list_dir, write_file]

jobs:
- name: review
  # Job-level, cumulative across every agent step — the step that trips it is
  # rarely the one that cost the most. Counted from the provider's reported
  # usage, never an estimate. Never hashed, so adding it invalidates nothing.
  #
  # And the wall clock, which the token ceiling does not bound: three slow
  # agents can sit inside every per-step deadline and still take all
  # afternoon. 1h is pr-af's own MaxDurationSeconds.
  timeout: 1h
  budget:
    tokens: 8000000
  plan:
  - get: pr
    trigger: true

  # ── phase 1: three lenses at once, each proving its own findings ────────
  # Independent questions with no ordering between them, each reading the
  # same diff and writing its own findings file — three declared outputs, so
  # none of them collide.
  #
  # context_paths: hands each lens the diff directly rather than sending it
  # to find it: a lens that has to read_file its way to the diff spends turns
  # navigating instead of thinking.
  #
  # max_context_bytes: is raised on each because a lens must see the WHOLE
  # change — a diff silently cut at the 100KB default means whole sections of
  # a large PR are never reviewed at all, and a large PR is exactly when that
  # matters.
  - in_parallel:
      steps:
      - agent: reviewer
        prompt: |
          Your lens is SEMANTIC: what does this code DO differently? If I ran
          the old and new side by side, where would they diverge?

          Look at logic changes (any input, not just the happy path), API
          contracts callers depend on, concurrency and shared state, security
          implications, error handling, and data flow.

          NOT yours: type signatures and calling conventions (mechanical),
          pattern consistency and architectural fit (systemic).

          Write your findings to semantic/findings.json.
        inputs: [pr]
        outputs: [semantic]
        context_paths: [pr/pr.diff, pr/pr.json]
        max_context_bytes: 400000
        timeout: 20m
      - agent: reviewer
        prompt: |
          Your lens is MECHANICAL: is the code correct as written? Types and
          signatures, calling conventions, bounds and off-by-ones, resource
          lifecycle, what decorators or wrappers inject that callers may not
          account for.

          NOT yours: whether the behaviour is right (semantic), whether it
          fits the surrounding architecture (systemic).

          Write your findings to mechanical/findings.json.
        inputs: [pr]
        outputs: [mechanical]
        context_paths: [pr/pr.diff, pr/pr.json]
        max_context_bytes: 400000
        timeout: 20m
      - agent: reviewer
        prompt: |
          Your lens is SYSTEMIC: what does this change do to the system around
          it? Consistency with existing patterns, architectural fit,
          migrations and rollout order, operational consequences, and what
          downstream consumers assume.

          NOT yours: whether an individual function is correct (mechanical) or
          behaves differently (semantic).

          Write your findings to systemic/findings.json.
        inputs: [pr]
        outputs: [systemic]
        context_paths: [pr/pr.diff, pr/pr.json]
        max_context_bytes: 400000
        timeout: 20m

  # ── phase 2: the falsifiability gate ─────────────────────────────────────
  # The lenses proposed; this one tries to knock each proposal down. It is a
  # separate step rather than an instruction in the reviewer's prompt because
  # an agent grading its own work is not a gate. It reads all three findings
  # files directly — declared inputs, not a recap.
  - agent: falsifier
    inputs: [pr, semantic, mechanical, systemic]
    outputs: [confirmed]
    timeout: 20m
    context_paths: [semantic/findings.json, mechanical/findings.json, systemic/findings.json]
    prompt: |
      Every finding in the three findings.json files above is a CLAIM, not a
      fact. Try to invalidate each one against the code under pr/.

      Write the survivors to confirmed/confirmed.json.

  # ── the merge gate ───────────────────────────────────────────────────────
  # Severity and "must this block the merge" are different questions, and
  # answering them in one pass makes a reviewer's alarm calibration decide
  # whether a PR ships. Separating them is what lets the review stay useful
  # without turning every finding into a stop sign.
  - agent: gatekeeper
    inputs: [pr, confirmed]
    outputs: [blocking]
    timeout: 20m
    context_paths: [confirmed/confirmed.json]
    prompt: |
      For each confirmed finding above, decide whether it must be fixed
      before this PR merges.

      Write blocking/blocking.json.

  # ── synthesize, and write the review ─────────────────────────────────────
  - agent: synthesizer
    inputs: [pr, confirmed, blocking]
    outputs: [review]
    timeout: 20m
    context_paths: [confirmed/confirmed.json, blocking/blocking.json]
    prompt: |
      Write the review from the confirmed findings above. Cluster any that
      are worse together than apart into a single compound risk.

      Write review/summary.md (what a human reads) and review/findings.json
      (the structured list). Nothing else — the PR number is the pipeline's
      to know, not yours.

  # The deterministic check that the synthesizer actually wrote the files it
  # claimed, run BEFORE a person is asked to look.
  - task: check-draft
    inputs: [pr, review]
    run: |
      set -e
      test -s review/summary.md    || { echo "no review summary was written" >&2; exit 1; }
      test -s review/findings.json || { echo "no findings file was written" >&2; exit 1; }

      test -s pr/pr.number         || { echo "the PR number was never fetched" >&2; exit 1; }

  # ── the gate before anything is public ───────────────────────────────────
  # Posting a review is not undoable. This is where a person looks first — the
  # step prints the message and the command to answer it.
  - approval:
      message: "Review drafted in review/summary.md — post it to the PR?"
      timeout: 24h

  # Both artifacts: the review to post, and the pr the number came from.
  - put: pr-review
    inputs: [pr, review]

  # Best-effort: a failing notification must not fail a review that succeeded.
  on_failure:
    try:
      task: notify
      run: echo "PR review pipeline failed" >&2
