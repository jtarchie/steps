# yaml-language-server: $schema=../steps.schema.json
# steps-test: skip -- needs a live LLM (OPENROUTER_API_KEY), the `gh` CLI
# authenticated against a real repo, and its pass/fail depends on what the
# reviewers find, so it can never be a deterministic fixture
#
# ─── Deep PR review: the adaptive-pipeline shape, as a pipeline ─────────────
#
# The interesting agentic code reviewers do not run a fixed script. They read
# the PR, decide what KINDS of review it needs, spawn one reviewer per kind,
# make each one prove its findings against the code, and only then write
# anything to GitHub. That shape is usually built as a bespoke service.
#
# Here it is a pipeline file, and the two things that make that possible are:
#
#   across: + from:      the width of the matrix is decided during the run, by
#                        a step, not by whoever wrote this file
#   max_in_flight:       those cells run at the same time
#
# Everything else — the parallel lens generators, the falsifiability gate, the
# bounded loop back for a second pass, the human approval before anything is
# posted — is ordinary control flow.
#
# What you get that a bespoke service does not have for free: every reviewer
# cell is independently hashed and cached, so re-reviewing after a push re-runs
# only the cells whose inputs actually changed.
#
#   steps validate examples/pr-review.yml
#   steps plan     examples/pr-review.yml          # note: the matrix width is unknown here, by design
#   PR_REPO=owner/name steps run examples/pr-review.yml --job review
#
# Needs: `gh` (authenticated, or GH_TOKEN set), and a model.

# Required by max_in_flight: below — concurrent cells are clones of one step
# writing the same paths, so each needs its own directory. It also means every
# step here sees only the inputs: it declares.
workspace:
  strategy: copy

defaults:
  # opencode's Go provider (https://opencode.ai/docs/go/): the `opencode/`
  # prefix supplies the base URL and the OPENCODE_API_KEY env var name, so a
  # model here is just the model. glm-5.2 is the open model pr-af's own
  # benchmark leads with, which makes it the honest default for a pipeline
  # shaped after theirs. Swap per run without editing this file:
  #   STEPS_MODEL=opencode/kimi-k3 steps run examples/pr-review.yml --job review
  model: opencode/glm-5.2
  # Every agent below opens with a rendered recap of what earlier steps
  # recorded. summary keeps values whole — a finding's claim is the thing the
  # next agent has to reason about, so truncating it defeats the point.
  context:
    fidelity: summary

# ─── the PR, in and out ─────────────────────────────────────────────────────
# Both directions are `gh` — what "a PR" and "a review" mean is specific to
# your host, so it is a resource type you own rather than something built in.
resource_types:
- name: github-pr
  config:
    # One version per open PR, newest first. Each becomes a candidate build.
    check: |
      set -e
      gh pr list --repo {{ .source.repo | shellquote }} --state open \
        --json number,headRefOid \
        --jq '[.[] | {ref: ((.number|tostring) + "@" + .headRefOid)}]'
    # The version's ref carries the head SHA, so a new push is a new version —
    # and therefore a new build, rather than a cache hit on the PR number.
    in: |
      set -e
      ref={{ .version.ref | shellquote }}
      number="${ref%%@*}"
      gh pr diff --repo {{ .source.repo | shellquote }} "$number" > pr.diff
      gh pr view --repo {{ .source.repo | shellquote }} "$number" \
        --json title,body,files,baseRefName > pr.json
      printf '%s' "$number" > pr.number

- name: github-review
  config:
    check: 'echo ''[{"ref":"latest"}]'''
    in: "true"
    # Posts the synthesized findings. `--json` output from the synthesizer is
    # what the loop below is for: nothing reaches this step until a falsifier
    # has tried to knock each finding down.
    out: |
      set -e
      test -s review/findings.json || { echo "no findings file"; exit 1; }
      gh pr review --repo {{ .source.repo | shellquote }} "$(cat review/number)" \
        --comment --body-file review/summary.md

resources:
- name: pr
  type: github-pr
  source:
    repo: ((pr_repo))
- name: pr-review
  type: github-review
  source:
    repo: ((pr_repo))

# ─── the reviewers ──────────────────────────────────────────────────────────
# Read-only, deliberately. Withholding the write tools is what makes "this
# agent reviews, it does not edit" a guarantee rather than a request in a
# prompt. run_shell is granted only where a finding has to be checked against
# the actual repository.
agents:
- name: lens
  system: |
    You decide what KIND of review a change needs — you do not review it.

    A dimension is a SPECIFIC INVESTIGATION QUESTION, not a category.
      good: "Does the migration from sync to async preserve error propagation
             to callers?"
      bad:  "Check for concurrency issues"

    Each dimension you propose must carry the file paths and line ranges you
    found while investigating, plus the verification steps its reviewer should
    run. A dimension derived only from reading the diff is not good enough —
    if your reasoning is "visible in the patch", you have not looked yet.

    Read the diff to learn WHAT changed, then read the actual source to learn
    how the changed code fits the codebase around it: callers, error paths,
    data flow.

    If the change carries no risk on your lens, propose NOTHING. Do not pad.
  max_turns: 8
  tools: [read_file, list_dir, search_files]

- name: compiler
  system: |
    You merge overlapping review dimensions into one list. Two proposals that
    would send a reviewer to the same lines are one dimension, not two.
  max_turns: 8
  tools: [read_file]

- name: reviewer
  system: |
    You are a senior engineer reviewing one change through ONE assigned
    dimension.

    Read the target files properly: control flow, data flow, error paths, and
    what happens at boundaries — entry and exit, early returns, exception
    handlers. Then trace implications. If a signature changed, who calls it?
    If a default changed, where is it consumed?

    Think about what is NOT in the diff. The most dangerous bugs live in code
    that was not changed but should have been: a signature that moved and left
    its callers behind, an enum variant with no matching case.

    ## Before you report anything, pass three gates

    1. REACHABILITY. Trace the exact path from a real entry point to the code.
       If you cannot construct a concrete scenario where this triggers, it is
       speculation, not a finding. Ask whether an upstream guard already
       prevents the bad state, and whether the "broken" behaviour is
       deliberate.

    2. EVIDENCE CHAIN. Write the steps out:
         Step 1: <entry point> calls <function> with <args>
         Step 2: <function> passes <value> to <downstream>
         Step 3: <downstream> expects <x> but receives <y>
         Step 4: this fails as <specific failure>
       If you cannot write that chain, you cannot report it.

    3. CONFIDENCE. Rate yourself honestly and report nothing below 0.6.
       0.9+ means you traced the path and verified the failure.

    Three well-proven findings are worth more than ten speculative ones. When
    in doubt, drop it.

    ## Severity is a fixed vocabulary

    Exactly one of: critical, important, suggestion, nitpick. Never "high",
    "medium", "low", or "warning".

      critical    it WILL fail in production — crash, corruption, security
                  hole, or silently wrong results, and you can state the exact
                  failure scenario
      important   it CAN fail under known conditions — missing error handling,
                  contract violation, a race under realistic load
      suggestion  it works, but could be more robust
      nitpick     cosmetic
  max_turns: 20
  tools: [read_file, list_dir, search_files, run_shell]

- name: falsifier
  system: |
    You are the adversarial reviewer. You CHALLENGE every finding to decide
    whether it is real or a false positive. You are skeptical by default.

    A finding is a CLAIM ABOUT CODE, and the code is available to you. So the
    protocol is a comparison, not an opinion:

      1. read what the reviewer claims the code does
      2. open the file and read what it ACTUALLY does
      3. claim contradicts the code       -> false positive, say so
      4. claim matches the code           -> then check the callers, and
                                             confirm the failure is reachable

    A reviewer saying "X uses string comparison" when the code plainly calls
    errors.Is() is the case this step exists to catch.

    Also ask, for each survivor: is this the intended behaviour? Is it already
    mitigated somewhere else? A finding you cannot knock down survives — say
    what made it survive.
  max_turns: 20
  tools: [read_file, list_dir, search_files, run_shell]

- name: gatekeeper
  system: |
    You are the release manager. For each finding you answer ONE question,
    and it is not the question severity answers.

      severity   how bad is this?
      you        must it be fixed BEFORE this ships?

    Those come apart in both directions. A pedantic `critical` in unreachable
    code can ship. A subtle `important` on a hot path cannot.

    Apply a TIGHT bar. Blocking only if it breaks the build or tests, is a
    security hole reachable from a real user-facing path, causes data loss or
    corruption, breaks a public contract real callers depend on with no
    migration, or regresses behaviour that worked before this change.

    NOT blocking: style, naming, refactors, missing tests, defensive
    programming with no demonstrated reachable exploit, performance that does
    not change correctness, documentation, or "should also handle X" when X is
    not currently reachable.

    When you cannot decide, answer NOT blocking. That asymmetry is deliberate:
    a real blocker that slips through is caught by the human reading the
    review, while an advisory nit that blocks a merge teaches the team to
    ignore the whole tool.
  max_turns: 12
  tools: [read_file, list_dir, search_files]

- name: synthesizer
  system: |
    You write the review a human will read. Cluster related findings into
    compound risks where two of them are worse together than apart, and drop
    anything the falsifier knocked down.

    Explain WHY each finding is a problem, not just what is wrong. Quote the
    exact code or call path as evidence. Give the fix concisely: what to
    change, where, and the tradeoff if there is more than one way.
  max_turns: 16
  tools: [read_file, list_dir, write_file]

jobs:
- name: review
  # The one directive this pipeline should not ship without. Every other
  # example has a cost you can read off the file; here a model decides how many
  # reviewers run, so the bill is not knowable when you write it. The matrix's
  # own 1000-item cap bounds the COUNT, not the spend.
  #
  # Job-level, so it is cumulative across every agent step — the step that
  # trips it is rarely the one that cost the most. Counted from the provider's
  # reported usage, never an estimate. Never hashed, so adding it invalidates
  # nothing.
  budget:
    tokens: 2000000
  plan:
  - get: pr
    trigger: true

  # ── phase 1: mechanical anatomy ──────────────────────────────────────────
  # A shell command, not a model: which files moved and how much is arithmetic,
  # and paying a model to count lines is how an agent pipeline gets expensive
  # for no accuracy. It records facts every later agent reads.
  - task: anatomy
    inputs: [pr]
    context: write
    run: |
      mkdir -p context
      grep -c '^+' pr/pr.diff > context/lines_added || true
      grep '^diff --git' pr/pr.diff | sed 's|.*b/||' > context/files_touched
      wc -l < context/files_touched > context/file_count

  # ── phase 2: three lenses at once ────────────────────────────────────────
  # Independent questions with no ordering between them. Each records under a
  # scope only it touches, merged at the join under a key naming the branch —
  # so all three survive instead of the last one winning.
  - in_parallel:
      steps:
      - agent: lens
        prompt: |
          Your lens is SEMANTIC: what does this code DO differently? If I ran
          the old and new side by side, where would they diverge?

          Look at logic changes (any input, not just the happy path), API
          contracts callers depend on, concurrency and shared state, security
          implications, error handling, and data flow.

          NOT yours: type signatures and calling conventions (mechanical),
          pattern consistency and architectural fit (systemic).
        inputs: [pr]
        context: write
      - agent: lens
        prompt: |
          Your lens is MECHANICAL: is the code correct as written? Types and
          signatures, calling conventions, bounds and off-by-ones, resource
          lifecycle, what decorators or wrappers inject that callers may not
          account for.

          NOT yours: whether the behaviour is right (semantic), whether it
          fits the surrounding architecture (systemic).
        inputs: [pr]
        context: write
      - agent: lens
        prompt: |
          Your lens is SYSTEMIC: what does this change do to the system around
          it? Consistency with existing patterns, architectural fit,
          migrations and rollout order, operational consequences, and what
          downstream consumers assume.

          NOT yours: whether an individual function is correct (mechanical) or
          behaves differently (semantic).
        inputs: [pr]
        context: write

  # ── phase 3: compile the work list ───────────────────────────────────────
  # This is the step that decides how wide the next one is. It records OBJECTS,
  # so each cell arrives knowing its focus and its scope instead of an opaque
  # id it would have to go look up.
  - agent: compiler
    inputs: [pr]
    context: write
    prompt: |
      Merge the three lens proposals in your context into one deduplicated list.
      Record it with set_context under the key `dimensions`, as a JSON array of
      flat objects with exactly these fields:

        id     a short kebab-case identifier, unique in the list
        focus  one sentence: what a reviewer taking this dimension looks for
        path   the ONE file most central to this dimension, as a repo-relative
               path prefixed `pr/` — its contents are handed to the reviewer
               before it says anything, so a wrong path costs a whole cell
        scope  a space-separated list of the OTHER paths worth reading

      `path` is one file, not a list. A dimension that genuinely needs two
      files read up front is two dimensions.

      At most eight. Fewer is better than overlapping.

  # ── phase 4: one ephemeral reviewer per dimension, concurrently ──────────
  # The matrix's width is not in this file — `from: dimensions` takes it from
  # what the compiler just recorded. Each cell is its own merkle node, so a
  # re-review after a push re-runs only the cells whose inputs changed.
  #
  # label: id names the cells, which is what makes them readable in a log and
  # addressable by assert:. Their findings come back under keys naming the cell
  # (reviewer [dim=<id>].finding), so the falsifier can tell which reviewer
  # said what.
  #
  # context_paths: renders per cell, so each reviewer OPENS holding the file it
  # was assigned — delivered as a synthetic read_file result, costing no turn.
  # That is the difference between "go find your scope" (several turns, and no
  # way to tell whether it actually read the code) and an evidence pack.
  - across:
    - var: dim
      from: dimensions
      label: id
    max_in_flight: 4
    # The ceiling that belongs HERE rather than on the job. This is the only
    # step whose cost nobody could know when this file was written — the
    # compiler decided how many cells there are, minutes ago. When it runs out,
    # the matrix stops starting reviewers, the ones that finished keep their
    # findings, and the plan carries on to the falsifier and the synthesizer.
    #
    # A job-level ceiling could not do that: it fails, and the step that
    # publishes is an agent too, so a breach would spend the money and post
    # nothing. The job budget above stays as the backstop for a runaway.
    #
    # Re-running with a larger figure resumes rather than restarting: the cells
    # that never started recorded nothing.
    budget:
      tokens: 1200000
    agent: reviewer
    inputs: [pr]
    # qualify: this matrix records a fact PER CELL, so each cell's findings
    # come back under a key naming it rather than the cells overwriting one
    # another. Stated rather than inferred from max_in_flight:, so the key
    # names a downstream step reads do not change if the concurrency does.
    context: { write: true, qualify: true }
    context_paths: ["{{ .vars.dim.path }}"]
    prompt: |
      Review this change through one dimension only: {{ .vars.dim.focus }}

      {{ .vars.dim.path }} is already in your context — you have its current
      contents above, so reason over them directly rather than re-reading it.
      Open these only if that is insufficient: {{ .vars.dim.scope }}

      Other dimensions are being reviewed at the same time as yours — the
      recap in your context lists them. A finding that clearly belongs to
      another dimension is theirs, not yours; do not duplicate it.

      Read the code before you claim anything about it. Record each finding
      with set_context under a key starting `finding_`, as a JSON object with
      severity, file, line, claim, and the evidence chain you actually
      traced.

  # ── phase 5: the falsifiability gate ─────────────────────────────────────
  # The reviewers proposed; this one tries to knock each proposal down. It is a
  # separate step rather than an instruction in the reviewer's prompt because
  # an agent grading its own work is not a gate.
  - agent: falsifier
    inputs: [pr]
    context: write
    prompt: |
      Every `finding_*` in your context is a CLAIM, not a fact. Try to
      invalidate each one against the code. Record the survivors with
      set_context under `confirmed`, as a JSON array of flat objects with
      id, severity, file, line, claim — and record `blind_spots` as a short
      note on anything the dimensions never looked at.

  # ── the merge gate ───────────────────────────────────────────────────────
  # Severity and "must this block the merge" are different questions, and
  # answering them in one pass makes a reviewer's alarm calibration decide
  # whether a PR ships. Separating them is what lets the review stay useful
  # without turning every finding into a stop sign.
  - agent: gatekeeper
    inputs: [pr]
    context: write
    prompt: |
      For each confirmed finding in your context, decide whether it must be
      fixed before this PR merges. Record the answer with set_context under
      `blocking`, as a JSON array of the finding ids that block — and only
      those. An empty array is a legitimate answer and the common one.

  # ── phases 6 & 7: synthesize, and decide whether that was enough ─────────
  # The verdict is a required tool call with a fixed vocabulary, so routing
  # never depends on parsing prose. blind-spots sends the run back to the
  # anatomy step for a second pass; max_visits: 2 up there is what bounds it.
  - agent: synthesizer
    inputs: [pr]
    outputs: [review]
    verdicts: [complete, blind-spots]
    to:
      complete: check-draft
      blind-spots: anatomy
    max_visits: 2                # bounds the loop: at most one second pass
    prompt: |
      Write the review from the `confirmed` findings in your context. Cluster
      any that are worse together than apart into a single compound risk.

      Write review/summary.md (what a human reads) and review/findings.json
      (the structured list). Copy pr/pr.number to review/number.

      Then call verdict. ⚠️ Answering `blind-spots` re-runs every reviewer, not
      just the uncovered ones: agent steps are never cached, so a second pass
      pays for the whole matrix again. The reference implementation runs only
      the gap dimensions; expressing that here means a second across: block
      over a `gap_dimensions` key, guarded by when:, rather than this loop.
      Weigh that against the budget above before routing back.

      This is a coverage question, answered by comparison,
      not by taste: the anatomy step recorded which files the change touches,
      and the recap names every dimension that was reviewed. Answer
      `blind-spots` when a cluster of changed files has no dimension covering
      it — and say which. Answer `complete` otherwise. "More could always be
      said" is not a blind spot.

  # `complete` lands here rather than on `next` because this step earns its
  # place: it is the deterministic check that the synthesizer actually wrote
  # the files it claimed, run BEFORE a person is asked to look. A model that
  # answered `complete` having written nothing fails here instead of paging
  # someone to discover it.
  #
  # `to: { complete: next }` is the spelling when there is no such step — it
  # lands on the approval: gate below, which has no name to be routed to. This
  # example predates that and kept the leaf, because a real check beats a
  # fall-through.
  - task: check-draft
    inputs: [review]
    run: |
      set -e
      test -s review/summary.md   || { echo "no review summary was written" >&2; exit 1; }
      test -s review/findings.json || { echo "no findings file was written" >&2; exit 1; }
      test -s review/number       || { echo "no PR number was recorded" >&2; exit 1; }

  # ── the gate before anything is public ───────────────────────────────────
  # Posting a review is not undoable. This is where a person looks first — the
  # step prints the message and the command to answer it.
  - approval:
      message: "Review drafted in review/summary.md — post it to the PR?"
      timeout: 24h

  - put: pr-review
    inputs: [review]

  # Best-effort: a failing notification must not fail a review that succeeded.
  on_failure:
    try:
      task: notify
      run: echo "PR review pipeline failed" >&2
