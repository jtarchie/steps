# yaml-language-server: $schema=../steps.schema.json
# across: — run one step once per combination of values, instead of writing
# out a near-identical step per cell and keeping them in sync by hand.
#
# The headline advantage over Concourse: PER-CELL CACHING. Each cell is an
# ordinary plan step with its own merkle node, so changing one value in one
# axis re-runs only the cells that value appears in — Concourse re-runs the
# entire matrix on any change.
#
# Cells run in plan order by default: the value of a hand-written matrix is
# mostly in not maintaining near-identical copies by hand, and a shared
# workspace makes serial the safe default. A step that wants them at once says
# max_in_flight: — see across-concurrent.yml, which needs workspace isolation
# and so lives in its own file.
#
# Run: steps test examples/across.yml     (no network, credentials, or model)
assert:
  execution:
    - matrix
    - named-cells
    - file-cells
    - empty-file-cells
    - shared-task-cells

jobs:
# Two axes, four cells. `{{ .vars.<name> }}` substitutes into the command, the
# image, the prompt, the working directory, and the step's own name.
#
# The cells are named for their coordinates automatically, because the author
# interpolated nothing into the name — without that every cell would be called
# "check", which is unroutable and unreadable in a log.
- name: matrix
  plan:
  - across:
    - var: suite
      values: [unit, integration]
    - var: mode
      values: [fast, thorough]
    task: check
    inputs: []
    run: echo "{{ .vars.suite }}/{{ .vars.mode }}"
  assert:
    execution:
      - check [mode=fast suite=unit]
      - check [mode=thorough suite=unit]
      - check [mode=fast suite=integration]
      - check [mode=thorough suite=integration]
    outcome: succeeded

# Name the cells yourself and the automatic suffix stays out of the way.
- name: named-cells
  plan:
  - across:
    - var: pkg
      values: [agent, pipeline]
    task: "test-{{ .vars.pkg }}"
    inputs: []
    run: echo "testing {{ .vars.pkg }}"
  assert:
    execution: [test-agent, test-pipeline]
    outcome: succeeded

# ─── a matrix whose width a STEP decides: from_file: ────────────────────────
# An axis can take its values from a JSON array an earlier step wrote, so the
# matrix's width is decided during the run rather than in this file. Here a
# task writes the list; in a real pipeline it is usually an agent — each item
# becomes its own cell, hashed and cached and reported separately, instead of
# one agent grinding through the whole list in a conversation that outgrows its
# window.
#
# Nothing carries the list but an ordinary artifact. The producer declares
# `outputs: [findings]` as it would for any other file, and the axis names a
# path inside it — first component is the artifact, exactly like dir:. There is
# no store and nothing extra for the writing step to opt into.
#
# What it costs: `steps plan` cannot show these cells, because their number is
# not knowable until scan has run — the block hashes its declaration instead.
# And a chain through the block is unskippable, so scan re-runs every run,
# which is precisely what guarantees the file the axis reads is the file THIS
# run wrote. The cells themselves still cache individually.
- name: file-cells
  plan:
  - task: scan
    inputs: []
    outputs: [findings]
    run: |
      mkdir -p findings
      printf '["alpha","beta"]' > findings/items.json
  - across:
    - var: finding
      from_file: findings/items.json
    task: "investigate-{{ .vars.finding }}"
    inputs: [findings]
    run: echo "investigating {{ .vars.finding }}"
  assert:
    execution: [scan, investigate-alpha, investigate-beta]
    outcome: succeeded

# An empty array runs NOTHING, says so, and the plan carries on — "the scan
# found nothing" is a legitimate success. A pipeline that wants an empty list
# to be a failure asserts that where the file is written, which is the step
# that knows what empty means.
- name: empty-file-cells
  plan:
  - task: scan-nothing
    inputs: []
    outputs: [findings]
    run: |
      mkdir -p findings
      printf '[]' > findings/items.json
  - across:
    - var: finding
      from_file: findings/items.json
    task: "investigate-{{ .vars.finding }}"
    inputs: [findings]
    run: echo "never runs"
  - task: after
    inputs: []
    run: echo "the plan continued"
  assert:
    execution: [scan-nothing, after]
    outcome: succeeded

# ─── a matrix over a REUSABLE task ──────────────────────────────────────────
# The cell references a tasks: entry by name instead of carrying its own run:.
# That used to be broken: the coordinates were appended to the very field the
# lookup keys on, so the cell died with `no task named "lint [pkg=agent]"`.
# The coordinates now live on the cell's identity, leaving the lookup alone.
- name: shared-task-cells
  plan:
  - across:
    - var: pkg
      values: [agent, pipeline]
    task: lint
    inputs: []
  assert:
    execution: ["lint [pkg=agent]", "lint [pkg=pipeline]"]
    outcome: succeeded

tasks:
- name: lint
  run: echo "linting"
