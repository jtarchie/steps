resource_types:
- name: github
  config:
    check: |
      gh api repos/{{ .source.owner }}/{{ .source.repo }}/branches/{{ .source.branch }} -q '.commit.sha' | jq -R '{ref: .}' | jq -s .
    in: |
      gh repo clone {{ .source.owner }}/{{ .source.repo }} . && git -C . checkout {{ .version.ref }}

resources:
- name: repo
  type: github
  source:
    owner: jtarchie
    repo: ci
    branch: main

# A reusable worker: model connection, persona, and the tool grant. A fix
# agent must be able to EDIT — and the only way an agent edits in this system
# is run_shell (there is no built-in write tool) — so run_shell is granted.
agents:
- name: fixer
  source:
    model: lmstudio/google/gemma-4-26b-a4b
    # api_key_env defaults to OPENROUTER_API_KEY
  system: |
    You fix failing checks in a CI pipeline. The get resource is checked out
    under the ./repo directory of your working directory. Make the smallest
    change that makes the check pass. Never weaken assertions or delete tests
    to make a check pass — fix the underlying cause.
  max_turns: 20        # the fix<->re-run loop budget (turns carry memory)
  tools:
  - read_file
  - list_dir
  - run_shell

# Reusable task: defined once, referenced below by name (task: unit, no run:)
# instead of every job re-typing the command and its fix:.
tasks:
- name: unit
  run: cd repo && go test ./...
  fix: fixer

jobs:
# The task is the honest primary step: on a green run it is a plain shell
# command and no model is ever invoked ($0). Only a nonzero exit summons the
# agent, which is seeded with the captured failure output and given THIS task
# as a rerun tool (its run:, never its fix:). After the agent stops, the
# command is re-run and that exit code is the verdict.
#
# Everything is anchored at the workspace root: the task command cd's into the
# checked-out ./repo, and the fix agent's working directory defaults to that
# same root — so the rerun tool re-runs the identical command and the agent's
# file tools see ./repo exactly as the task did.
- name: test
  plan:
  - get: repo
    trigger: true
  # References the top-level tasks: unit entry (no run: here) — its run: and
  # fix: come from there. A step's own fix:, if set, would override the
  # referenced task's fix: for this step only; unset here, so fixer applies.
  - task: unit

# The mapping form, for the rare case that needs overrides. attempts here is
# the (amnesiac) whole-conversation restart count; day-to-day iteration rides
# the agent's max_turns, which keeps memory of every earlier attempt.
- name: lint
  plan:
  - get: repo
    trigger: true
  - task: vet
    run: cd repo && go vet ./...
    fix:
      agent: fixer
      attempts: 2
      prompt: |
        go vet failed (output below). The code is under ./repo. Fix the
        reported issues with minimal edits, then re-run the `vet` tool to
        confirm. Do not silence vet with //nolint or build tags — address the
        real problem.
