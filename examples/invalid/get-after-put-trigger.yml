# A get after a put fetches the version that put records; trigger: (and
# version:, passed:) ask for a version some other way, which contradicts it.
# expect: get "releases" follows put "releases", so it fetches the version that put records; trigger: asks for a version some other way, so drop it

resource_types:
  - name: release
    config:
      check: echo '[{"ref":"v1"}]'
      in: "true"
      out: echo '{"ref":"v2"}'

resources:
  - name: releases
    type: release
    source: {}

jobs:
  - name: publish
    plan:
      - put: releases
      - get: releases
        trigger: true
