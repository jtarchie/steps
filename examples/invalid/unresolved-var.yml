# An unresolved ((name)) reaches a shell as that literal text and fails
# somewhere far from the mistake. Supply it with --var/--vars-file; a value
# the run captures is read as ((.:name)) instead.
# expect: is not passed with --var/--vars-file

jobs:
  - name: build
    plan:
      - task: announce
        inputs: []
        run: echo ((nobody_supplies_this))
