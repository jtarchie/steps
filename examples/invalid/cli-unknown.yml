# A typo in a cli name should cost a load, not a run. The "@" spelling is
# recognized on its own, so this reports the cli-specific error rather than
# the generic "no known provider prefix".
# expect: names no known cli

agents:
- name: reviewer
  source:
    model: "@cluade/sonnet"

jobs:
- name: review
  plan:
  - agent: reviewer
    inputs: []
    prompt: Review something.
