# A task may WRITE context — it records facts by writing files into context/ —
# but fidelity: renders a recap into a conversation, and a shell command has
# none. Rejecting it here also keeps caching honest: a command whose text
# depended on a runtime fact could not be hashed at plan time.
# expect: context fidelity is only valid on agent steps

jobs:
- name: build
  plan:
  - task: test
    inputs: []
    run: "true"
    context: { write: true, fidelity: summary }
