# handoff: context/tool describe arriving via a to:/verdicts: route — which
# step sent control here, and what it said. A branch of a concurrent block is
# not a routable position: nothing can route to it, so the fields could never
# fire. This used to load clean and promise a transition context that never
# arrived.
#
# handoff: { note: true } IS supported here — that is the fan-out/fan-in case,
# where a branch receives the note pending before the block and sends one to
# the step after it. See examples/agents.yml.
# expect: handoff context/tool is not supported inside a concurrent block

agents:
- name: writer
  source:
    endpoint: "http://localhost:0"
    model: fake

jobs:
- name: build
  plan:
  - in_parallel:
      steps:
      - agent: writer
        prompt: write something
        handoff: { tool: true }
      - task: work
        inputs: []
        run: "true"
  - agent: writer
    prompt: summarize
