# label: names the field an OBJECT item's cell is called by, which only a from:
# axis can hold. A values: axis holds strings, and a string already names its
# own cell — so label: here points at a field of something with no fields.
#
# Rejected rather than ignored, because the plausible misreading is "call the
# cells after this", and a silently-ignored field is indistinguishable from one
# that worked. To name cells yourself, interpolate the value into the step's own
# name instead: task: "check-{{ .vars.suite }}".
# expect: already name themselves

jobs:
- name: build
  plan:
  - across:
    - var: suite
      values: [unit, integration]
      label: id
    task: check
    inputs: []
    run: "true"
