# handoff: context/tool describe arriving via a to:/verdicts: route. A matrix
# is ONE plan step that expands into siblings, and a route targets that step
# rather than any single cell — so no cell can be said to have been routed to,
# and the fields could never fire.
#
# handoff: { note: true } IS supported on a matrix: each cell writes
# handoff/<its label>.md and the step after the matrix receives one note per
# cell. See examples/agents.yml.
# expect: handoff context/tool is not supported on an across: step

agents:
- name: writer
  source:
    endpoint: "http://localhost:0"
    model: fake

jobs:
- name: shards
  plan:
  - across:
    - var: shard
      values: [a, b]
    agent: writer
    prompt: "review shard {{ .vars.shard }}"
    handoff: { tool: true }
  - agent: writer
    prompt: summarize
