# The same for a question the pipeline asks: the tag step would never get its answer in time.

# expect: ask timeout 4h outlives the job's timeout: 1h

jobs:
  - name: release
    timeout: 1h
    plan:
      - ask: bump
        question: Which bump?
        options: [major, minor, patch]
        timeout: 4h
      - task: tag
        run: echo ((.:bump))
