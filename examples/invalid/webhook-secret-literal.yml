# secret_env names an environment variable, never the secret. A literal would
# verify nothing and be hashed into state.db in cleartext.
# expect: not the secret itself

resources:
- name: push
  type: webhook
  source:
    provider: github
    secret_env: "whsec_not a variable name"

jobs:
- name: build
  plan:
  - get: push
    trigger: true
