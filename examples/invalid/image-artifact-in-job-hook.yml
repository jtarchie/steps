# A job-level hook runs outside every triggered build, so no get has fetched
# anything it could run in. Refused at load rather than failing at run time.
# expect: a job-level hook runs outside any build

resource_types:
- name: registry-image
  config:
    check: echo '[]'
    in: "true"

resources:
- name: toolchain
  type: registry-image
  source: {repository: ghcr.io/me/toolchain}

jobs:
- name: build
  plan:
  - get: toolchain
  ensure:
    task: report
    image: toolchain
    run: echo done
