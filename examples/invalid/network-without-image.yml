# network: only means something for a container. A host-executed command uses
# the host's network, so accepting `network: none` here would promise an
# isolation that does not exist -- the kind of thing discovered in an incident
# review rather than at load time.
# expect: network "none" requires image:

tasks:
- name: build
  run: curl https://example.com
  network: none

jobs:
- name: ship
  plan:
  - task: build
