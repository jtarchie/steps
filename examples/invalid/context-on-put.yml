# context: records facts. An agent records them by calling set_context; a task
# records them by writing files into context/. A put does neither — it hands an
# artifact to a resource and has nothing of its own to say.
# expect: context is only valid on agent and task steps

resource_types:
- name: dummy
  config:
    check: "echo '[]'"
    in: "true"
    out: "true"

resources:
- name: results
  type: dummy
  source: {}

jobs:
- name: publish
  plan:
  - put: results
    inputs: []
    context: write
