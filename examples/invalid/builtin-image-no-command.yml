# cron reads a clock in this process, so an image has nothing to run; this once loaded as an empty shell type and the built-in was silently gone.

# expect: image: cannot apply to cron

resource_types:
- name: cron
  image: alpine:3

resources:
- name: nightly
  type: cron
  source: {expression: "0 3 * * *"}

jobs:
- name: build
  plan:
  - get: nightly
    trigger: true
  - task: compile
    run: echo building
