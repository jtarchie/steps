# A job's timeout: is checked between steps, so this approval would wait its whole day and the job would then fail at the next step, after somebody said yes.

# expect: approval.timeout 24h outlives the job's timeout: 2h

jobs:
- name: publish
  timeout: 2h
  plan:
  - approval:
      message: ship it?
      timeout: 24h
  - task: ship
    run: echo shipped
