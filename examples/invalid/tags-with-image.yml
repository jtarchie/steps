# A worker runs a step's commands directly, the way a host-executed step runs
# them here. Running them in a container ON the worker would mean bind-mounting
# the tree that was just sent, which is a second transfer problem. Refused
# rather than half-honoured — name a worker that already has what the step
# needs.
# expect: tags: and image: cannot be combined
jobs:
- name: build
  plan:
  - task: compile
    tags: [gpu]
    image: golang:1.26
    run: go build ./...
