# context qualify: names the cell each fact came from, and an ordinary step is
# not a cell.
#
# On a matrix it means "record a fact per cell": each cell writes to its own
# scope and the join merges them under keys naming the cell. There is nothing
# for it to name here — one step writes one key, and prefixing that with the
# step's own name is noise, not disambiguation.
#
# A step inside an in_parallel: branch is already qualified by its branch, and
# always was; qualify: is about the one case where scheduling could otherwise
# decide the answer.
# expect: only valid on an across: step

jobs:
- name: record
  plan:
  - task: note
    inputs: []
    context: { write: true, qualify: true }
    run: |
      mkdir -p context
      printf 'something' > context/finding
