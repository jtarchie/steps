# A budget: block that caps nothing is a typo, and reading it as "no limit"
# would be the most expensive possible interpretation. Omit budget: entirely
# for no ceiling.
# expect: budget.tokens must be a positive number of tokens

agents:
- name: writer
  source:
    model: openai/gpt-4o
  budget:
    tokens: 0

jobs:
- name: publish
  plan:
  - agent: writer
    inputs: []
    prompt: Write something.
