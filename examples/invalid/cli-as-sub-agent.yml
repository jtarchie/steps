# A cli agent cannot BE a sub-agent. buildSubAgentTool drives the child over
# steps' own turn loop, which a cli source replaces wholesale. Granting a
# sub-agent TO a cli agent is the direction that loads: the child is reached
# over the bridge like any other tool.
# expect: which has a cli source

agents:
- name: helper
  description: Answers a narrow question.
  source:
    model: "@claude/sonnet"
- name: reviewer
  source:
    model: openai/gpt-4o
  tools:
  - agent: helper

jobs:
- name: review
  plan:
  - agent: reviewer
    inputs: []
    messages:
      - Review something.
