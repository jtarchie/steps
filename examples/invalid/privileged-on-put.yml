# A put's execution shape comes from its resource type, so there is no
# task/agent here for privileged: to override. Set it on the resource_types:
# entry instead.
# expect: privileged is not valid on put steps

resource_types:
- name: dummy
  config:
    check: 'echo ''[{"ref":"v1"}]'''
    in: "true"
    out: 'echo ''{"ref":"v1"}'''

resources:
- name: thing
  type: dummy
  source: {}

jobs:
- name: build
  plan:
  - put: thing
    privileged: true
