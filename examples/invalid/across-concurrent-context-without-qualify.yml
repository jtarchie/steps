# A concurrent matrix that records context has to say it records PER-CELL
# facts.
#
# Concurrent cells cannot share a key: two writers on `finding` produce neither
# cell's value. So each writes to a scope only it touches and the join merges
# them under a key naming the cell — `record [cell=alpha].finding` rather than
# `finding`.
#
# That is the right behaviour, but it used to arrive as a side effect of
# max_in_flight:, which means a SCHEDULING knob silently rewrote the key names
# a downstream step reads. A recap changed shape and any step reading a key by
# name stopped finding it, with nothing to report.
#
# context qualify: true is the author stating the thing they already know: this
# matrix records a fact per cell. Stated, it holds serially too, so the serial
# and concurrent spellings of one pipeline record the same keys — which is what
# makes max_in_flight: safe to add and remove.
# expect: requires context qualify: true

workspace:
  strategy: copy

jobs:
- name: fan
  plan:
  - across:
    - var: cell
      values: [alpha, beta]
    max_in_flight: 2
    task: "record-{{ .vars.cell }}"
    inputs: []
    context: write
    run: |
      mkdir -p context
      printf '{{ .vars.cell }} found something' > context/finding
