# A runtime matrix's templates are checked at LOAD, exactly like a static
# matrix's are.
#
# `{{ .vars.finding }` is missing its closing brace. A static matrix catches
# that while expanding its cells; a runtime one cannot expand until the step
# that fills `findings` has run, so without a load-time check the pipeline
# loaded clean and failed partway through — after the agent step that produced
# the array had already been paid for.
#
# Parsed, not rendered: parsing needs no values, and there is no dummy value set
# that could satisfy a string axis and an object axis at once.
# expect: could not parse the template

jobs:
- name: investigate
  plan:
  - task: scan
    inputs: []
    context: write
    run: |
      mkdir -p context
      echo '["alpha"]' > context/findings
  - across:
    - var: finding
      from: findings
    task: check
    inputs: []
    run: echo {{ .vars.finding }
