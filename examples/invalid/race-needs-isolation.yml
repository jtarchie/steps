# Losing branches are cancelled while they may be mid-write. Under the shared
# single-directory workspace that lets a cancelled loser corrupt the winner's
# files, and there is no version of that which is safe.
# expect: race: requires workspace isolation

jobs:
- name: build
  plan:
  - race:
      steps:
      - task: fast
        inputs: []
        run: echo fast
      - task: slow
        inputs: []
        run: echo slow
