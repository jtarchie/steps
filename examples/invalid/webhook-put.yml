# A webhook resource only receives: its versions are deliveries, and there is
# nothing on the other end to publish to.
# expect: a webhook resource, which only receives

resources:
- name: push
  type: webhook
  source:
    provider: github
    secret_env: GITHUB_WEBHOOK_SECRET

jobs:
- name: reply
  plan:
  - task: write
    outputs: [out]
    run: echo hi > out/x
  - put: push
