# A CLI agent takes tags: by the rule a hosted agent does: only with image:,
# which is what puts its tools in a container that can be placed. Without one
# the tools run in this machine's copy of the step, and there is nothing to move.
# expect: tags: needs image:
agents:
- name: reviewer
  source: { model: "@claude/sonnet" }

jobs:
- name: review
  plan:
  - agent: reviewer
    tags: [gpu]
    messages:
      - "Review it."
