# A token ceiling needs something counting tokens as the conversation runs.
# For a CLI agent that conversation is inside a subprocess which reports its
# spend only on exit -- too late to stop anything -- so budget.tokens here
# would read as a cap while capping nothing. budget.usd is the spelling that
# works: the CLI enforces it mid-run.
# expect: budget.tokens is not supported with a cli source

agents:
- name: reviewer
  source:
    model: "@claude/sonnet"
  budget:
    tokens: 100000

jobs:
- name: review
  plan:
  - agent: reviewer
    inputs: []
    prompt: Review something.
