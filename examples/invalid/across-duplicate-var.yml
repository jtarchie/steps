# Two axes with one name: the second would silently shadow the first, and half
# the matrix would quietly not exist.
# expect: declares var "suite" twice

jobs:
  - name: build
    plan:
      - task: check
        across:
          - var: suite
            values: [unit]
          - var: suite
            values: [integration]
        inputs: []
        run: "true"
