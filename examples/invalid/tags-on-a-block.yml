# Only do: and in_parallel: declare tags: for the steps inside, as in
# Concourse. A race: or ensemble: passes an inherited tag through but cannot
# declare one; wrap it in a do: with tags: instead.
# expect: tags is not valid on a race step
jobs:
- name: build
  plan:
  - race:
      steps:
      - task: one
        run: echo one
      - task: two
        run: echo two
    tags: [gpu]
