# The built-in `git` resource type: clone a branch at its current head.
#
# Registered automatically as `type: git` (see registerBuiltinResourceTypes),
# so a pipeline that just wants a checkout writes a resource and nothing else:
#
#   resources:
#   - name: repo
#     type: git
#     source:
#       uri: https://github.com/jtarchie/steps.git
#       branch: main          # optional; omitted follows the remote's HEAD
#       fetch: true           # optional; local uri only — refresh it first
#       tag_pattern: "v*"     # optional; track tags matching this glob instead of a branch
#       token_env: GH_TOKEN   # optional; https auth from this variable only
#
# Requires the `git` binary. Set image: on your own copy of this type to run
# it in a container instead.
#
# A credential named in source: (token_env, private_key_env) switches every
# command to that credential alone: GIT_CONFIG_GLOBAL=/dev/null and
# GIT_CONFIG_NOSYSTEM drop the operator's url.insteadOf rewrites and credential
# helpers, and ssh gets -F /dev/null and IdentityAgent=none. Without one, the
# operator's config is honored as before, since that is what authenticates most
# remotes today. The credential is read from the environment inside the shell,
# never templated, so it is in no argv and no rendered command.
#
# out: pushes HEAD of params.repository, or params.ref when set. Concourse's
# git resource takes the same param names; force_with_lease and ref are steps'. Its version is the pushed sha,
# recorded in this resource's history like any put's, so a pipeline that both
# triggers on a branch and pushes elsewhere uses two resources.
#
# branch is read as `index .source "branch"` rather than `.source.branch`
# because templates render with missingkey=error: an absent optional key must
# be asked for in a way that answers "nothing" instead of failing.
# git-over-ssh needs the operator's ssh agent. SSH_AUTH_SOCK is not in the
# baseline host env (it grants signing with every key the agent holds), so
# the one resource type that inherently speaks ssh opts it in here, visibly.
env:
  - SSH_AUTH_SOCK

config:
  # ls-remote is the cheapest possible "what is the head?" — no clone, no
  # working tree. An unknown branch prints nothing, which would otherwise be
  # an empty version list (read as "no versions yet"), so it fails loudly.
  #
  # fetch: names the refspec rather than trusting the clone's configured one:
  # a --single-branch clone never updates refs/remotes/<r>/<b> otherwise, and
  # the check would read that ref forever. The flags keep the fetch to that
  # one ref (no FETCH_HEAD, tags or background gc in a developer's clone), and
  # the prompt/ssh settings keep a poll with no terminal from hanging on one —
  # the ssh ones only when the operator chose no ssh command of their own.
  #
  # Every path turns prompting off, not only fetch:. An ls-remote of a private,
  # renamed or mistyped https uri is a 401, which git answers by asking for a
  # username on /dev/tty: under a daemon that once stopped the whole process,
  # and in a terminal it parks a poll on a question nobody expects.
  check: |
    set -e
    export GIT_TERMINAL_PROMPT=0
    {{- if index .source "token_env" }}
    STEPS_GIT_TOKEN=$(printenv {{ .source.token_env | shellquote }}) || true
    if [ -z "$STEPS_GIT_TOKEN" ]; then
      printf 'git: source.token_env names %s, which is unset or empty here\n' {{ .source.token_env | shellquote }} >&2
      exit 1
    fi
    # The empty helper first clears any the clone's own config lists.
    export STEPS_GIT_TOKEN GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
    export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0= GIT_CONFIG_KEY_1=credential.helper
    export GIT_CONFIG_VALUE_1='!f() { [ "$1" != get ] || printf "username=x-access-token\npassword=%s\n" "$STEPS_GIT_TOKEN"; }; f'
    {{- else if index .source "private_key_env" }}
    key=$(mktemp) && known=$(mktemp) && trap 'rm -f "$key" "$known"' EXIT
    printenv {{ .source.private_key_env | shellquote }} > "$key" || true
    if [ ! -s "$key" ]; then
      printf 'git: source.private_key_env names %s, which is unset or empty here\n' {{ .source.private_key_env | shellquote }} >&2
      exit 1
    fi
    # ponytail: no host key is checked (Concourse's git resource does the same); add source.known_hosts when one must be.
    export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
    export GIT_SSH_COMMAND="ssh -F /dev/null -i '$key' -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=no -o UserKnownHostsFile='$known' -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
    {{- end }}
    {{- if index .source "fetch" }}
    uri={{ .source.uri | shellquote }}
    branch={{ index .source "branch" | shellquote }}
    remote=$(git -C "$uri" config --get "branch.$branch.remote" || echo origin)
    {{- if index .source "token_env" }}
    # A token authenticates https, and a developer's clone usually has an ssh
    # origin: fetch from that remote's https form, into the same ref.
    from=$(git -C "$uri" config --get "remote.$remote.url" || true)
    case "$from" in
      ssh://*|git+ssh://*|ssh+git://*)
        rest=${from#*://}; rest=${rest#*@}; host=${rest%%/*}
        from="https://${host%%:*}/${rest#*/}" ;;
      *://*|/*|.*) ;;
      *:*)
        rest=${from#*@}; from="https://${rest%%:*}/${rest#*:}" ;;
    esac
    {{- else }}
    from=$remote
    {{- end }}
    if [ -z "${GIT_SSH_COMMAND:-}${GIT_SSH:-}$(git -C "$uri" config --get core.sshCommand || true)" ]; then
      GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4'
      export GIT_SSH_COMMAND
    fi
    GIT_TERMINAL_PROMPT=0 git -C "$uri" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 \
      fetch --quiet --no-tags --no-write-fetch-head --no-auto-gc \
      -- "$from" "+refs/heads/$branch:refs/remotes/$remote/$branch" || {
      printf 'git: could not fetch %s from %s (remote %s of %s)\n' "$branch" "$from" "$remote" "$uri" >&2
      exit 1
    }
    want="refs/remotes/$remote/$branch"
    refs=$(git ls-remote "$uri" "$want")
    ref=$(printf '%s\n' "$refs" | awk -v want="$want" '$2 == want { print $1; exit }')
    {{- else }}
    if [ -z "${GIT_SSH_COMMAND:-}${GIT_SSH:-}$(git config --get core.sshCommand || true)" ]; then
      GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=30'
      export GIT_SSH_COMMAND
    fi
    {{- if index .source "tag_pattern" }}
    # ls-remote WITHOUT --refs: an annotated tag prints its own object and, on a
    # second line, `<tag>^{}` — the commit it points at, which is the version's
    # ref. sort -V is version order (v2 before v10), where ls-remote's is lexical.
    # No match is an empty list, not an error: a repository's first tag is yet
    # to come. The listing is taken before the pipe so that an unreachable uri
    # fails the check under set -e instead of reading as no tags. A tag name
    # holding a double quote would break the JSON; none is expected.
    refs=$(git ls-remote {{ .source.uri | shellquote }} {{ printf "refs/tags/%s" .source.tag_pattern | shellquote }})
    printf '%s\n' "$refs" \
      | awk -F'\t' '
        NF == 2 {
          name = $2; sub("^refs/tags/", "", name)
          if (name ~ /\^\{\}$/) { sub(/\^\{\}$/, "", name); peeled[name] = $1 } else { sha[name] = $1 }
        }
        END { for (name in sha) print name "\t" (name in peeled ? peeled[name] : sha[name]) }' \
      | sort -V \
      | awk -F'\t' 'BEGIN { printf "[" } { printf "%s{\"tag\":\"%s\",\"ref\":\"%s\"}", (NR > 1 ? "," : ""), $1, $2 } END { print "]" }'
    exit 0
    {{- else }}
    refs=$(git ls-remote {{ .source.uri | shellquote }} {{ index .source "branch" | default "HEAD" | shellquote }})
    # ls-remote takes a PATTERN, not a name, and prints one line per match.
    # Against a local clone `HEAD` also matches refs/remotes/origin/HEAD and
    # `main` also matches refs/remotes/origin/main — a DIFFERENT sha, since
    # the remote-tracking ref is only as fresh as the last fetch. So ask for
    # the exact ref (or its refs/heads/ form) rather than taking whatever came
    # first, and keep the first line as the fallback a tag or peeled ref
    # leaves. Without this, two matches became two SHAs in one JSON string.
    ref=$(printf '%s\n' "$refs" | awk -v want={{ index .source "branch" | default "HEAD" | shellquote }} '
      $2 == want || $2 == "refs/heads/" want { print $1; exit }')
    [ -n "$ref" ] || ref=$(printf '%s\n' "$refs" | awk 'NR == 1 { print $1 }')
    {{- end }}
    {{- end }}
    if [ -z "$ref" ]; then
      # shellquote here too, via printf's arguments rather than an echo of one
      # interpolated double-quoted string: unquoted, a branch: or uri:
      # containing $(...) or `...` EXECUTES, and this is the branch a bad
      # branch: is guaranteed to reach. The ls-remote above quotes for the
      # same reason; an error message is not an exception to it.
      printf 'git: no ref %s on %s\n' {{ index .source "branch" | default "HEAD" | shellquote }} {{ .source.uri | shellquote }} >&2
      exit 1
    fi
    printf '[{"ref":"%s"}]\n' "$ref"

  # Fetch exactly the commit check pinned, shallowly. Servers that refuse a
  # by-SHA fetch fall back to fetching the branch, after which the commit is
  # in history and the checkout is still the pinned one — so a branch that
  # moved between check and in yields the version that was planned, never a
  # surprise newer one.
  in: |
    set -e
    export GIT_TERMINAL_PROMPT=0
    {{- if index .source "token_env" }}
    STEPS_GIT_TOKEN=$(printenv {{ .source.token_env | shellquote }}) || true
    if [ -z "$STEPS_GIT_TOKEN" ]; then
      printf 'git: source.token_env names %s, which is unset or empty here\n' {{ .source.token_env | shellquote }} >&2
      exit 1
    fi
    # The empty helper first clears any the clone's own config lists.
    export STEPS_GIT_TOKEN GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
    export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0= GIT_CONFIG_KEY_1=credential.helper
    export GIT_CONFIG_VALUE_1='!f() { [ "$1" != get ] || printf "username=x-access-token\npassword=%s\n" "$STEPS_GIT_TOKEN"; }; f'
    {{- else if index .source "private_key_env" }}
    key=$(mktemp) && known=$(mktemp) && trap 'rm -f "$key" "$known"' EXIT
    printenv {{ .source.private_key_env | shellquote }} > "$key" || true
    if [ ! -s "$key" ]; then
      printf 'git: source.private_key_env names %s, which is unset or empty here\n' {{ .source.private_key_env | shellquote }} >&2
      exit 1
    fi
    # ponytail: no host key is checked (Concourse's git resource does the same); add source.known_hosts when one must be.
    export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
    export GIT_SSH_COMMAND="ssh -F /dev/null -i '$key' -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=no -o UserKnownHostsFile='$known' -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
    {{- end }}
    if [ -z "${GIT_SSH_COMMAND:-}${GIT_SSH:-}$(git config --get core.sshCommand || true)" ]; then
      GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=30'
      export GIT_SSH_COMMAND
    fi
    git init -q .
    git remote add origin {{ .source.uri | shellquote }}
    {{- if index .source "tag_pattern" }}
    # The tag ref itself is fetched, so `git describe --tags --exact-match` works
    # on the checkout; and it must still name the commit check saw, or a tag
    # moved since then would build something nobody planned.
    tag={{ .version.tag | shellquote }}
    git fetch -q --no-tags --depth 1 origin "+refs/tags/$tag:refs/tags/$tag" || {
      printf 'git: could not fetch tag %s from %s\n' "$tag" {{ .source.uri | shellquote }} >&2
      exit 1
    }
    if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != {{ .version.ref | shellquote }} ]; then
      printf 'git: tag %s moved since it was checked\n' "$tag" >&2
      exit 1
    fi
    git checkout -q {{ .version.ref | shellquote }}
    {{- else }}
    git fetch -q --no-tags --depth 1 origin {{ .version.ref | shellquote }} 2>/dev/null \
      || git fetch -q --no-tags origin {{ index .source "branch" | default "HEAD" | shellquote }}
    git checkout -q {{ .version.ref | shellquote }}
    {{- end }}

  # Pushes the sha, not the name HEAD, so the version printed is what went.
  # --no-verify: a step before this one may have run the tree's own setup,
  # which can install a pre-push hook, and that hook would run holding the
  # credential.
  out: |
    set -e
    export GIT_TERMINAL_PROMPT=0
    {{- if index .source "token_env" }}
    STEPS_GIT_TOKEN=$(printenv {{ .source.token_env | shellquote }}) || true
    if [ -z "$STEPS_GIT_TOKEN" ]; then
      printf 'git: source.token_env names %s, which is unset or empty here\n' {{ .source.token_env | shellquote }} >&2
      exit 1
    fi
    # The empty helper first clears any the clone's own config lists.
    export STEPS_GIT_TOKEN GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
    export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0= GIT_CONFIG_KEY_1=credential.helper
    export GIT_CONFIG_VALUE_1='!f() { [ "$1" != get ] || printf "username=x-access-token\npassword=%s\n" "$STEPS_GIT_TOKEN"; }; f'
    {{- else if index .source "private_key_env" }}
    key=$(mktemp) && known=$(mktemp) && trap 'rm -f "$key" "$known"' EXIT
    printenv {{ .source.private_key_env | shellquote }} > "$key" || true
    if [ ! -s "$key" ]; then
      printf 'git: source.private_key_env names %s, which is unset or empty here\n' {{ .source.private_key_env | shellquote }} >&2
      exit 1
    fi
    # ponytail: no host key is checked (Concourse's git resource does the same); add source.known_hosts when one must be.
    export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
    export GIT_SSH_COMMAND="ssh -F /dev/null -i '$key' -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=no -o UserKnownHostsFile='$known' -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
    {{- end }}
    if [ -z "${GIT_SSH_COMMAND:-}${GIT_SSH:-}$(git config --get core.sshCommand || true)" ]; then
      GIT_SSH_COMMAND='ssh -o BatchMode=yes -o ConnectTimeout=30'
      export GIT_SSH_COMMAND
    fi
    branch={{ index .params "branch" | default (index .source "branch") | shellquote }}
    cd {{ .params.repository | shellquote }}
    {{- if index .params "ref" }}
    sha=$(git rev-parse --verify --quiet {{ printf "%s^{commit}" .params.ref | shellquote }}) || {
      printf 'git: params.ref %s is not a commit in %s\n' {{ .params.ref | shellquote }} {{ .params.repository | shellquote }} >&2
      exit 1
    }
    {{- else }}
    sha=$(git rev-parse HEAD)
    {{- end }}
    set -- --no-verify
    {{- if index .params "force" }}
    set -- "$@" --force
    {{- end }}
    {{- if index .params "force_with_lease" }}
    set -- "$@" "--force-with-lease=refs/heads/$branch:"{{ .params.force_with_lease | shellquote }}
    {{- end }}
    git push -q "$@" -- {{ .source.uri | shellquote }} "$sha:refs/heads/$branch" >&2
    printf '{"ref":"%s"}\n' "$sha"
