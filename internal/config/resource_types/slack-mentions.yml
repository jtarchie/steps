# The built-in `slack-mentions` resource type: every unanswered @mention of
# the bot, oldest first.
#
# Registered automatically as `type: slack-mentions` (see
# registerBuiltinResourceTypes), so a pipeline that wants to watch for
# mentions writes a resource and nothing else:
#
#   resources:
#   - name: mentions
#     type: slack-mentions
#     source:
#       channels: []   # optional; [] (the default) is every channel the bot is in
#       limit: 200     # optional; per-channel messages fetched per check, default 200
#
# Two known gaps, both inherent to a single scalar ts cursor plus
# conversations.history's own oldest/limit shape, not something a bigger
# limit: or a smarter filter fixes:
#
#   - A reply posted to a thread whose PARENT has already scrolled behind the
#     cursor is invisible. threadRequests (below) only re-checks threads
#     whose parent conversations.history still returns — once that parent's
#     ts is older than the cursor, it will never come back, so a fresh reply
#     to an old thread is never seen. Fixing this needs the cursor to
#     remember which threads are still "open" across checks, not just a
#     timestamp — a real change, not a tuning knob.
#   - More than `limit` new messages in one channel between two checks lose
#     the overflow permanently, not just delayed to next time: the cursor
#     advances to the newest ts this check saw (from ANY channel), so
#     whatever conversations.history didn't return because of `limit` now
#     sits below the new cursor and is never asked for again. Fixing this
#     needs real Slack pagination (response_metadata.next_cursor), which
#     this check does not do.
#
# Needs SLACK_BOT_TOKEN (a bot token, xoxb-) in the environment, for an app
# with chat:write, channels:history, channels:read, im:history and im:read
# (plus groups:history and groups:read for private channels), installed to
# the workspace and INVITED to every channel it should watch. Membership is
# what grants both reading the history and appearing in users.conversations,
# so /invite IS the subscribe action — there is no channel list to keep in
# sync unless source.channels narrows it. app_mentions:read is not needed:
# that is the Events API's scope, and this polls instead.
#
# 1:1 direct messages are watched too, always — every DM the bot is a party
# to, with NO @mention required (nobody types "@bot" in a 1:1 chat; every
# message there already IS the conversation). A channel/group still needs
# the explicit mention, or every message in every watched channel would
# answer. Group DMs (mpim) are NOT included — closer to a channel (several
# humans talking to each other, bot is one more party) than a 1:1, so
# skipping the mention requirement there would likely misfire the same way
# a channel without one would.
#
# Different env var name, or a second bot in the same pipeline? source.
# token_env names it instead of SLACK_BOT_TOKEN — but naming it isn't enough
# on its own: env() only reads names this TYPE already allows (env: below),
# and that list is shared by every slack-mentions resource in the pipeline.
# A resource asking for a name the type doesn't already allow adds it to its
# OWN env: too (config.Resource.Env — unioned with the type's at run time,
# widening only that one resource, not the type):
#
#   resources:
#   - name: mentions2
#     type: slack-mentions
#     env: [SECOND_BOT_TOKEN]        # this resource's own allow-list addition
#     source:
#       token_env: SECOND_BOT_TOKEN  # which name env() should actually read
#
# expr:, not check:/in:/out: — this type is a JSON HTTP API and nothing else
# (docs/expr.md). That also means it evaluates in-process and can never run
# in a container: image:/network:/user:/privileged:/container_limits: are
# load errors alongside expr:, enforced by validateExprNoContainer. Nothing
# here executes a real tool, so there is nothing to isolate — the token is
# the only thing worth protecting, and it travels as an env var the same way
# any shell resource's credential would.
#
# source.base_url overrides the API root (default https://slack.com);
# exists purely so a test can point this at an httptest.Server, since a
# hardcoded slack.com is otherwise untestable without a live workspace.
env:
  - SLACK_BOT_TOKEN

config:
  expr:
    # Three dependent calls and two fan-outs: resolve who we are, list the
    # channels we are in, fetch each channel's history since the cursor,
    # then walk the threads that have replies.
    check: |
      let base = source.base_url ?? "https://slack.com";
      let auth = {Authorization: "Bearer " + env(source.token_env ?? "SLACK_BOT_TOKEN")};
      let retry = {on: [429, 503], max: 3};
      let sourceChannels = source.channels ?? [];
      let limit = source.limit ?? 200;

      // Resolve the bot's own user id rather than hardcoding a U-id, which
      // would stop matching, silently, the moment the app is reinstalled.
      let whoami = http({url: base + "/api/auth.test"}, {headers: auth}).json;
      let me = whoami.ok ? whoami.user_id
        : fail("slack auth.test: " + (whoami.error ?? "failed"));

      // channels: [] means every channel the bot is IN, which is the only
      // set it could read anyway — conversations.history needs membership,
      // and users.conversations returns exactly the channels that grant it.
      let hasSourceChannels = len(sourceChannels) > 0;

      let discovered = hasSourceChannels ? {ok: true, channels: []} :
        http({url: base + "/api/users.conversations",
              query: {types: "public_channel,private_channel,im",
                      exclude_archived: "true", limit: "1000"}},
             {headers: auth}).json;

      let channels = hasSourceChannels ? sourceChannels :
        (discovered.ok ? (discovered.channels | map((#.id)))
                       : fail("slack users.conversations: " + (discovered.error ?? "failed")));

      // THE CURSOR: the last version this check reported, so it asks for
      // what it has not seen instead of guessing a window. Empty on the
      // first-ever check, which is what "0" covers — and what stops a cold
      // start answering a backlog nobody is waiting on.
      let oldest = version.ts ?? "0";

      // One batched call instead of N serial ones: concurrent, backing off
      // on a 429, and each result carries the request that produced it, so
      // a failure names the channel.
      let histories = http(channels | map((
          {url: base + "/api/conversations.history",
           query: {channel: #, oldest: oldest, limit: limit}}
        )), {headers: auth, concurrency: 4, retry: retry});

      // Normalize both top-level messages and thread replies to the same
      // {ch, msg} shape BEFORE filtering, so the "is this worth answering"
      // rule — a person wrote it, it is not us, and it either mentions us
      // or is a 1:1 DM — is written and tested in exactly one place, not
      // once per source and at risk of drifting between them.
      let topMessages = histories | map((
          let ch = #.request.query.channel;
          let body = #.json;
          let messages = body.ok ? body.messages
            : fail("slack conversations.history " + ch + ": " + (body.error ?? "failed"));
          messages | map(({ch: ch, msg: #}))
        )) | flatten();

      // conversations.history returns TOP-LEVEL messages only, so a mention
      // posted as a reply inside an existing thread is invisible above —
      // which is most of how people actually talk to a bot. Parents carry
      // reply_count, so this is a second batched pass over the threads that
      // have replies. The cursor is what keeps that number small.
      let threadRequests = histories | map((
          let ch = #.request.query.channel;
          (#.json.messages ?? [])
            | filter((#.reply_count ?? 0) > 0)
            | map((
              {url: base + "/api/conversations.replies",
               query: {channel: ch, ts: #.ts, oldest: oldest, limit: "200"}}
            ))
        )) | flatten();

      let replies = len(threadRequests) == 0 ? [] :
        http(threadRequests, {headers: auth, concurrency: 4, retry: retry});

      let threadMessages = replies | map((
          let ch = #.request.query.channel;
          let parent = #.request.query.ts;
          let body = #.json;
          let messages = body.ok ? body.messages
            : fail("slack conversations.replies " + ch + ": " + (body.error ?? "failed"));
          messages | filter(#.ts != parent) | map(({ch: ch, msg: #}))
        )) | flatten();

      // A message is worth answering when a person wrote it, it is not us,
      // and it either mentions us OR is in a 1:1 DM (Slack's own "D"
      // channel-id prefix — see the DM note above; no other reliable signal
      // survives both the discovery path AND an explicit source.channels
      // list, which carries no per-channel type info of its own). subtype is
      // set on everything that is not a person talking — and a channel_join
      // reads "<@UBOT> has joined the channel", which CONTAINS the mention,
      // so /invite would otherwise answer itself once per channel, forever.
      // bot_id catches relays and our own broadcasts.
      let versions = concat(topMessages, threadMessages)
        | filter(!("subtype" in #.msg) && !("bot_id" in #.msg) && #.msg.user != me)
        | filter(hasPrefix(#.ch, "D") || ((#.msg.text ?? "") contains ("<@" + me + ">")))
        | map(({channel: #.ch, ts: #.msg.ts}));

      // Oldest first, the ordering a check owes: Slack answers newest-first,
      // and across channels there is no single reversal that would do it. A
      // Slack ts is a STRING, so sorting it as one silently misorders.
      versions | sortBy(float(#.ts))

    # Both files are written here: a downstream put needs the ids, and an
    # agent step reads the thread as Slack's own JSON rather than a
    # rendering of it.
    in: |
      let base = source.base_url ?? "https://slack.com";
      let thread = http({
        url: base + "/api/conversations.replies",
        headers: {Authorization: "Bearer " + env(source.token_env ?? "SLACK_BOT_TOKEN")},
        query: {channel: version.channel, ts: version.ts},
      }).json;

      thread.ok ? {
        "version.json": toJSON(version),
        "thread.json": toJSON(thread),
      } : fail("slack conversations.replies " + version.channel + ": " + (thread.error ?? "failed"))
