# The built-in `slack-mentions` resource type: every unanswered @mention of
# the bot, oldest first.
#
# Registered automatically as `type: slack-mentions` (see
# registerBuiltinResourceTypes), so a pipeline that wants to watch for
# mentions writes a resource and nothing else:
#
#   resources:
#   - name: mentions
#     type: slack-mentions
#     source:
#       channels: []   # optional; [] (the default) is every channel the bot is in
#       limit: 200     # optional; per-channel messages fetched per check, default 200
#
# TWO WINDOWS, and keeping them apart is the whole design. `limit` messages
# of channel history is the window this check can SEE; the cursor decides
# what inside it is NEW. Collapsing the two — asking history for
# `oldest=cursor` — is what made the bot unable to answer a thread: a reply
# does not move its parent's ts, only latest_reply, so the moment anything
# newer in ANY channel moved the cursor past the parent, history stopped
# returning it, and conversations.replies is only ever asked about parents
# history returned. A thread went dark as soon as it stopped being the most
# recent thing in the workspace, which is most threads, most of the time.
#
# Two known gaps remain, both bounded by `limit` and both needing Slack
# pagination (response_metadata.next_cursor) to close, which this check does
# not do:
#
#   - A thread whose parent has scrolled past `limit` top-level messages in
#     its channel is invisible, however active the thread still is. This is
#     the residue of the bug above — no longer "as soon as the workspace
#     moves on", but still "eventually", and how long that takes is how
#     chatty the channel is. Raising `limit` buys more room only up to what
#     Slack allows, and since 2025-05-29 that depends on the APP: a bot
#     DISTRIBUTED outside the Marketplace gets 15 messages per request and
#     one request a minute, whatever limit says, which leaves this design
#     with almost no window at all. An internal app built for one workspace
#     — what a self-hosted steps pipeline normally uses — is excluded from
#     that, and honors limit as written (verified against a live workspace:
#     limit=200 answered with a full window and has_more false).
#   - More than `limit` new top-level messages in one channel between two
#     checks lose the overflow permanently, not just delayed to next time:
#     the cursor advances to the newest ts this check saw, so whatever
#     history didn't return because of `limit` now sits below it and is
#     never reported.
#
# Needs SLACK_BOT_TOKEN (a bot token, xoxb-) in the environment, for an app
# with chat:write, channels:history, channels:read, im:history and im:read
# (plus groups:history and groups:read for private channels), installed to
# the workspace and INVITED to every channel it should watch. Membership is
# what grants both reading the history and appearing in users.conversations,
# so /invite IS the subscribe action — there is no channel list to keep in
# sync unless source.channels narrows it. app_mentions:read is not needed:
# that is the Events API's scope, and this polls instead.
#
# 1:1 direct messages are watched too, always — every DM the bot is a party
# to, with NO @mention required (nobody types "@bot" in a 1:1 chat; every
# message there already IS the conversation). A channel/group still needs
# the explicit mention, or every message in every watched channel would
# answer. Group DMs (mpim) are NOT included — closer to a channel (several
# humans talking to each other, bot is one more party) than a 1:1, so
# skipping the mention requirement there would likely misfire the same way
# a channel without one would.
#
# Different env var name, or a second bot in the same pipeline? source.
# token_env names it instead of SLACK_BOT_TOKEN — but naming it isn't enough
# on its own: env() only reads names this TYPE already allows (env: below),
# and that list is shared by every slack-mentions resource in the pipeline.
# A resource asking for a name the type doesn't already allow adds it to its
# OWN env: too (config.Resource.Env — unioned with the type's at run time,
# widening only that one resource, not the type):
#
#   resources:
#   - name: mentions2
#     type: slack-mentions
#     env: [SECOND_BOT_TOKEN]        # this resource's own allow-list addition
#     source:
#       token_env: SECOND_BOT_TOKEN  # which name env() should actually read
#
# expr:, not check:/in:/out: — this type is a JSON HTTP API and nothing else
# (docs/expr.md). That also means it evaluates in-process and can never run
# in a container: image:/network:/user:/privileged:/container_limits: are
# load errors alongside expr:, enforced by validateExprNoContainer. Nothing
# here executes a real tool, so there is nothing to isolate — the token is
# the only thing worth protecting, and it travels as an env var the same way
# any shell resource's credential would.
#
# source.base_url overrides the API root (default https://slack.com);
# exists purely so a test can point this at an httptest.Server, since a
# hardcoded slack.com is otherwise untestable without a live workspace.
env:
  - SLACK_BOT_TOKEN

config:
  expr:
    # Three dependent calls and two fan-outs: resolve who we are, list the
    # channels we are in, fetch each channel's history since the cursor,
    # then walk the threads that have replies.
    check: |
      let base = source.base_url ?? "https://slack.com";
      let auth = {Authorization: "Bearer " + env(source.token_env ?? "SLACK_BOT_TOKEN")};
      // Every call carries it, not only the fan-outs. Under steps web this
      // check runs on every poll interval, which makes the two serial calls
      // below the most-hit endpoints here and the likeliest to be rate
      // limited — and a 429 on either loses the whole poll.
      let retry = {on: [429, 503], max: 3};
      let sourceChannels = source.channels ?? [];
      let limit = source.limit ?? 200;

      // Resolve the bot's own user id rather than hardcoding a U-id, which
      // would stop matching, silently, the moment the app is reinstalled.
      let whoami = http({url: base + "/api/auth.test"}, {headers: auth, retry: retry}).json;
      let me = whoami.ok ? whoami.user_id
        : fail("slack auth.test: " + (whoami.error ?? "failed"));

      // channels: [] means every channel the bot is IN, which is the only
      // set it could read anyway — conversations.history needs membership,
      // and users.conversations returns exactly the channels that grant it.
      let hasSourceChannels = len(sourceChannels) > 0;

      let discovered = hasSourceChannels ? {ok: true, channels: []} :
        http({url: base + "/api/users.conversations",
              query: {types: "public_channel,private_channel,im",
                      exclude_archived: "true", limit: "1000"}},
             {headers: auth, retry: retry}).json;

      let channels = hasSourceChannels ? sourceChannels :
        (discovered.ok ? (discovered.channels | map((#.id)))
                       : fail("slack users.conversations: " + (discovered.error ?? "failed")));

      // THE CURSOR: the last version this check reported. It is what "new"
      // means here — not what gets FETCHED (see the two windows above).
      // Empty on the first-ever check, which is what "0" covers — and what
      // stops a cold start answering a backlog nobody is waiting on.
      let cursor = version.ts ?? "0";
      let since = float(cursor);

      // One batched call instead of N serial ones: concurrent, backing off
      // on a 429, and each result carries the request that produced it, so
      // a failure names the channel.
      //
      // No oldest: this is the discovery window, and it has to reach behind
      // the cursor to find the thread parents whose replies are new. limit
      // bounds it, and Slack truncates the OLDEST end of the range, so what
      // falls off is the far end of history rather than anything recent.
      let histories = http(channels | map((
          {url: base + "/api/conversations.history",
           query: {channel: #, limit: limit}}
        )), {headers: auth, concurrency: 4, retry: retry});

      // Normalize both top-level messages and thread replies to the same
      // {ch, root, msg} shape BEFORE filtering, so the "is this worth
      // answering" rule — a person wrote it, it is not us, and it either
      // mentions us or is a 1:1 DM — is written and tested in exactly one
      // place, not once per source and at risk of drifting between them.
      //
      // root is the THREAD this message belongs to, which for a top-level
      // message is itself. It is not decoration: the message's own ts
      // identifies the mention and nothing else, and conversations.replies
      // asked for a reply's ts answers with that one message — the reply,
      // with no sign of the conversation it was written inside. Carrying the
      // root is what lets in: fetch the actual thread, and the reply post
      // back into it.
      let topMessages = histories | map((
          let ch = #.request.query.channel;
          let body = #.json;
          let messages = body.ok ? body.messages
            : fail("slack conversations.history " + ch + ": " + (body.error ?? "failed"));
          messages | map(({ch: ch, root: #.ts, msg: #}))
        )) | flatten();

      // conversations.history returns TOP-LEVEL messages only, so a mention
      // posted as a reply inside an existing thread is invisible above —
      // which is most of how people actually talk to a bot. A parent carries
      // latest_reply, so a thread with nothing new since the cursor is
      // skipped without a call: that gate, not the discovery window, is what
      // keeps this pass small. oldest = the cursor because here it IS the
      // question — which replies are new — and Slack returns the parent
      // regardless of it, so the parent filter below is not load-bearing.
      //
      // A parent with NO latest_reply is fetched rather than skipped. The
      // alternative — falling back to the parent's own ts — reads an old
      // parent as "nothing new" and puts the thread back in the dark, which
      // is the exact bug this file exists to not have; one wasted call is
      // the cheaper way to be wrong.
      //
      // Not free, and the cost is not "how much people are talking": the
      // bot's OWN answer moves latest_reply past a cursor that only reported
      // MENTIONS advance, so every thread it has already answered keeps
      // qualifying — one call per answered thread per poll — until some
      // newer mention pushes the cursor past that answer. Closing that needs
      // the cursor to remember more than one timestamp, the same change the
      // gaps above are waiting on.
      // A COLD START asks about the most recently active threads and stops.
      //
      // The cursor is what keeps this fan-out small — a thread is asked about
      // only when its latest_reply is newer. On a first check there is no
      // cursor, since is 0, and `latest_reply > 0` is true of every thread
      // that has ever been replied to: one call each, across the whole
      // discovery window of every channel the bot is in.
      //
      // That is not just slow, it is a trap that cannot open itself. One
      // rate-limited call fails the check (deliberately — see below), a
      // failed check reports no version, no version means no cursor, and the
      // next poll does exactly the same thing. A workspace with more threads
      // than the rate limit allows calls for is a watcher that never runs
      // once, and the only ways out are a quieter workspace or a hand-written
      // --pin.
      //
      // A first check only has to establish WHERE TO START. Everything below
      // the newest version it reports is marked already-taken by the
      // cold-start rule in internal/trigger, so calls spent discovering older
      // threads buy nothing that is ever built. Bounded rather than skipped
      // because the mention people actually write is a reply inside a thread
      // (see the note above threadRequests' filter), and the newest of those
      // still has to be findable on the first check.
      let coldStart = version.ts == nil;
      let coldStartThreads = 5;

      let threadCandidates = histories | map((
          let ch = #.request.query.channel;
          (#.json.messages ?? [])
            | filter((#.reply_count ?? 0) > 0 && (!("latest_reply" in #) || float(#.latest_reply) > since))
            // active is what "most recent" is measured on. A parent with no
            // latest_reply falls back to its own ts rather than dropping out
            // of the ordering entirely.
            | map(({ch: ch, ts: #.ts, active: float(#.latest_reply ?? #.ts)}))
        )) | flatten();

      // sortBy(-active) rather than a "desc" argument: the negation sorts the
      // same way and does not depend on which sortBy overload this expr
      // version carries.
      let threadRequests = (coldStart
          ? (threadCandidates | sortBy(-#.active) | take(coldStartThreads))
          : threadCandidates)
        | map((
          {url: base + "/api/conversations.replies",
           query: {channel: #.ch, ts: #.ts, oldest: cursor, limit: "200"}}
        ));

      let replies = len(threadRequests) == 0 ? [] :
        http(threadRequests, {headers: auth, concurrency: 4, retry: retry});

      let threadMessages = replies | map((
          let ch = #.request.query.channel;
          let parent = #.request.query.ts;
          let body = #.json;
          let messages = body.ok ? body.messages
            : fail("slack conversations.replies " + ch + ": " + (body.error ?? "failed"));
          messages | filter(#.ts != parent) | map(({ch: ch, root: parent, msg: #}))
        )) | flatten();

      // A message is worth answering when a person wrote it, it is not us,
      // and it either mentions us OR is in a 1:1 DM (Slack's own "D"
      // channel-id prefix — see the DM note above; no other reliable signal
      // survives both the discovery path AND an explicit source.channels
      // list, which carries no per-channel type info of its own). subtype is
      // set on everything that is not a person talking — and a channel_join
      // reads "<@UBOT> has joined the channel", which CONTAINS the mention,
      // so /invite would otherwise answer itself once per channel, forever.
      // bot_id catches relays and our own broadcasts.
      //
      // Newness is asserted here, not delegated to the request: the
      // discovery window deliberately reaches behind the cursor, so
      // everything it re-sees would otherwise be reported again on every
      // poll. (Nothing would be answered twice — a version already recorded
      // triggers nothing — but a check that re-reports its whole window
      // every poll is a check whose report says nothing about what changed.)
      // It comes FIRST because it is the cheapest and by far the most
      // selective of the three: the window is `limit` messages per channel
      // regardless of traffic, and in a steady state nearly all of them are
      // old.
      let versions = concat(topMessages, threadMessages)
        | filter(float(#.msg.ts) > since)
        | filter(!("subtype" in #.msg) && !("bot_id" in #.msg) && #.msg.user != me)
        | filter(hasPrefix(#.ch, "D") || ((#.msg.text ?? "") contains ("<@" + me + ">")))
        | map(({channel: #.ch, ts: #.msg.ts, thread_ts: #.root}));

      // Oldest first, the ordering a check owes: Slack answers newest-first,
      // and across channels there is no single reversal that would do it. A
      // Slack ts is a STRING, so sorting it as one silently misorders.
      versions | sortBy(float(#.ts))

    # Both files are written here: a downstream put needs the ids, and an
    # agent step reads the thread as Slack's own JSON rather than a
    # rendering of it.
    #
    # thread_ts, NOT ts: conversations.replies is a thread endpoint, and the
    # ts of a reply is not a thread id — asked for one it answers with that
    # single message and nothing else, so an agent handed "the thread" got
    # the sentence that named it and no idea what it was about. Falling back
    # to ts covers a version recorded before this field existed, and is
    # exactly right for a top-level mention, where the two are the same.
    #
    # A third gap, and the one that bites hardest when it bites: limit is
    # explicit rather than left to Slack's default (1000 — but 15 for a bot
    # distributed outside the Marketplace, per the note above), and
    # conversations.replies returns the
    # EARLIEST messages of the range first. So a thread longer than limit is
    # truncated at the NEW end — the end the mention is at. Closing it needs
    # the same pagination the check does not do.
    in: |
      let base = source.base_url ?? "https://slack.com";
      let thread = http({
        url: base + "/api/conversations.replies",
        headers: {Authorization: "Bearer " + env(source.token_env ?? "SLACK_BOT_TOKEN")},
        query: {channel: version.channel, ts: version.thread_ts ?? version.ts, limit: "1000"},
      }).json;

      thread.ok ? {
        "version.json": toJSON(version),
        "thread.json": toJSON(thread),
      } : fail("slack conversations.replies " + version.channel + ": " + (thread.error ?? "failed"))
