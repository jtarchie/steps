system_file: "@builtin/builder"
tools:
  - read_file
  - list_dir
  - run_shell
  - write_file
  - edit_file
  - search_files
  - agent: "@builtin/explorer"
    description: >
      Fast read-only agent for codebase exploration. Use this instead of
      chaining multiple search/read calls when you need to find files by
      pattern, search code for keywords, or locate where specific
      functionality is implemented. Pass your search task in `request` — be
      specific about what to find, any file patterns or naming conventions
      to search. Returns findings concisely in a single message.
max_turns: 50
