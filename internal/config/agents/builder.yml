description: >
  Full-access coding agent. Use for implementing changes — code, tests,
  docs. Has all built-in tools including shell and a read-only explorer
  sub-agent for codebase searches.
system_file: "@builtin/builder"
tools:
  - read_file
  - list_dir
  - run_shell
  - write_file
  - edit_file
  - search_files
  - agent: "@builtin/explorer"
max_turns: 50
