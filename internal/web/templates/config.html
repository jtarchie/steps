{{define "page"}}
<div class="pagehead">
  <div>
    <h1 class="prompt"><b>steps config {{short .SHA}}</b></h1>
    <p class="metaline">{{t "config.note"}}<span class="sep">·</span><span class="faint">{{.SHA}}</span></p>
  </div>
</div>

<div class="codeblock numbered"><pre class="json code lineno" aria-hidden="true">{{.Lines}}</pre><pre class="json code"><span class="cfg">{{.Body}}</span></pre></div>
{{range .Includes}}
<h2 class="eyebrow">{{.Path}}</h2>
<div class="codeblock numbered"><pre class="json code lineno" aria-hidden="true">{{.Lines}}</pre><pre class="json code">{{.Body}}</pre></div>
{{end}}
{{end}}
