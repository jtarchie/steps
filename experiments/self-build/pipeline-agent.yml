# Walks the roadmap one story at a time -- plan, implement, gate, review, PR --
# using steps' own `agent:` step type rather than shelling out to a coding CLI,
# which is what lets the whole experiment run against a local or cheap model.
# An earlier variant (pipeline.yml, driving `claude -p` from task: steps) has
# been deleted; see README.md.
#
# The repository under development is an ORDINARY INPUT ARTIFACT (`get: repo`),
# not a path the agents reach out to, and that is the whole shape of this
# file. Each agent works in its own workspace where `repo/` is a real git
# clone, so the built-in file tools reach it with no special configuration.
# An earlier revision pointed at a checkout by absolute path, which those
# tools cannot touch (they are confined to the step's workspace), so every
# read/list/write/edit was re-implemented as a custom shell tool that `cd`-ed
# there first -- and `coder` was handed a general-purpose shell just to get
# its narrow tools within reach. Making the repo an input deleted ~190 lines
# of that, and left the narrow tools genuinely narrow.
#
# `put: repo` commits, pushes to a per-story branch, and opens a PR via
# `gh pr create`. A failed review never reaches it, so the real checkout
# is never left dirty by an abandoned attempt.
#
# gopls is granted ONE tool (plus go_diagnostics for coder): finding every
# call site of a symbol without false-positiving on a comment or missing a
# differently-spelled one is the thing a text search genuinely cannot do.
# Finding WHERE something lives is search_files' job. MCP tools are exposed
# with the server name prefixed ("gopls__go_symbol_references"). Needs `gopls`
# on PATH.
#
# Two model slots, as YAML anchors: `&fast` (planner and reviewer, which read
# and judge -- GLM-4.7-Flash) and `&coding` (coder, which writes -- Qwen3 Coder
# Flash). Both are cheap and both quote a real cached-input price, which is
# what makes the prompt caching in internal/agent/openrouter.go worth having;
# a model with no cache discount pays full price for the whole re-sent history
# every turn. Swap either for whatever you prefer, or point both at the same
# slug to go back to one model everywhere.
#
# Both resources are GitHub-backed and need `gh` authenticated (GH_TOKEN or
# gh auth login): `repo` clones and opens the PR, and `stories` reads the
# roadmap from open issues labeled `story` rather than from files in the repo.
# That last part is what lets the pipeline retire its own work -- the PR body
# gets a "Closes #N", so a merged story stops appearing in the next check:,
# with nothing to edit here.
resource_types:
- name: stories
  config:
    # One version per OPEN issue labeled `story`. The stories used to be
    # markdown files in the repo; an issue carries the same text plus three
    # things a file could not: state (closing an issue retires the story, with
    # no edit here), a label to select on, and a number a PR can reference so
    # merging closes it.
    #
    # `num` is the 3-digit story number parsed out of the title, NOT the issue
    # number: it names the branch and the plans/<num>.md and prs/<num>/ paths,
    # which already exist for earlier stories. An issue whose title doesn't
    # match the "Story NNN:" shape is skipped rather than guessed at.
    #
    # sort_by(.num) then .[0:limit] is the story SELECTOR. Every open story is
    # a candidate, so limit: 1 (the default in resources: below) means "work
    # the lowest-numbered open story", which is what the old glob did by being
    # hand-narrowed to 001-*.md. Raise it to walk several per run -- but note
    # `version: every` runs them one after another, and a cold story costs the
    # coder up to 45m, so the wall-clock is roughly linear in this number.
    check: |
      gh issue list \
        --repo {{ .source.repo | shellquote }} \
        --label {{ .source.label | shellquote }} \
        --state open --limit 100 \
        --json number,title \
        --jq '[ .[]
                | select(.title | test("^Story [0-9]{3}:"))
                | { num: (.title | capture("^Story (?<n>[0-9]{3}):").n),
                    issue: (.number | tostring) } ]
              | sort_by(.num)
              | .[0:{{ .source.limit }}]'
    # The story TEXT now comes from the issue body, so unlike the file era this
    # materializes the actual prose rather than a pointer into repo/.
    in: |
      set -e
      echo {{ .version.num | shellquote }} > ./num
      echo {{ .version.issue | shellquote }} > ./issue
      gh issue view {{ .version.issue | shellquote }} \
        --repo {{ .source.repo | shellquote }} --json title --jq .title > ./title
      gh issue view {{ .version.issue | shellquote }} \
        --repo {{ .source.repo | shellquote }} --json body --jq .body > ./body.md

- name: repo
  config:
    check: |
      gh api repos/jtarchie/steps/commits?per_page=1 --jq '[{ref: .[0].sha}]'
    # A clone, not a copy: agents get a real working tree, so go test,
    # golangci-lint and git diff all behave normally, and the origin is
    # untouched until the put.
    #
    # GIT_CONFIG_GLOBAL=/dev/null is load-bearing, not hygiene. An operator's
    # ~/.gitconfig may carry `url.ssh://git@github.com/.insteadOf
    # https://github.com/`, which silently rewrites this HTTPS clone to SSH
    # and makes it depend on a loaded ssh-agent -- so it passes on the machine
    # that set it up and fails with "Permission denied (publickey)" the moment
    # the agent stops answering. Dropping the global config strips the rewrite;
    # the credential helper then puts gh's own token back in its place, so
    # auth comes from the same `gh auth` this resource already requires. The
    # commits below pass identity with `git -c`, so nothing else here wanted
    # the global config anyway.
    in: |
      set -e
      export GIT_CONFIG_GLOBAL=/dev/null
      export GIT_CONFIG_COUNT=1
      export GIT_CONFIG_KEY_0="credential.https://github.com.helper"
      export GIT_CONFIG_VALUE_0="!gh auth git-credential"
      git clone --quiet https://github.com/jtarchie/steps .
      git checkout --quiet {{ .version.ref | shellquote }}
    # Runs with the build workspace as cwd, so stories/ and repo/ are both
    # visible. An unchanged tree exits cleanly rather than failing the job.
    out: |
      set -e
      # Same rewrite bypass as in:, for the same reason -- origin is an HTTPS
      # URL, so a global insteadOf would send this push over SSH too.
      export GIT_CONFIG_GLOBAL=/dev/null
      export GIT_CONFIG_COUNT=1
      export GIT_CONFIG_KEY_0="credential.https://github.com.helper"
      export GIT_CONFIG_VALUE_0="!gh auth git-credential"
      num="$(cat stories/num)"
      issue="$(cat stories/issue)"
      # The title already begins "Story NNN: "; the commit subject says the
      # number itself, so strip the prefix rather than printing it twice.
      subject="$(sed -E 's/^Story [0-9]{3}: *//' stories/title)"
      cd {{ .params.path | shellquote }}
      git add -A
      git diff --cached --quiet && exit 0
      git -c user.name=steps -c user.email=steps@localhost \
        commit --quiet -m "self-build: story $num ($subject)"
      branch="self-build/story-$num"
      # refs/heads/ must be spelled out: in: pins the clone with `git checkout
      # <sha>`, so HEAD here is always DETACHED, and git refuses to guess a
      # destination refname from a detached HEAD ("not a full refname").
      git push --quiet origin HEAD:refs/heads/"$branch"
      # Closes #N is appended here, not asked of the reviewer: it is mechanical,
      # and it is what makes merging a self-build PR retire its own story --
      # which in turn is what drops it out of the next check:.
      body="$(mktemp)"
      cat "experiments/self-build/prs/$num/body.md" > "$body"
      printf '\nCloses #%s\n' "$issue" >> "$body"
      gh pr create \
        --base main \
        --head "$branch" \
        --title "$(cat experiments/self-build/prs/$num/title)" \
        --body-file "$body"

# gopls' MCP server as a local subprocess. cwd: is RELATIVE, so it resolves
# against each agent step's own working directory -- gopls indexes the same
# materialized clone the agents read and edit, rather than some other
# checkout whose paths they could not open.
mcp_servers:
- name: gopls
  command: gopls
  args: [mcp]
  cwd: repo

resources:
- name: stories
  type: stories
  source:
    repo: jtarchie/steps
    label: story
    limit: 1          # lowest-numbered open story only; see the type's check:
- name: repo
  type: repo
  source:
    uri: https://github.com/jtarchie/steps

agents:
# Research only. Holds no shell, so "planner cannot
# modify the repo" is structural rather than a promise: the only write
# it can do is write_file, constrained to its workspace.
- name: planner
  # GLM-4.7-Flash: a 30B-class model tuned for agentic coding and long-horizon
  # task planning, which is exactly what planner and reviewer do. $0.06/M in,
  # $0.40/M out, $0.01/M cached read -- a 6x discount on the re-sent history
  # that dominates a tool-calling conversation. Served by four providers whose
  # context ceilings differ (128k-202k), so the x-session-id pin in
  # internal/agent/openrouter.go is doing real work here.
  source: &fast { model: opencode/deepseek-v4-pro }
  max_turns: 200
  system_file: "@builtin/planner"
  tools:
  - mcp: gopls
    tools: [go_symbol_references]
    max_output_bytes: 6000
  - read_file
  - list_dir
  - search_files
  - write_file

# Implements the plan end to end: code, tests, docs/examples. This is the one
# agent doing sustained surgical Go edits (148 tool calls in the run that
# prompted the split), so it gets its own model rather than sharing *fast.
#
# Qwen3 Coder Flash: a coding agent model specializing in autonomous
# programming via tool calling, which is the failure mode that matters over
# 150 turns -- one malformed tool call costs a turn. $0.195/M in, $0.975/M
# out, $0.039/M cached read, 1M context so the conversation never needs
# compacting. Single first-party provider (Alibaba), so there is exactly one
# prompt cache to stay warm in.
- name: coder
  # TEMPORARY: this slot wants deepseek-v4-flash, but that model went
  # unavailable upstream mid-experiment -- a 5-token request to it times out
  # while deepseek-v4-pro and glm-5.2 on the same gateway answer in seconds.
  # Every failure in that run landed on this agent and none on the planner,
  # which is the same-gateway control. Pointed at -pro until -flash answers
  # again; restoring it is this one line.
  source: &coding { model: opencode/deepseek-v4-pro }
  max_turns: 200
  system_file: "@builtin/builder"
  tools:
  - mcp: gopls
    tools: [go_symbol_references, go_diagnostics]
    max_output_bytes: 6000
  - read_file
  - list_dir
  - search_files
  - edit_file
  - write_file
  - run_shell
  - name: verify_gate
    description: >
      Run the whole objective gate in one call and report PASS or FAIL: go
      fmt && go mod tidy && golangci-lint run && go test ./... && go build.
      No arguments. Call it after every edit -- a pass from before your last
      change is worthless. Trimmed to the last 300 lines, where the failures
      are. Do not type this chain into run_shell yourself; getting the &&
      order wrong is how a past run reported success on a broken tree.
    run: |
      cd repo || exit 1
      rc=0
      out=$(go fmt ./... 2>&1 && go mod tidy 2>&1 && golangci-lint run 2>&1 \
            && go test ./... 2>&1 && go build -v 2>&1) || rc=$?
      printf '%s\n' "$out" | tail -n 300
      if [ "$rc" -eq 0 ]; then
        printf '\nGATE: PASS\n'
      else
        printf '\nGATE: FAIL (exit %s) -- fix, then call verify_gate again\n' "$rc"
      fi
      exit "$rc"

# Quality gate before the put.
#
# No search_files and no list_dir, deliberately. Those are the open-ended
# exploration tools, and open-ended exploration is exactly what sank an earlier
# run: with a 25KB diff already in hand the reviewer spent most of its turns
# re-deriving internal/pipeline from scratch, pushing its context past 80k
# tokens and its latency to ~40s/turn, and it timed out before reaching a
# verdict. Its evidence is the diff and the planner's plan; read_file verifies
# a specific claim it intends to cite, and gopls answers the one question text
# search genuinely cannot (every call site of a symbol, for the sibling check).
#
# try_pipeline is the exception to "no execution", and it is here because the
# read-only posture had a specific, measured cost. This reviewer returned PASS
# on story 001; a second review found ten confirmed defects, and every one was
# confirmed by building the binary and running a three-line pipeline. Four of
# them were docs asserting behavior the code never had -- a class a reader
# cannot catch at all, since the doc and the code are separately plausible and
# only disagree at runtime.
#
# It is NOT a relaxation of the context-budget rule above: a probe is a
# pipeline the reviewer writes to answer one question, not a search. It IS a
# relaxation of the no-shell posture -- a probe's `run:` is a shell, so this is
# shell by proxy, and nothing confines it. That does not lower the pipeline's
# floor: `coder` already holds an unrestricted run_shell against the same
# workspace, so arbitrary model-authored shell was already inside the trust
# boundary. What the reviewer still cannot do is WRITE to the repo -- it has no
# edit_file and no write_file target inside repo/ other than its own critique
# and PR files.
- name: reviewer
  source: *fast
  max_turns: 200
  system_file: "@builtin/reviewer"
  tools:
  - mcp: gopls
    tools: [go_symbol_references]
    max_output_bytes: 6000
  - read_file
  - write_file
  - name: repo_diff
    description: >
      Show what this attempt actually changed. No arguments. Returns `git
      status --short`, `git diff --stat HEAD`, then `git diff HEAD` -- HEAD,
      not `main...HEAD`, because the implementer does not commit, so the work
      under review is UNCOMMITTED. A `??` line is a NEW file that will not
      appear in the diff, so read it with read_file. An oversized diff spills
      to a file; read_file accepts the absolute path from the pointer.
    run: |
      cd repo || exit 1
      printf -- '--- git status --short (a "??" line is a NEW file) ---\n'
      git --no-pager status --short
      printf -- '\n--- git diff --stat HEAD ---\n'
      git --no-pager diff --stat HEAD
      printf -- '\n--- git diff HEAD (the uncommitted work under review) ---\n'
      git --no-pager diff HEAD
  - name: try_pipeline
    description: >
      RUN a pipeline against the build under review and return its transcript.
      One argument, `yaml`: the full text of a small pipeline. It is built from
      the working tree, run with `steps test` (every job, in order, evaluating
      any `assert:`), and the output plus the exit code come back to you.
      This is how you CHECK a claim instead of inferring it. Use it on every
      behavioral bullet the diff adds to docs/, on every acceptance criterion
      in the story, and on any control-flow reasoning of your own you are about
      to cite -- write the smallest pipeline that would be WRONG if the claim
      held, and run it. A non-zero exit is a normal, often expected result, not
      a tool failure. Keep each pipeline to a few steps; `run: exit 1` and
      `run: echo MARKER` are usually all a probe needs.
      MAKE THE PROBE SELF-CHECKING wherever you can, with a job-level
      `assert: {execution: [a, b, c]}` naming the exact steps and hooks that
      must run, or a step `assert: {stdout: MARKER}`. Then PROBE EXIT is the
      answer and you are not eyeballing a transcript: a mismatch prints
      `want: [...]` / `got: [...]`, which names the missing step for you. Fall
      back to reading the transcript only for claims no assert can express.
      KEEP PROBES MODELLESS. This tool runs with the host env stripped to a
      short allowlist (PATH, HOME, locale, TMPDIR, proxies) -- no API keys, by
      design -- so an `agent:` step in a probe dies with `environment variable
      "..." (api_key_env) is not set`. That is the sandbox, NOT a defect in the
      change. task:/put:/get:/when:/to:/hooks/assert: all work fine and cover
      every control-flow claim. For a claim that genuinely needs a model, do
      not probe it: say so in the critique, and check instead that an e2e test
      covers it against the fake provider seam (newFakeLLM in
      fakeprovider_test.go) -- that is how this repo tests agent behavior.
      Two refusals you may see. `REFUSED` means the probe tried to run steps on
      a pipeline from inside a step; rewrite it to express the behavior
      directly. `HARNESS VOID` means this build failed an internal control --
      it broke `assert:` evaluation itself, so no probe result in this review
      means anything. That is a serious defect in the change: report it and
      FAIL. Every probe is bounded at 120s, and `PROBE EXIT: 124` means it
      hung -- usually a finding about the change, not about the probe.
    max_output_bytes: 8000
    run: |
      cd repo || exit 1
      # Built OUTSIDE the git tree: a binary inside repo/ would show up as a
      # `??` line in repo_diff and read as an untracked file under review.
      bin="$(cd .. && pwd)/steps-review-bin"
      build=$(go build -o "$bin" . 2>&1) || {
        printf 'BUILD FAILED -- cannot probe this tree:\n%s\n' "$build"
        exit 1
      }
      probe="$(mktemp -d)"
      printf '%s\n' {{ .args.yaml | shellquote }} > "$probe/probe.yml"

      # NO RE-ENTRY. A probe runs steps; letting it run steps ON this pipeline
      # (or on itself) nests the whole experiment inside one review turn --
      # cloning, agent calls, spend, and no bound. `steps` is not on PATH here,
      # which makes it unlikely rather than impossible: repo/ holds the source
      # and $bin is one directory up.
      if grep -qnE '(^|[^[:alnum:]_-])(steps|steps-review-bin|go[[:space:]]+run)[[:space:]]+(run|test|watch|plan|\.)([[:space:]]|$)|pipeline-agent\.yml' "$probe/probe.yml"; then
        printf 'REFUSED: this probe invokes steps (or this pipeline) from inside\n'
        printf 'a step. A probe is a pipeline to RUN, not a pipeline that runs\n'
        printf 'pipelines. Express the behavior directly with task:/put:/when:/\n'
        printf 'to:/hooks/assert: instead.\n'
        exit 1
      fi

      # A bound. The probe is built from the tree UNDER REVIEW, so a change
      # that introduces an unbounded to: loop or a hung command would otherwise
      # spin here until the whole 30m step timeout is gone and the review is
      # lost. Two minutes is generous for a few steps.
      limit=120
      to=""
      for t in timeout gtimeout; do
        command -v "$t" >/dev/null 2>&1 && { to="$t $limit"; break; }
      done
      [ -n "$to" ] || printf 'NOTE: no timeout(1) here; this probe is UNBOUNDED.\n\n'

      # CONTROL FIRST. The probe binary is the artifact under test, so a change
      # that breaks assert evaluation would make every probe report PASS and
      # this tool would cheerfully confirm whatever it was asked. This control
      # asserts an execution list that CANNOT hold; a healthy build fails it
      # (exit 2). If it passes, the harness is lying and every other probe in
      # this review is void. Verified: patching checkExecution to always return
      # nil flips this control from exit 2 to exit 0.
      printf 'jobs:\n- name: harness-control\n  assert:\n    execution: [__no_such_step__]\n  plan:\n  - task: real\n    run: "true"\n' > "$probe/control.yml"
      crc=0
      (cd "$probe" && $to "$bin" test control.yml) >/dev/null 2>&1 || crc=$?
      if [ "$crc" -eq 0 ]; then
        printf 'HARNESS VOID: the control probe -- an assert that cannot hold --\n'
        printf 'PASSED on this build. assert evaluation is broken by the change\n'
        printf 'under review, so no probe result means anything. That is itself\n'
        printf 'a defect: report it and FAIL the review.\n'
        exit 1
      fi

      # internal/shell.HostEnv strips this shell to a short allowlist that
      # deliberately excludes every api_key_env secret, so an agent-backed
      # probe cannot authenticate and dies looking like a bug in the change.
      # Say so up front rather than letting the model misattribute it. Advisory
      # only -- probing that a config with an agent: is REJECTED at load time
      # is legitimate and never reaches credentials.
      if grep -qE '^[[:space:]]*-?[[:space:]]*agent:' "$probe/probe.yml"; then
        printf 'NOTE: this probe declares an agent:. No API keys reach this\n'
        printf 'sandbox, so if it fails on api_key_env that is the harness,\n'
        printf 'not the change under review. Probe control flow modelless.\n\n'
      fi
      rc=0
      out=$(cd "$probe" && $to "$bin" test probe.yml 2>&1) || rc=$?
      printf '%s\n' "$out" | tail -n 200
      [ "$rc" -eq 124 ] && printf '\n(timed out after %ss -- the probe hung)\n' "$limit"
      # Always exit 0: the probe's own exit code is the OBSERVATION, reported
      # here as data. Failing the tool call would read as "the tool broke" and
      # invite a pointless retry of a probe that worked exactly as intended.
      printf '\nPROBE EXIT: %s\n' "$rc"

jobs:
- name: self-build
  plan:
  - get: stories
    version: every
  - get: repo
  - agent: planner
    inputs: [stories, repo]
    context_paths: [repo/CLAUDE.md]
    attempts: 2       # whole-conversation restart on a transport failure
    timeout: 20m      # per attempt, not total -- see docs/attempts-timeout.md
    # Forces a shift-change report for the coder before this step may end.
    # The plan document is the PR artifact; the note is the operational
    # handoff, and it carries a computed list of every file this step actually
    # touched -- which is what stops the coder re-walking the same tree.
    handoff: { note: true }
    prompt: |
      Plan ONE implementation step for ONE story. You have NO shell.
      The only file you write is the plan document.

      1. read_file on stories/body.md — that IS the story, the text of a
         GitHub issue, and it is the contract you are planning against. Its
         "Acceptance criteria" checklist is the definition of done; your plan
         must say which change satisfies each one. stories/num is the story
         number the paths below use, and stories/title is its one-line
         summary. (repo/CLAUDE.md is already available via read_file — follow
         it.)
      2. Find where the feature must integrate. The feature the story ASKS
         FOR does not exist yet, so never search for its own name. Relevant:
         repo/internal/{config,pipeline,merkle,store,trigger,agent}. For
         anything you plan to CHANGE, run the sibling check -- that is what
         tells you whether this story touches one code path or several. Do
         not repeat a query you have already run.
      3. Read the files you found. Page the big ones.
      4. Write the plan to repo/experiments/self-build/plans/{num}.md. File
         by file: what changes, what tests are needed, which docs/*.md and
         examples/*.yml need updating. State explicitly whether the change applies to more
         than one structurally similar code path -- list the sibling sites
         gopls returned, with file:line -- and if so require a single test
         covering all of them. Do not describe a file you have not read.
  - agent: coder
    inputs: [stories, repo]
    context_paths: [repo/CLAUDE.md]
    # attempts: covers transport faults only. Deliberately still 2, after a
    # run where raising it to 6 was the wrong reflex: the 500s and connection
    # resets it was meant to absorb all came from this step's model being down
    # upstream, and no retry count survives that. Each attempt restarts the
    # WHOLE conversation -- there is no per-request retry in the transport
    # stack (internal/agent/provider.go's agentHTTPClient) -- so a high
    # attempts: mostly buys a bigger bill for the same failure. Raise it only
    # for faults a fresh conversation could actually clear.
    attempts: 2
    # A timeout now ends the step outright rather than restarting the whole
    # conversation (see docs/attempts-timeout.md), so this has to be a budget
    # the work actually fits in. A cold run took ~42m across two attempts; 45m
    # is that with headroom.
    timeout: 45m
    # Both directions on one step: a redo gets a previous_run tool over the
    # last verdict (backward), and it writes the next agent a shift-change
    # report (forward).
    handoff: { tool: true, note: true }
    prompt: |
      Implement ONE story's already-written plan. repo/ is a real git clone,
      yours to edit.

      0. `run_shell` on `cd repo && git status --short && git diff --stat`
         BEFORE anything else. An `attempts:` restart throws away the
         conversation but NOT the workspace, so a dirty tree here means a
         previous attempt of THIS step was cut off mid-flight by a transport
         fault and its edits are still on disk. Read those files and continue
         from them -- do not redo work that is already there, and do not
         revert it. A clean tree means you are starting cold.
      1. read_file on stories/num, then on the plan at
         repo/experiments/self-build/plans/{num}.md. stories/body.md is the
         story itself (a GitHub issue) — read it too: the plan is an
         interpretation of it, and the issue's "Acceptance criteria" is what
         the reviewer will hold the result to. (repo/CLAUDE.md is already
         available via read_file — follow it exactly.)
         The planner's handoff note is ALREADY in your context: its
         "Files touched" section is computed by the runner, not written by
         the planner, so it is a reliable record of where the planner
         actually looked. Check it before you search for anything.
      2. Implement it end to end: code, tests, and doc/example updates,
         following CLAUDE.md exactly. If the story adds a behavior or guard
         to one of several similar code paths, run the sibling check and
         apply the SAME treatment to all of them, not just the first.
      3. After each edit, gopls__go_diagnostics on the file you touched.
         gopls has no LSP client feeding it your live edits, so its view can
         go stale: verify_gate is the real gate, not diagnostics.
      4. verify_gate. Keep fixing and re-calling until it says PASS, and call
         it again after EVERY further edit -- a PASS from before your last
         change proves nothing.
      5. Do not commit. A later step publishes only if the review passes.

      If a `<transition_context>` block appears below, you were sent back
      here after a previous attempt. A failed build/lint/test gate: just call
      verify_gate, your changes are still here so you will see the errors
      directly. A failed review: call previous_run for the reviewer's note,
      and read_file on repo/experiments/self-build/critiques/{num}.md.
  - task: build-check
    inputs: [repo]
    run: |
      set -o pipefail
      cd repo
      # Objective gate: cheap and deterministic, so an obviously-broken
      # attempt is rejected before spending reviewer turns on it.
      golangci-lint run && go test ./... && go build -v
    to:
      failure: coder
    max_visits: 4
  - agent: reviewer
    inputs: [stories, repo]
    context_paths: [repo/CLAUDE.md]
    attempts: 2
    timeout: 30m
    prompt: |
      You are the quality gate before this story's changes are published.
      Lint, tests and build already passed — your job is the correctness a
      compiler cannot check. You do not edit files. A concern you cannot
      cite as file:line is not a concern.

      The diff and the plan are your evidence. You are not exploring this
      codebase -- the planner already did, and its findings are in the plan.
      Read a file only to check a specific claim you intend to cite.

      Reading is the weaker of your two instruments. try_pipeline RUNS a
      pipeline against this build and hands you the transcript, and a claim
      you have RUN is worth more than a claim you have reasoned about. The
      last time this step passed a change on reading alone, it approved ten
      defects, and every one of them was a three-line pipeline away from
      being obvious. Prefer the probe. Budget for it: a probe costs seconds,
      and you have 200 turns.

      The coder's handoff note is already in your context. Everything the
      coder WROTE in it is a claim, not evidence -- verify each against the
      diff before relying on it, and treat its "watch_out" section as a list
      of places to look hardest, not as reassurance. Its final "Files
      touched" section is different: the runner computed that from the run
      itself, so it is mechanical truth, and it tells you which parts of the
      diff deserve your attention first.

      1. read_file on stories/num and stories/body.md — the story itself, a
         GitHub issue. Its "Acceptance criteria" checklist is the contract:
         your critique must walk it item by item and cite, per item, the
         file:line that satisfies it. An item you cannot cite is a FAIL, and
         a requirement stated in the issue's prose but absent from the plan
         is exactly the kind of miss the plan cannot warn you about. Then
         read the plan the implementer worked from,
         repo/experiments/self-build/plans/{num}.md -- it names the files that
         were supposed to change and the sibling sites gopls returned.
         (repo/CLAUDE.md is already available via read_file.)
      2. repo_diff. A `??` line is a NEW file that does not appear in the
         diff at all -- read each of those with read_file.
      3. PROBE, before you judge. Build a list of every behavioral claim this
         change makes -- each bullet the diff adds or edits under docs/, each
         acceptance criterion in the story, each new example job -- and run
         try_pipeline on each one. Write the pipeline that would be WRONG if
         the claim held, and give it an `assert:` so the probe answers itself.
         Three that would have caught real defects:
           - "the inner step's hooks still fire" -> wrap a failing task whose
             on_failure runs `alert`, and assert
             `execution: [flaky, alert, after]`. On a build where the hook is
             skipped this FAILS with `got: [flaky after]` -- it names the
             missing hook for you.
           - "routing sees the real outcome" -> give the step a
             to: {failure: X, success: Y} and assert the execution list
             contains X, not Y.
           - "steps test still catches a broken assert" -> write the broken
             assert and see whether the run reports PASS.
         A claim whose probe disagrees with the doc or the story is a FAIL --
         it does not matter which of the two you think is right.
         Probes are MODELLESS: no API keys reach the probe sandbox, so an
         `agent:` step in one fails on api_key_env no matter how correct the
         change is. Control flow, artifacts, caching, validation and every
         assert are all reachable without a model. For a claim that truly
         needs one, do not probe and do not guess -- say so in the critique,
         and check instead that an e2e test exercises it against the fake
         provider (newFakeLLM in fakeprovider_test.go). A story whose central
         behavior is agent-side and ships with no such test is a FAIL on 4a.
      4. Judge whether the story is fully AND CORRECTLY implemented, not
         merely plausible-looking:
         a. the feature described is present, with tests that exercise it;
         b. docs/examples are updated if the story called for them, and every
            claim they make about behavior is true of the code next to it --
            a comment contradicting the code is a fail, not a nitpick, and
            this is what step 3 is for;
         c. if the change touches one of several similar code paths, run the
            sibling check and confirm the SAME treatment landed on all of
            them -- a fix applied to only one is a fail;
         d. edge cases the story implies (empty, zero, negative, malformed)
            are handled deliberately, not silently accepted;
         e. every example the change ships under examples/ actually RUNS --
            probe it. A non-runnable example passes lint, tests and build
            without complaint, because nothing executes it.
       5. Write your critique to repo/experiments/self-build/critiques/{num}.md
          — first line exactly PASS or FAIL, then your reasoning with file:line
          citations. Cite a probe by its pipeline and the line of transcript
          that settled it, the same way you would cite a file:line. That file
          must exist before you call the verdict tool.
       6. If you intend to choose "pass" (the change passes review), write
          these files with write_file BEFORE calling the verdict tool — they
          become the PR:
          a. repo/experiments/self-build/prs/{num}/title — a one-line PR
             title like "story 001: short description of the change"
          b. repo/experiments/self-build/prs/{num}/body.md — the PR
             description: a concise summary of the story, what changed
             (files and modules touched), and that lint/test/build/review
             passed.
          For a "fail" verdict skip these files entirely.
       7. Call the verdict tool with exactly "pass" or "fail" and a short
          `note` — THIS routes the pipeline and is what the implementer sees
          on a redo.
    verdicts: [pass, fail]
    to:
      pass: repo
      fail: coder
      failure: coder   # reviewer errored or never called verdict
    max_visits: 3
  - put: repo
    params: { path: repo }
