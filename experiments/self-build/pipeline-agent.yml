# Same idea as pipeline.yml but plan/execute/critique are steps' own `agent:`
# step type instead of shelling out to the `claude` CLI -- for running this
# experiment against a local model. See README.md's "agent: vs claude CLI".
#
# The repository under development is an ORDINARY INPUT ARTIFACT (`get: repo`),
# not a path the agents reach out to, and that is the whole shape of this
# file. Each agent works in its own workspace where `repo/` is a real git
# clone, so the built-in file tools reach it with no special configuration.
# An earlier revision pointed at a checkout by absolute path, which those
# tools cannot touch (they are confined to the step's workspace), so every
# read/list/write/edit was re-implemented as a custom shell tool that `cd`-ed
# there first -- and `coder` was handed a general-purpose shell just to get
# its narrow tools within reach. Making the repo an input deleted ~190 lines
# of that, and left the narrow tools genuinely narrow.
#
# `put: repo` commits and pushes the workspace clone. A failed review never
# reaches it, so the real checkout is never left dirty by an abandoned attempt.
#
# gopls is granted ONE tool (plus go_diagnostics for coder): finding every
# call site of a symbol without false-positiving on a comment or missing a
# differently-spelled one is the thing a text search genuinely cannot do.
# Finding WHERE something lives is search_files' job. MCP tools are exposed
# with the server name prefixed ("gopls__go_symbol_references"). Needs `gopls`
# on PATH.
#
# Swap `lmstudio/google/gemma-4-26b-a4b` for whatever you have loaded; a
# coding-tuned model will do meaningfully better on `coder` specifically.
#
# Before a real run point `repo`'s source.uri at a scratch clone, not your
# working checkout.
resource_types:
- name: stories
  config:
    # Discovering versions is the one thing that must look at the real
    # repository, since it runs before any workspace exists.
    check: |
      ruby -e '
        require "json"
        versions = Dir.glob(File.join(ARGV[0], ARGV[1], "001-*.md")).sort.map do |path|
          name = File.basename(path)
          { num: name[0, 3], file: name }
        end
        puts versions.to_json
      ' -- {{ .source.repo | shellquote }} {{ .source.dir | shellquote }}
    # Only the pointers: the story TEXT lives in repo/, which the agents have.
    in: |
      set -e
      echo {{ .version.num | shellquote }} > ./num
      echo {{ .version.file | shellquote }} > ./file

- name: repo
  config:
    check: |
      git -C {{ .source.uri | shellquote }} rev-parse HEAD \
        | ruby -rjson -e 'puts [{ ref: STDIN.read.strip }].to_json'
    # A clone, not a copy: agents get a real working tree, so go test,
    # golangci-lint and git diff all behave normally, and the origin is
    # untouched until the put.
    in: |
      set -e
      git clone --quiet {{ .source.uri | shellquote }} .
      git checkout --quiet {{ .version.ref | shellquote }}
    # Runs with the build workspace as cwd, so stories/ and repo/ are both
    # visible. An unchanged tree exits cleanly rather than failing the job.
    out: |
      set -e
      num="$(cat stories/num)"
      file="$(cat stories/file)"
      cd {{ .params.path | shellquote }}
      git add -A
      git diff --cached --quiet && exit 0
      git -c user.name=steps -c user.email=steps@localhost \
        commit --quiet -m "self-build: story $num ($(basename "$file" .md))"
      git push --quiet origin HEAD:refs/heads/self-build

# gopls' MCP server as a local subprocess. cwd: is RELATIVE, so it resolves
# against each agent step's own working directory -- gopls indexes the same
# materialized clone the agents read and edit, rather than some other
# checkout whose paths they could not open.
mcp_servers:
- name: gopls
  command: gopls
  args: [mcp]
  cwd: repo

resources:
- name: stories
  type: stories
  source:
    dir: docs/proposals/stories
    repo: /Users/jtarchie/workspace/steps
- name: repo
  type: repo
  source:
    uri: /Users/jtarchie/workspace/steps

agents:
# Research only. Holds no shell and no general write tool, so "planner cannot
# modify the repo" is structural rather than a promise: write_plan derives its
# own output path in shell, and there is no other tool that can write.
- name: planner
  source: { model: lmstudio/google/gemma-4-26b-a4b }
  max_turns: 200
  system: |
    You are a careful staff engineer planning ONE change to the `steps` Go
    codebase (a Concourse-style pipeline runner). You research before you
    write, you cite file:line for everything you describe, and you never
    propose a change to a file you have not actually read this session.

    The repository is at repo/, the story pointers at stories/. Every tool
    path is relative to those: "repo/internal/config/config.go".

    TOOL POLICY, for the choices that are not obvious:

      WHERE something is   search_files -- a regex over file contents.
                           output_mode "content" returns matching lines WITH
                           line numbers, which is how you get file:line
      every call site      gopls__go_symbol_references -- see below
      your output          write_plan -- your only write, called once, last

    You have NO shell. If your instinct is "grep for it", that is
    search_files. If it is "cat that file", it is read_file.

    THE SIBLING CHECK: search_files for the file that DEFINES a symbol, then
    gopls__go_symbol_references with `file` set to that path and `symbol` to
    the bare identifier -- the second argument is `symbol`, NOT `name`.
    Worth the extra step for exactly one question, "does this change touch
    one code path or several": unlike a text search it cannot false-positive
    on a comment or miss a call site spelled differently. Everything else is
    search_files, which is faster and cheaper.
  tools:
  - read_file
  - list_dir
  - search_files
  - name: story_brief
    description: >
      Call this FIRST. No arguments. Returns the story number and the path of
      the story doc -- read that with read_file.
    run: |
      num="$(cat stories/num)"
      printf 'STORY_NUM   %s\n' "$num"
      printf 'STORY_PATH  repo/docs/proposals/stories/%s\n' "$(cat stories/file)"
      printf 'PLAN_PATH   repo/experiments/self-build/plans/%s.md\n' "$num"
  - name: write_plan
    description: >
      Write this story's implementation plan. ONE argument: content, the full
      markdown text. You do not choose the path -- there is no path argument
      to get wrong. Call it once, at the end, with the whole plan.
    required: true   # forces the call when the model tries to END its turn
                     # without one -- a real run emitted the plan as chat text
    run: |
      num="$(cat stories/num)"
      mkdir -p repo/experiments/self-build/plans
      cat > "repo/experiments/self-build/plans/$num.md" <<'STEPS_AGENT_FILE_EOF'
      {{ .args.content }}
      STEPS_AGENT_FILE_EOF
      printf 'wrote plans/%s.md\n' "$num"
  - mcp: gopls
    tools: [go_symbol_references]
    max_output_bytes: 6000

# Implements the plan end to end: code, tests, docs/examples.
- name: coder
  source: { model: lmstudio/google/gemma-4-26b-a4b }
  max_turns: 200
  system: |
    You are a careful Go engineer implementing an already-written plan
    against the `steps` codebase. You follow repo/CLAUDE.md exactly (package
    dependency graph, merkle value-gating, trust boundaries), and a change is
    never done until verify_gate returns PASS. When a change applies to more
    than one structurally similar code path (get/task/put/agent step handling
    is the usual case here), you apply the SAME treatment to every one of
    them, not just the first you find -- a past attempt got this wrong.

    The repository is at repo/. Every tool path is relative to that:
    "repo/internal/config/config.go".

    TOOL POLICY, for the choices that are not obvious:

      WHERE something is   search_files (output_mode "content" for file:line)
      every call site      gopls__go_symbol_references -- the sibling check
      CHANGING a file      edit_file, NOT write_file -- see below
      after an edit        gopls__go_diagnostics on the file you touched
      the real gate        verify_gate (no arguments)
      anything else        run_shell -- git, mkdir, rm. Its cwd is your
                           workspace, so repo commands need `cd repo && ...`,
                           and each call is a fresh shell.

    USE edit_file, NOT write_file, to change part of an existing file. Copy
    old_string VERBATIM out of a read_file result -- read_file returns raw
    bytes, so what you read is byte-exact input for an edit. If it matches
    nothing, read again and copy more carefully; if several places, include
    more surrounding lines. write_file replaces a whole file.

    THE SIBLING CHECK: search_files for the file that DEFINES a symbol, then
    gopls__go_symbol_references with that `file` and the bare `symbol` -- the
    second argument is `symbol`, NOT `name`. Unlike a text search it cannot
    miss a sibling spelled differently or false-positive on a comment.
  tools:
  - read_file
  - list_dir
  - search_files
  - edit_file
  - write_file
  - run_shell
  - name: story_brief
    description: >
      Call this FIRST. No arguments. Returns the story number and the paths
      of the story doc, the plan a planning pass already wrote, and the
      critique.
    run: |
      num="$(cat stories/num)"
      printf 'STORY_NUM     %s\n' "$num"
      printf 'STORY_PATH    repo/docs/proposals/stories/%s\n' "$(cat stories/file)"
      printf 'PLAN_PATH     repo/experiments/self-build/plans/%s.md\n' "$num"
      printf 'CRITIQUE_PATH repo/experiments/self-build/critiques/%s.md\n' "$num"
  - name: verify_gate
    description: >
      Run the whole objective gate in one call and report PASS or FAIL: go
      fmt && go mod tidy && golangci-lint run && go test ./... && go build.
      No arguments. Call it after every edit -- a pass from before your last
      change is worthless. Trimmed to the last 300 lines, where the failures
      are. Do not type this chain into run_shell yourself; getting the &&
      order wrong is how a past run reported success on a broken tree.
    run: |
      cd repo || exit 1
      rc=0
      out=$(go fmt ./... 2>&1 && go mod tidy 2>&1 && golangci-lint run 2>&1 \
            && go test ./... 2>&1 && go build -v 2>&1) || rc=$?
      printf '%s\n' "$out" | tail -n 300
      if [ "$rc" -eq 0 ]; then
        printf '\nGATE: PASS\n'
      else
        printf '\nGATE: FAIL (exit %s) -- fix, then call verify_gate again\n' "$rc"
      fi
      exit "$rc"
  - mcp: gopls
    tools: [go_symbol_references, go_diagnostics]
    max_output_bytes: 6000

# Quality gate before the put. No shell and no general write tool --
# write_critique's path is derived in shell, never a model argument.
- name: reviewer
  source: { model: lmstudio/google/gemma-4-26b-a4b }
  max_turns: 200
  system: |
    You are a skeptical code reviewer for the `steps` Go codebase. Lint,
    tests and build already passed -- your job is the correctness a compiler
    cannot check: does the diff do what the story asked, do the docs it
    touched still match the code, and -- the most common miss here -- if it
    changes one of several structurally similar code paths, did the SAME
    change land on every sibling it claims to cover. You do not edit files.
    A concern you cannot cite as file:line is not a concern.

    The repository is at repo/. Every tool path is relative to that.

    TOOL POLICY, for the choices that are not obvious:

      what changed         repo_diff (no arguments)
      the sibling check    gopls__go_symbol_references -- see below, your
                           single most important tool
      finding a symbol     search_files (output_mode "content" for file:line)
      your record          write_critique, then the verdict tool, which is
                           what actually routes

    THE SIBLING CHECK, spelled out because it is the whole reason you exist:
    search_files for the file that DEFINES the symbol, then
    gopls__go_symbol_references with that `file` and the bare `symbol` -- the
    second argument is `symbol`, NOT `name`. It returns real references with
    file/line/snippet; a text search would both miss a sibling spelled
    differently and false-positive on a comment. Check each site yourself
    with read_file.
  tools:
  - read_file
  - list_dir
  - search_files
  - name: story_brief
    description: >
      Call this FIRST. No arguments. Returns the story number and the path of
      the story this attempt claims to implement.
    run: |
      num="$(cat stories/num)"
      printf 'STORY_NUM     %s\n' "$num"
      printf 'STORY_PATH    repo/docs/proposals/stories/%s\n' "$(cat stories/file)"
      printf 'CRITIQUE_PATH repo/experiments/self-build/critiques/%s.md\n' "$num"
  - name: repo_diff
    description: >
      Show what this attempt actually changed. No arguments. Returns `git
      status --short`, `git diff --stat HEAD`, then `git diff HEAD` -- HEAD,
      not `main...HEAD`, because the implementer does not commit, so the work
      under review is UNCOMMITTED. A `??` line is a NEW file that will not
      appear in the diff, so read it with read_file. An oversized diff spills
      to a file; read_file accepts the absolute path from the pointer.
    run: |
      cd repo || exit 1
      printf -- '--- git status --short (a "??" line is a NEW file) ---\n'
      git --no-pager status --short
      printf -- '\n--- git diff --stat HEAD ---\n'
      git --no-pager diff --stat HEAD
      printf -- '\n--- git diff HEAD (the uncommitted work under review) ---\n'
      git --no-pager diff HEAD
  - name: write_critique
    description: >
      Record your review. ONE argument: content, whose FIRST LINE must be
      exactly PASS or FAIL, then your reasoning with file:line citations. The
      path is chosen for you. A human-readable record only -- the verdict
      tool is what routes. Call this first, then the verdict tool.
    required: true
    run: |
      num="$(cat stories/num)"
      mkdir -p repo/experiments/self-build/critiques
      cat > "repo/experiments/self-build/critiques/$num.md" <<'STEPS_AGENT_FILE_EOF'
      {{ .args.content }}
      STEPS_AGENT_FILE_EOF
      printf 'wrote critiques/%s.md\n' "$num"
  - mcp: gopls
    tools: [go_symbol_references]
    max_output_bytes: 6000

jobs:
- name: self-build
  plan:
  - get: stories
    version: every
  - get: repo
  - agent: planner
    inputs: [stories, repo]
    attempts: 2       # whole-conversation restart on a transport failure
    timeout: 20m      # per attempt, not total -- see docs/attempts-timeout.md
    prompt: |
      Plan ONE implementation step for ONE story.

      1. story_brief, then read_file on repo/CLAUDE.md and on STORY_PATH.
      2. Find where the feature must integrate. The feature the story ASKS
         FOR does not exist yet, so never search for its own name. Relevant:
         repo/internal/{config,pipeline,merkle,store,trigger,agent}. For
         anything you plan to CHANGE, run the sibling check -- that is what
         tells you whether this story touches one code path or several. Do
         not repeat a query you have already run.
      3. Read the files you found. Page the big ones.
      4. write_plan(content), once, with the whole plan. File by file: what
         changes, what tests are needed, which docs/*.md and examples/*.yml
         need updating. State explicitly whether the change applies to more
         than one structurally similar code path -- list the sibling sites
         gopls returned, with file:line -- and if so require a single test
         covering all of them. Do not describe a file you have not read.
  - agent: coder
    inputs: [stories, repo]
    attempts: 2
    timeout: 25m
    handoff: { tool: true }   # a redo gets a previous_run tool over the last verdict
    prompt: |
      Implement ONE story's already-written plan. repo/ is a real git clone,
      yours to edit.

      1. story_brief, then read_file on repo/CLAUDE.md and on PLAN_PATH.
      2. Implement it end to end: code, tests, and doc/example updates,
         following CLAUDE.md exactly. If the story adds a behavior or guard
         to one of several similar code paths, run the sibling check and
         apply the SAME treatment to all of them, not just the first.
      3. After each edit, gopls__go_diagnostics on the file you touched.
         gopls has no LSP client feeding it your live edits, so its view can
         go stale: verify_gate is the real gate, not diagnostics.
      4. verify_gate. Keep fixing and re-calling until it says PASS, and call
         it again after EVERY further edit -- a PASS from before your last
         change proves nothing.
      5. Do not commit. A later step publishes only if the review passes.

      If a `<transition_context>` block appears below, you were sent back
      here after a previous attempt. A failed build/lint/test gate: just call
      verify_gate, your changes are still here so you will see the errors
      directly. A failed review: call previous_run for the reviewer's note,
      and read_file on CRITIQUE_PATH.
  - task: build-check
    inputs: [repo]
    run: |
      set -o pipefail
      cd repo
      # Objective gate: cheap and deterministic, so an obviously-broken
      # attempt is rejected before spending reviewer turns on it.
      golangci-lint run && go test ./... && go build -v
    to:
      failure: coder
    max_visits: 4
  - agent: reviewer
    inputs: [stories, repo]
    attempts: 2
    timeout: 20m
    prompt: |
      You are the quality gate before this story's changes are published.

      1. story_brief, then read_file on STORY_PATH and repo/CLAUDE.md.
      2. repo_diff. A `??` line is a NEW file that does not appear in the
         diff at all -- read each of those with read_file.
      3. Judge whether the story is fully AND CORRECTLY implemented, not
         merely plausible-looking:
         a. the feature described is present, with tests that exercise it;
         b. docs/examples are updated if the story called for them, and every
            claim they make about behavior is true of the code next to it --
            a comment contradicting the code is a fail, not a nitpick;
         c. if the change touches one of several similar code paths, run the
            sibling check and confirm the SAME treatment landed on all of
            them -- a fix applied to only one is a fail;
         d. edge cases the story implies (empty, zero, negative, malformed)
            are handled deliberately, not silently accepted.
      4. write_critique(content), first line exactly PASS or FAIL, then your
         reasoning with file:line citations. A record only; it does not route.
      5. Call the verdict tool with exactly "pass" or "fail" and a short
         `note` -- THIS routes the pipeline and is what the implementer sees
         on a redo.
    verdicts: [pass, fail]
    to:
      pass: repo
      fail: coder
      failure: coder   # reviewer errored or never called verdict
    max_visits: 3
  - put: repo
    params: { path: repo }
