version: '3'

tasks:
  fmt:
    desc: The full pre-check-in validation sequence from CLAUDE.md — the "before I commit" command. Run `task` alone for this.
    cmds:
      - go fmt ./...
      - task: tidy
      - task: lint
      - task: kindswitch
      - task: test
      - task: build
      - task: vuln
      - task: nilaway

  tidy:
    desc: Keep go.mod/go.sum tidy — a diff here is a real signal, commit it.
    cmds:
      - go mod tidy

  lint:
    desc: golangci-lint — ~40 linters enabled (.golangci.yml), must report 0 issues.
    env:
      # golangci-lint serializes ALL invocations on this machine through one
      # lock at $TMPDIR/golangci-lint.lock (verified with lsof: a fixed path,
      # not the cache directory — GOLANGCI_LINT_CACHE does not move it). So
      # linting two checkouts at once, or this one while an editor lints it in
      # the background, makes the loser exit 3 with "parallel golangci-lint is
      # running" — a failed lint with nothing wrong in the code.
      #
      # Giving this repo its own TMPDIR moves the lock into it, so the only
      # thing we can ever contend with is ourselves. The cache stays shared,
      # which is what keeps it warm.
      TMPDIR: '{{.ROOT_DIR}}/.golangci-tmp'
    cmds:
      # Retry only the lock, and only by its message: exit 3 also means a real
      # internal error, and swallowing that would turn a broken linter into a
      # silent pass. Anything else is reported immediately.
      - |
        for attempt in 1 2 3 4 5 6; do
          # Status captured from the command, NOT after the if: an if whose
          # condition is false and which has no else exits 0 by POSIX, so
          # `status=$?` there read 0 and this task exited 0 on every real
          # finding. Lint was not a gate at all, and a gosec finding proved it
          # by sailing through the whole sequence.
          out=$(golangci-lint run 2>&1)
          status=$?

          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$out"
            exit 0
          fi

          case "$out" in
            *"parallel golangci-lint is running"*)
              echo "another golangci-lint holds the lock; waiting 15s (attempt $attempt/6)" >&2
              sleep 15
              ;;
            *)
              printf '%s\n' "$out"
              exit $status
              ;;
          esac
        done
        echo "golangci-lint stayed locked by another process for 90s" >&2
        exit 3

  kindswitch:
    desc: Report tagless step-kind switches (tools/kindswitch) that golangci-lint's exhaustive check can't see. Must exit 0.
    cmds:
      - go run ./tools/kindswitch ./...

  test:
    desc: Run the test suite under the race detector. Every goroutine-spawning package's goleak TestMain fails if a test leaves one running.
    cmds:
      # -race, and it is worth the wall clock (~2.5m to ~5.5m). A data race in
      # the SSM data channel's retransmit path shipped green through this
      # whole sequence, because a race is invisible to every other check here:
      # the code compiles, the linters see nothing, and the test passes until
      # the day two goroutines happen to interleave on a machine nobody can
      # attach a debugger to. This is the only check that can see that class
      # at all, and every venue transport is concurrent by construction.
      - go test -race ./...

  mutate:
    desc: Just the mutation suites — break each doc-corpus assertion in turn and require the build to notice. Part of `task test`; this is the fast way to iterate on them alone.
    cmds:
      - go test . -run 'Mutation' -count=1

  cover-diff:
    desc: "Advisory: which changed lines (vs BASE, default HEAD) did no test execute. Born from a measured failure: a whole eviction layer landed uncovered and its deletion shipped green. Run before committing; triage every line it names — add the test, or know exactly why not."
    cmds:
      - go test ./... -coverprofile=.cover.out
      - go run ./tools/coverdiff -profile .cover.out -base {{.BASE | default "HEAD"}}
      - rm -f .cover.out

  mutate-pkg:
    desc: "Advisory mutation testing over one package: task mutate-pkg PKG=./internal/venue [WORKERS=1]. Mechanizes the sabotage audit — every LIVED mutant is a code change no test notices. Needs gremlins (task install:tools). --integration because package-scoped mode times out spuriously here; go's build cache keeps unaffected packages cheap, but a package with heavy dependents (venue, pipeline) still costs minutes to hours — scope deliberately. WORKERS=1 serializes the run, which is what a package whose tests bind ports, spawn containers or share a docker daemon needs: parallel mutants otherwise fail each other's tests and report as KILLED for the wrong reason."
    cmds:
      - gremlins unleash --integration --timeout-coefficient 10 --workers {{.WORKERS | default "0"}} {{.PKG}}

  build:
    desc: Build ./steps. CGO_ENABLED=0 is a guard, not an optimization — the planned remote-worker shim cross-compiles this binary for any GOOS/GOARCH and pushes it over SFTP, so a transitive dep that pulls in cgo must fail the build here.
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -v

  vuln:
    desc: Scan the module for known Go vulnerabilities actually reachable from the build (govulncheck).
    cmds:
      - govulncheck ./...

  nilaway:
    desc: Uber's nil-flow analyzer over production code. Advisory — never gates `task fmt`, but triage every finding rather than skipping it; it has a real false-positive rate, so not every finding needs a code change.
    cmds:
      - nilaway -exclude-test-files=true ./... || true

  install:tools:
    desc: Install the Go CLIs `task fmt` needs beyond the standard toolchain (golangci-lint is separate — see CLAUDE.md). Run once after cloning.
    cmds:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - go install go.uber.org/nilaway/cmd/nilaway@latest
      # gremlins backs the advisory `task mutate-pkg`; nothing in `task fmt` needs it.
      - go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

  default:
    desc: Alias for `task fmt` — so bare `task` runs the whole validation sequence.
    cmds:
      - task: fmt
