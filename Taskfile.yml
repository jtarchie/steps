version: '3'

vars:
  # govulncheck, nilaway and gremlins are pinned in go.tool.mod and run through
  # `go tool`, so a gate's verdict depends on this repo and not on the day
  # somebody ran `go install ...@latest`, and nothing needs ~/go/bin on PATH.
  # A modfile of their own, because `tool` directives in go.mod would put their
  # dependencies into the same version selection as production code: nilaway
  # wanting a newer golang.org/x/tools would move the one steps ships with.
  # Never `go mod tidy -modfile=go.tool.mod` — tidy would add every production
  # dependency to it.
  GO_TOOL: go tool -modfile=go.tool.mod

tasks:
  fmt:
    desc: The full pre-check-in validation sequence from CLAUDE.md — the "before I commit" command. Run `task` alone for this.
    cmds:
      - go fmt ./...
      - task: tidy
      # Bracketing the gates, AFTER fmt and tidy have made their edits: the
      # commit hook (hack/hooks/pre-commit) only accepts the tree this run
      # validated, and a run is long enough for another session to change it.
      - go run ./tools/stamp begin
      - task: lint
      - task: kindswitch
      # The two static gates run before the suite: they cost two minutes
      # between them, and a finding that would fail the build anyway should
      # not take the two the tests need to be heard.
      - task: vuln
      - task: nilaway
      - task: test
      - task: build
      - task: seal
      # After the seal and never a gate: one line when a mutation sweep is due,
      # nothing at all when none is. There is no CI and no scheduler here, so
      # this is the only thing that would ever say so.
      - cmd: go run ./tools/mutants summary
        ignore_error: true
      # Same bargain for the e2e race sweep task test no longer runs.
      - cmd: |
          last=$(cat .testshard/race-swept 2>/dev/null || true)
          behind=10
          if [ -n "$last" ]; then behind=$(git rev-list --count "$last..HEAD" 2>/dev/null || echo 10); fi
          if [ "$behind" -ge 10 ]; then echo "e2e race sweep: not passed in the last 10 commits — task test:race"; fi
        ignore_error: true

  seal:
    desc: Record that the full sequence passed on exactly this tree, and point git at the hook that checks it. Only ever reached through `task fmt` — sealing by hand is forging the stamp. See tools/stamp/CLAUDE.md.
    internal: true
    cmds:
      - go run ./tools/stamp seal
      - git config core.hooksPath hack/hooks

  tidy:
    desc: Keep go.mod/go.sum tidy — a diff here is a real signal, commit it.
    cmds:
      - go mod tidy

  lint:
    desc: golangci-lint — ~40 linters enabled (.golangci.yml), must report 0 issues.
    env:
      # golangci-lint serializes ALL invocations on this machine through one
      # lock at $TMPDIR/golangci-lint.lock (verified with lsof: a fixed path,
      # not the cache directory — GOLANGCI_LINT_CACHE does not move it). So
      # linting two checkouts at once, or this one while an editor lints it in
      # the background, makes the loser exit 3 with "parallel golangci-lint is
      # running" — a failed lint with nothing wrong in the code.
      #
      # Giving this repo its own TMPDIR moves the lock into it, so the only
      # thing we can ever contend with is ourselves. The cache stays shared,
      # which is what keeps it warm.
      TMPDIR: '{{.ROOT_DIR}}/.golangci-tmp'
    cmds:
      # Retry only the lock, and only by its message: exit 3 also means a real
      # internal error, and swallowing that would turn a broken linter into a
      # silent pass. Anything else is reported immediately.
      #
      # The directory has to exist first: golangci-lint cannot create its lock
      # in a TMPDIR that is not there, and reports THAT as "parallel
      # golangci-lint is running" — so a fresh checkout looped on the retry
      # above for ninety seconds and failed with nothing wrong.
      - |
        mkdir -p "$TMPDIR"

        for attempt in 1 2 3 4 5 6; do
          # Status captured from the command, NOT after the if: an if whose
          # condition is false and which has no else exits 0 by POSIX, so
          # `status=$?` there read 0 and this task exited 0 on every real
          # finding. Lint was not a gate at all, and a gosec finding proved it
          # by sailing through the whole sequence.
          out=$(golangci-lint run 2>&1)
          status=$?

          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$out"
            exit 0
          fi

          case "$out" in
            *"parallel golangci-lint is running"*)
              echo "another golangci-lint holds the lock; waiting 15s (attempt $attempt/6)" >&2
              sleep 15
              ;;
            *)
              printf '%s\n' "$out"
              exit $status
              ;;
          esac
        done
        echo "golangci-lint stayed locked by another process for 90s" >&2
        exit 3

  kindswitch:
    desc: Report tagless step-kind switches (tools/kindswitch) that golangci-lint's exhaustive check can't see. Must exit 0.
    cmds:
      - go run ./tools/kindswitch ./...

  test:
    desc: Run the test suite — every package but ./e2e under the race detector, ./e2e as several processes without it (task test:race is its race sweep). Every goroutine-spawning package's goleak TestMain fails if a test leaves one running.
    env:
      # The race runtime sleeps a second at exit so a goroutine still running
      # can report; goleak already fails any package that leaves one running,
      # so the second buys nothing, and testshard pays it once per process.
      GORACE: atexit_sleep_ms=0
    cmds:
      # -race on every package but ./e2e. A data race in the SSM data
      # channel's retransmit path shipped green through this whole sequence,
      # because a race is invisible to every other check here: the code
      # compiles, the linters see nothing, and the test passes until the day
      # two goroutines happen to interleave on a machine nobody can attach a
      # debugger to. Every venue transport is concurrent by construction.
      #
      # ./e2e runs WITHOUT it, in shards, concurrently with the rest: under
      # -race the suite needs ~1,100 CPU-seconds, which ten cores cannot fit
      # in two minutes however it is split, and ./e2e is ~700 of them (pure-Go
      # sqlite under the detector is ~15x). Without it ./e2e is ~190. The race
      # coverage it gave moved to task test:race, which `task` nags for — it
      # has earned its keep once (8b7d6bb, a daemon race only e2e reached).
      #
      # Packages whose serial tests alone outlast the rest (package-level seams
      # keep them serial) run as shards too, still under -race; each process
      # has its own globals, so they stay correct. Not internal/shell: its
      # serial tests are docker timing, and four of them against one daemon
      # turned timing into flakes.
      - |
        sharded="./internal/venue ./internal/web"
        go test -race $(go list ./... | grep -v -x -F "$(go list ./e2e $sharded)") & unit=$!
        go run ./tools/testshard -race -shards 4 $sharded & heavy=$!
        go run ./tools/testshard ./e2e & e2e=$!
        unit_status=0; wait $unit || unit_status=$?
        heavy_status=0; wait $heavy || heavy_status=$?
        e2e_status=0; wait $e2e || e2e_status=$?
        [ $unit_status -eq 0 ] && [ $heavy_status -eq 0 ] && [ $e2e_status -eq 0 ]

  test:race:
    desc: "./e2e under the race detector, as shards — the race coverage task test leaves out for speed. ~3 minutes on a quiet machine; `task` prints a line when it has not passed in 10 commits."
    env:
      GORACE: atexit_sleep_ms=0
    cmds:
      - go run ./tools/testshard -race ./e2e
      - mkdir -p .testshard && git rev-parse HEAD > .testshard/race-swept

  mutate:
    desc: Just the mutation suites — break each doc-corpus assertion in turn and require the build to notice. Part of `task test`; this is the fast way to iterate on them alone.
    cmds:
      - go test ./e2e -run 'Mutation' -count=1

  cover-diff:
    desc: "Advisory: which changed lines (vs BASE, default HEAD) did no test execute. Born from a measured failure: a whole eviction layer landed uncovered and its deletion shipped green. Run before committing; triage every line it names — add the test, or know exactly why not."
    cmds:
      - go test ./... -coverprofile=.cover.out
      - go run ./tools/coverdiff -profile .cover.out -base {{.BASE | default "HEAD"}}
      - rm -f .cover.out

  mutate-pkg:
    desc: "Mutation testing over one package: task mutate-pkg PKG=./internal/venue [SINCE=<rev>] [WORKERS=1] [INTEGRATION=1]. Every LIVED mutant is a code change no test notices. The procedure around it — what to sweep, where to run it, how to triage a survivor — is the mutation-sweep skill; this task is only the mechanics, so a human can run them too. Results land in .gremlins/."
    requires:
      vars: [PKG]
    cmds:
      # A cached coverage run gives gremlins a ~1s baseline, and its timeout is
      # that baseline times the coefficient — so every mutant then "times out",
      # and TIMED OUT is scored as KILLED. This is the trap that made package
      # mode look spuriously flaky here and put --integration on this line for
      # a while; with a clean cache, merkle sweeps in two minutes with zero
      # timeouts.
      - go clean -testcache
      - mkdir -p .gremlins
      # Package mode by default: a mutant is judged by its own package's tests.
      # INTEGRATION=1 judges it by `go test ./...` instead — the whole module,
      # docker e2e included, once PER MUTANT, several at a time. Measured on
      # merkle: over ten minutes without finishing, against two. It is for a
      # final answer on a handful of survivors, not for a sweep.
      #
      # SINCE scopes the run to files changed since a rev, by excluding the
      # rest: gremlins' own --diff is broken in package mode (it compares
      # repo-relative diff paths against package-relative mutant paths and
      # skips everything).
      - '{{.GO_TOOL}} gremlins unleash {{if .INTEGRATION}}--integration{{end}} --timeout-coefficient 15 --workers {{.WORKERS | default "0"}} -o .gremlins/{{.PKG | trimPrefix "./" | replace "/" "_"}}.json $(go run ./tools/mutants excludes {{.PKG}} "{{.SINCE}}") {{.PKG}}'

  mutate-all:
    desc: "MEASURE every package with gremlins and record each in tools/mutation-ledger.json — no triage. Hours of machine time: start it when the machine will sit idle (a loaded machine makes mutants time out, and TIMED OUT scores as KILLED, so the numbers lie). Cheapest packages first and the docker-backed ones last and serially, so an interrupted night leaves the most rows; rerun to resume, a package already measured at this commit is skipped. `task mutate-all -- ./internal/foo ./internal/bar` measures just those. Triage is the mutation-sweep skill, afterwards."
    cmds:
      - go run ./tools/mutants all {{.CLI_ARGS}}

  fuzz:
    desc: "Advisory: run every Fuzz target for FUZZTIME each (default 30s). `task fuzz PKG=./internal/wire` narrows to one package. Never a gate — the seed corpus and every crasher under testdata/fuzz already run in `task test`; this is the search for new ones. A failure writes its input to testdata/fuzz/<Target>/: fix the bug and commit that file as the regression test."
    cmds:
      # go test -fuzz accepts exactly one target per package per run, hence the loop.
      - |
        set -e
        for pkg in $(go list {{.PKG | default "./..."}}); do
          for fn in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
            echo "== $pkg $fn"
            go test "$pkg" -run '^$' -fuzz "^${fn}\$" -fuzztime {{.FUZZTIME | default "30s"}}
          done
        done

  mutate-stale:
    desc: Which package most needs a mutation sweep — never-swept first, then by lines changed since the commit tools/mutation-ledger.json says it was last swept at.
    cmds:
      - go run ./tools/mutants stale

  build:
    desc: Build ./steps. CGO_ENABLED=0 is a guard, not an optimization — the planned remote-worker shim cross-compiles this binary for any GOOS/GOARCH and pushes it over SFTP, so a transitive dep that pulls in cgo must fail the build here.
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -v

  vuln:
    desc: Scan the module for known Go vulnerabilities actually reachable from the build (govulncheck).
    cmds:
      - '{{.GO_TOOL}} govulncheck ./...'

  nilaway:
    desc: "Uber's nil-flow analyzer over production code. A GATE: must report nothing. It was advisory behind `|| true` until 2026-09-18, which is how 17 findings sat in a green tree. A false positive is suppressed where it is reported, with `//nolint:nilaway // <why the flow cannot happen>` — on the line, or on the line above when the line opens a block — so every exception is a sentence somebody can be wrong about. Prefer a guard the analyzer can see over a suppression when one costs nothing."
    cmds:
      # -include-pkgs keeps the analysis to this module. Without it nilaway
      # infers through the standard library's SOURCE and reports every
      # `resp, err := client.Do(req)` as a nil response, because net/http's
      # contract (a nil error means a non-nil response) is prose it cannot read.
      - '{{.GO_TOOL}} nilaway -exclude-test-files=true -include-pkgs=github.com/jtarchie/steps ./...'

  install:tools:
    desc: Build the pinned Go CLIs ahead of time (golangci-lint is separate — see CLAUDE.md). Optional — `go tool` builds each on first use and caches it — but it moves that wait out of the first `task`.
    cmds:
      - '{{.GO_TOOL}} -n govulncheck'
      - '{{.GO_TOOL}} -n nilaway'
      - '{{.GO_TOOL}} -n gremlins'

  upgrade:tools:
    desc: Move the pinned CLIs to their latest releases. Deliberate and reviewable — the diff to go.tool.mod IS the upgrade — where `@latest` at install time made a gate that could turn red with no change to this repo.
    cmds:
      - go get -modfile=go.tool.mod -tool golang.org/x/vuln/cmd/govulncheck@latest go.uber.org/nilaway/cmd/nilaway@latest github.com/go-gremlins/gremlins/cmd/gremlins@latest

  default:
    desc: Alias for `task fmt` — so bare `task` runs the whole validation sequence.
    cmds:
      - task: fmt
