# golangci-lint v2 configuration for steps.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # default
    - errcheck      # unchecked errors are bugs (file I/O, exec)
    - govet         # go vet superset
    - ineffassign   # assignments to values never read
    - staticcheck   # the SA* suite (real bugs, deadcode, simplifications)
    - unused        # unused functions/vars/types
    # custom
    - misspell      # typos in identifiers/comments
    - bodyclose     # http.Response.Body not closed
    - errorlint     # %w vs %s on errors, typed nil
    - nilerr        # returning nil after an err
    - noctx         # http requests without context
    - unconvert     # unnecessary type conversions
    - unparam       # unused function parameters
    - gocritic      # common pitfalls
    - reassign      # reassigning package-level vars (http.DefaultClient)
    - tagalign
    - wrapcheck
    - sqlclosecheck
    - exhaustive
    - whitespace
    - noinlineerr
    - importas
    # nil
    - nilnil
    - nilnesserr
    # Correctness
    - musttag       # JSON tags required on marshaled structs
    - recvcheck     # consistent pointer vs value receivers
    - wastedassign  # assignments whose values are never read
    - nolintlint    # stale or malformed //nolint directives
    - errchkjson    # json.Marshal returns ignored where it shouldn't be
    - loggercheck   # slog key/value mismatch and even-arg invariants
    # Style / consistency
    - sloglint      # consistent slog usage
    - revive        # replacement for golint with a tight ruleset
    - gochecknoinits # init() side effects make wiring hard to trace
    # Modern Go idioms
    - intrange      # `for i := range n` (Go 1.22+)
    - copyloopvar   # loop-var capture safe by default (Go 1.22+)
    - mirror        # bytes/strings mirror function suggestions
    # Performance
    - perfsprint    # replace fmt.Sprintf/Errorf with faster alternatives
    - prealloc      # pre-allocate slices where capacity is known
    # Concurrency / context / HTTP safety
    - contextcheck  # context.Context must be propagated, not ignored
    - containedctx  # context.Context must not be stored in structs
    # Complexity
    - cyclop        # cyclomatic complexity per function
    - gocognit      # cognitive complexity (deeply nested / hard-to-read logic)
    - nestif        # deeply nested if blocks
    # Security
    - gosec         # Go security checker; respects existing //nolint:gosec markers
    # Architecture
    - depguard      # enforce the internal import-direction (no upward dep on the CLI layer)

  settings:
    gosec:
      excludes:
        # G706 (log injection) flags any slog call whose attribute value came
        # from outside — a request's RemoteAddr, a resource name, an argv, an
        # error's text. It is a real class of bug for a logger that
        # CONCATENATES, and structurally impossible for slog: attribute values
        # are quoted and escaped by the handler, never interpolated into the
        # message, so a value carrying a newline cannot forge a second log line.
        #
        # Excluded here, once and with the reason, rather than as a //nolint on
        # every logging call in the repo. Every one of the eight sites it flagged
        # was this same false positive, and its taint analysis surfaces them one
        # at a time — so the scattered form is both noisier and never finished.
        - G706
    depguard:
      rules:
        # Root (package main): the process boundary and nothing else —
        # hand os.Args to internal/cli, turn the error it returns into an
        # exit code. Every command lives BELOW it so the end-to-end suite in
        # ./e2e can drive the whole stack through a package it can import; a
        # package main test file cannot live anywhere but the root, which is
        # what kept a hundred of them there. A new import here means logic
        # has leaked back into main.
        Main:
          files:
            - "$all"
            - "!**/internal/**"
            - "!**/tools/**"
            - "!**/docs/**"
            - "!**/e2e/**"
          allow:
            - "$gostd"
            - "github.com/jtarchie/steps/internal/cli"
            # outcome is a stdlib-only leaf supplying the vocabulary main
            # needs at the process boundary: which exit code an error earns
            # (outcome.ExitCode). Classifying a failure as "the pipeline said
            # no" vs "the pipeline could not run" is the same distinction
            # pipeline already uses for hook dispatch, so main consumes it
            # rather than keeping a second, drifting copy.
            - "github.com/jtarchie/steps/internal/outcome"
        # internal/cli is the CLI itself: parse flags, wire up
        # config/store/workspace, and hand off to internal/pipeline. It must
        # not reach past internal/pipeline into the packages pipeline itself
        # orchestrates (merkle/resource/agent/shell/template/retry).
        CLI:
          files:
            - "**/internal/cli/**"
          allow:
            - "$gostd"
            - "github.com/alecthomas/kong"
            - "github.com/lmittmann/tint"
            # glamour renders the embedded docs (steps docs) for a terminal;
            # the docs package itself stays render-free — see the Docs rule.
            # x/sys reads the terminal width so the wrap follows the pane.
            - "github.com/charmbracelet/glamour"
            - "golang.org/x/sys/unix"
            - "github.com/jtarchie/steps/docs"
            - "gopkg.in/yaml.v3"
            # goleak is test-only: goleak_test.go's TestMain fails a package's
            # tests if any leaves a goroutine running.
            - "go.uber.org/goleak"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/pipeline"
            # blobstore is provider setup, like workspace below: the CLI parses
            # --artifact-store, builds the S3 client, and hands it into the
            # workspace's injected interfaces — the one place the SDK is
            # allowed to meet the step cache, so neither workspace nor the
            # shim ever imports it.
            - "github.com/jtarchie/steps/internal/blobstore"
            # internal/mcp is a setup/tooling dependency here, not an
            # execution-path one: `steps mcp login`/`steps mcp tools` are
            # standalone auth bootstrap/discovery commands with no
            # relationship to pipeline.RunJob, the same way the CLI already
            # reaches internal/workspace directly for provider setup rather
            # than through pipeline. It is NOT a precedent for the CLI reaching
            # into resource/agent territory, which pipeline.RunJob still
            # exclusively orchestrates.
            - "github.com/jtarchie/steps/internal/mcp"
            # shim is the same shape of dependency as mcp: `steps _shim` is a
            # standalone process mode with no relationship to pipeline.RunJob.
            # It is what a worker runs after the orchestrator pushes this
            # binary to it, so the CLI constructs it directly rather than
            # through a pipeline that, on that machine, does not exist.
            - "github.com/jtarchie/steps/internal/shim"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/trigger"
            # web is the UI front end: the CLI constructs it and hands it
            # loaded pipelines, exactly as it does trigger.Watch. events is the
            # leaf both need in order to wire a bus to a store sink.
            - "github.com/jtarchie/steps/internal/events"
            - "github.com/jtarchie/steps/internal/web"
            - "github.com/jtarchie/steps/internal/workspace"
        # e2e is the end-to-end suite: nothing but _test.go files, driving the
        # whole stack through cli.Run the way a user's shell would. It reads
        # back what a run produced (store, web, events) and validates the
        # shipped artifacts (steps.schema.json, docs, examples), so its extra
        # dependencies are all assertion machinery — it must never grow a
        # production import path of its own.
        E2E:
          files:
            - "**/e2e/**"
          allow:
            - "$gostd"
            - "github.com/jtarchie/steps/internal/cli"
            - "github.com/alecthomas/kong"
            - "github.com/jtarchie/steps/docs"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/pipeline"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/events"
            - "github.com/jtarchie/steps/internal/web"
            # schema_test.go validates every shipped example against
            # steps.schema.json (the published editor schema) and asserts its
            # step properties still match config.Step's yaml tags. The schema
            # is a documentation artifact, and this is what stops it drifting.
            - "github.com/santhosh-tekuri/jsonschema/v6"
            - "gopkg.in/yaml.v3"
            - "go.uber.org/goleak"
            # wire: the eviction e2e impersonates a reclaimed worker at the
            # frame level, the same way the venue package's own helper-process
            # variants do. The shipped code still reaches workers only through
            # internal/pipeline.
            - "github.com/jtarchie/steps/internal/wire"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            # go/ast, go/parser and go/token are test-only and stay that way:
            # captureguard_test.go reads every _test.go in the module to hold
            # one convention that nothing else can check — a test that
            # redirects the os.Stdout GLOBAL must not also be parallel, since
            # every fmt.Printf in the code under test reads that variable.
            # Source inspection otherwise belongs in tools/ (see
            # tools/kindswitch); this is a test asserting a property of the
            # tests themselves, and putting it beside them is what makes it
            # run.
            - "go/ast"
            - "go/parser"
            - "go/token"
        # dockerapi is the docker engine client, and the ONLY package allowed
        # to hold one. It exists because internal/shell is depended on by
        # nearly everything and had been stdlib-only: putting an engine client
        # directly in that leaf would make "stdlib only" false for every
        # package that reaches it, the same reasoning that put an ssh client in
        # venue rather than in shell. It answers two questions a docker CLI
        # used to answer for free and a library does not — which daemon
        # (DOCKER_HOST, then DOCKER_CONTEXT, then the current context in the
        # config store) and which credentials (config.json auths and the
        # credential helpers) — so it is where those belong rather than a thin
        # alias over the SDK.
        DockerAPI:
          files:
            - "**/internal/dockerapi/**"
          allow:
            - "$gostd"
            - "github.com/moby/moby/api"
            - "github.com/moby/moby/client"
            - "github.com/containerd/errdefs"
            - "go.uber.org/goleak"
        # Leaves: no internal deps, stdlib only apart from the engine client
        # that container execution is now built on.
        Shell:
          files:
            - "**/internal/shell/**"
          allow:
            - "$gostd"
            - "github.com/jtarchie/steps/internal/dockerapi"
        Template:
          files:
            - "**/internal/template/**"
          allow:
            - "$gostd"
            - "github.com/frioux/leatherman/pkg/shellquote"
            - "github.com/go-task/slim-sprig/v3"
        Retry:
          files:
            - "**/internal/retry/**"
          allow:
            - "$gostd"
        # exprlang is the expr: resource backend's evaluator: the language, its
        # three builtins, and nothing else. A leaf by design — it takes what it
        # may read (env names, a directory) as arguments rather than reaching
        # for config, so the only thing it decides is what an expression can
        # do. expr-lang is chosen for what it CANNOT do (no statements, no
        # loops, no I/O but the builtins handed to it here), which is why this
        # allow-list must never grow a second engine.
        Exprlang:
          files:
            - "**/internal/exprlang/**"
          allow:
            - "$gostd"
            - "github.com/expr-lang/expr"
            # goleak is test-only: http() fans out over goroutines, so this
            # package's tests fail if one outlives its batch.
            - "go.uber.org/goleak"
        # events is the run-event bus: a stdlib-only leaf every execution
        # package may publish to and the web layer subscribes to. It must stay
        # a leaf — the moment it imports config or store, the packages that
        # publish would inherit that edge and the graph stops being acyclic.
        Events:
          files:
            - "**/internal/events/**"
          allow:
            - "$gostd"
            # goleak is test-only: goleak_test.go's TestMain fails this
            # package's tests if any leaves a goroutine running.
            - "go.uber.org/goleak"
        # outcome classifies a step/job error (failed/errored/aborted) for
        # hook dispatch; a leaf with no internal dependencies.
        Outcome:
          files:
            - "**/internal/outcome/**"
          allow:
            - "$gostd"
        Store:
          files:
            - "**/internal/store/**"
          allow:
            - "$gostd"
            - "modernc.org/sqlite"
        # config is the shared data-model root: it must not depend on any
        # other internal package (see CLAUDE.md's package-seam plan).
        Config:
          files:
            - "**/internal/config/**"
          allow:
            - "$gostd"
            - "gopkg.in/yaml.v3"
        Resource:
          files:
            - "**/internal/resource/**"
          allow:
            - "$gostd"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/events"
            - "github.com/jtarchie/steps/internal/exprlang"
            # goleak is test-only: http() fans out over goroutines here too.
            - "go.uber.org/goleak"
            - "github.com/jtarchie/steps/internal/mcp"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/template"
        # venue is the orchestrator half of remote execution, and the single
        # decision point one tier ABOVE shell: shell decides host vs container,
        # venue decides this machine vs a worker, and hands straight back to
        # shell when the answer is "here". A separate package precisely so
        # internal/shell stays stdlib-only — an ssh client in the leaf every
        # execution path imports would make "Leaves: no internal deps, stdlib
        # only" false for all of them. It reaches shim because pushing and
        # starting one is its job, and it is what knows how a shim names
        # itself.
        Venue:
          files:
            - "**/internal/venue/**"
            # ssmdial and iapdial are protocol ports with their own tiers
            # below; see SSMDial and IAPDial.
            - "!**/internal/venue/ssmdial/**"
            - "!**/internal/venue/iapdial/**"
          allow:
            - "$gostd"
            # The SSH client and its sftp subsystem: the whole remote contract
            # is sshd plus a pushed binary, so these are what implement it.
            # Both are pure Go, which is what keeps CGO_ENABLED=0 true and so
            # keeps a cross-built binary pushable to a foreign worker.
            - "golang.org/x/crypto/ssh"
            - "golang.org/x/crypto/ssh/agent"
            - "golang.org/x/crypto/ssh/knownhosts"
            - "github.com/pkg/sftp"
            # The ssh_config parser, so a worker can be named by the alias the
            # operator's own ~/.ssh/config already defines. Pure Go for the
            # same reason the two above are.
            - "github.com/kevinburke/ssh_config"
            - "go.uber.org/goleak"
            # blobstore is the venue's data plane: with --artifact-store set,
            # trees move as presigned-URL blobs and the tunnel carries control
            # frames only — the property the SSM dialer's slow tunnels depend
            # on. Pure Go, like everything a pushed binary carries.
            - "github.com/jtarchie/steps/internal/blobstore"
            - "github.com/jtarchie/steps/internal/compress"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/shim"
            - "github.com/jtarchie/steps/internal/wire"
            # ssmdial is the aws:// transport, and the SSM control plane it is
            # driven from: start a session, send the bootstrap that gets a shim
            # listening. Both pure Go.
            - "github.com/jtarchie/steps/internal/venue/ssmdial"
            - "github.com/aws/aws-sdk-go-v2"
            # iapdial is the gcp:// tunnel, and these two are its control
            # plane: the generated Compute Engine REST client (instances,
            # metadata, guest attributes) and the ADC credential chain that
            # signs for both it and the relay. Pure Go, like the AWS pair.
            - "github.com/jtarchie/steps/internal/venue/iapdial"
            - "google.golang.org/api"
            - "golang.org/x/oauth2"
            # smithy is the SDK's error interface, not a second SDK: EC2 answers
            # a just-created instance with InvalidInstanceID.NotFound until its
            # replica catches up, and telling that lag apart from a bad id means
            # reading ErrorCode() rather than matching on message text.
            - "github.com/aws/smithy-go"
        # shim is the remote half of a placed step: it runs as `steps _shim` on
        # a worker, reads frames from stdin and writes them to stdout, and
        # knows nothing about pipelines — no config, no store, no workspace,
        # no merkle. That ignorance IS the contract: a worker runs a binary and
        # a command in a directory, and every decision about what the command
        # means stays where the pipeline is. It reaches shell for one reason
        # only: a command placed on a worker has to run the way HostRunner runs
        # one, same env allowlist and same cancellation bound, or placement
        # would quietly change what a step inherits.
        Shim:
          files:
            - "**/internal/shim/**"
          allow:
            - "$gostd"
            - "go.uber.org/goleak"
            - "github.com/jtarchie/steps/internal/compress"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/wire"
        # wire is the framed protocol and tree codec the orchestrator and a
        # pushed shim speak across a venue. A stdlib-only leaf on purpose: it
        # is the one thing both ends of a version skew must agree on byte for
        # byte, so it must not be able to drift by acquiring a dependency only
        # one side has.
        Wire:
          files:
            - "**/internal/wire/**"
          allow:
            - "$gostd"
        # blobstore is the content-addressed artifact store on S3: trees by
        # digest, packed exactly as they cross a venue's wire (compress over
        # wire's tar), reaching S3 through the pure-Go SDK — GET/PUT by key,
        # never a mounted filesystem. It holds bytes only; which digest means
        # what stays in internal/store's SQLite, which is what makes bucket
        # lifecycle expiry safe. Wired in by main and consumed through
        # workspace's injected interfaces, so neither workspace nor the shim
        # ever imports an AWS SDK.
        Blobstore:
          files:
            - "**/internal/blobstore/**"
          allow:
            - "$gostd"
            - "github.com/aws/aws-sdk-go-v2"
            - "github.com/aws/smithy-go"
            - "go.uber.org/goleak"
            - "github.com/jtarchie/steps/internal/compress"
            - "github.com/jtarchie/steps/internal/wire"
        # ssmdial is a PORT of the AWS SSM session data-channel protocol, not
        # a dependency: the protocol has no published specification, and no
        # community Go client is mature or library-shaped enough to import
        # (see the package doc for the sources and their licenses). It is a
        # leaf under venue with no steps imports at all — it speaks a wire
        # format and nothing about pipelines — so its allow-list is the
        # websocket, the SSM SDK, and uuid, all pure Go so a cross-built
        # binary stays pushable.
        SSMDial:
          files:
            - "**/internal/venue/ssmdial/**"
          allow:
            - "$gostd"
            - "github.com/gorilla/websocket"
            - "github.com/google/uuid"
            - "github.com/aws/aws-sdk-go-v2"
            - "go.uber.org/goleak"
        # iapdial is a PORT of the Cloud IAP TCP-forwarding relay protocol,
        # on the same terms as ssmdial above: no published specification, no
        # importable client (the canonical implementation is gcloud's Python;
        # see the package doc for the sources and their licenses). A leaf
        # under venue with no steps imports at all — its allow-list is the
        # websocket and nothing else, pure Go so a cross-built binary stays
        # pushable.
        IAPDial:
          files:
            - "**/internal/venue/iapdial/**"
          allow:
            - "$gostd"
            - "github.com/gorilla/websocket"
            - "go.uber.org/goleak"
        # compress is the zstd wrap around wire's tar stream — one package so
        # every path that ships a tree (the venue's upload, the shim's fetch,
        # a blob store's blobs) holds the same opinion about the encoding, and
        # so wire itself stays stdlib-only. Compression is negotiated at the
        # hello, never assumed, which is what keeps a mixed-version pair on
        # raw rather than on a stream one side cannot decode. Pure Go, like
        # every dependency a pushed binary carries.
        Compress:
          files:
            - "**/internal/compress/**"
          allow:
            - "$gostd"
            - "github.com/klauspost/compress/zstd"
        Workspace:
          files:
            - "**/internal/workspace/**"
          allow:
            - "$gostd"
            - "golang.org/x/sys/unix"
            - "github.com/jtarchie/steps/internal/config"
            # wire and compress are reached from tests only, and deliberately:
            # digestTree is unexported, and it is the digest that decides
            # whether a tree that crossed a wire is still the same content.
            # The test proving each codec preserves it therefore has to sit
            # next to the digest, not next to the codecs.
            - "github.com/jtarchie/steps/internal/wire"
            - "github.com/jtarchie/steps/internal/compress"
        # mcp is the shared MCP client layer (internal/agent's tool source and
        # internal/resource's mcp: backend both build on it), sitting at the
        # same tier as resource/workspace: depends on config, nothing
        # execution-specific.
        MCP:
          files:
            - "**/internal/mcp/**"
          allow:
            - "$gostd"
            - "github.com/modelcontextprotocol/go-sdk/auth"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/modelcontextprotocol/go-sdk/oauthex"
            - "golang.org/x/oauth2"
            # goleak is test-only: stdio_test.go's TestMain fails this
            # package's tests if any leaves a goroutine running.
            - "go.uber.org/goleak"
            - "github.com/jtarchie/steps/internal/config"
            # shell is imported only for HostEnv: a stdio (command:) mcp
            # server is a host-executed subprocess and must see exactly the
            # same filtered environment every other host-executed command
            # does, rather than a second, drifting copy of the allowlist.
            # shell is a stdlib-only leaf, so this adds no
            # cycle — the same edge internal/resource already has.
            - "github.com/jtarchie/steps/internal/shell"
        # merkle plans/hashes steps; it depends on resource (to resolve get
        # versions the same way at plan time and run time) and config, but
        # nothing execution-specific (store, workspace, agent).
        Merkle:
          files:
            - "**/internal/merkle/**"
          allow:
            - "$gostd"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/resource"
        # agent runs an agent step's LLM tool-calling conversation. It needs
        # store/workspace/merkle for step-level hash/materialize/record
        # sequencing (RunStep), but not resource or pipeline.
        Agent:
          files:
            - "**/internal/agent/**"
          allow:
            - "$gostd"
            - "google.golang.org/adk/v2"
            - "google.golang.org/genai"
            - "github.com/achetronic/adk-utils-go"
            # requests.go classifies a failed request by status code
            # (isTransientProviderError, for the mid-run fallback: cascade),
            # which means unwrapping the SDK's own *openai.Error rather than
            # adk-utils-go's wrapper around it. Already an indirect
            # dependency via adk-utils-go; this makes the direct use honest.
            - "github.com/openai/openai-go/v3"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            # goleak is test-only: goleak_test.go's TestMain fails this
            # package's tests if any leaves a goroutine running.
            - "go.uber.org/goleak"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/events"
            - "github.com/jtarchie/steps/internal/mcp"
            - "github.com/jtarchie/steps/internal/merkle"
            - "github.com/jtarchie/steps/internal/outcome"
            - "github.com/jtarchie/steps/internal/retry"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/template"
            - "github.com/jtarchie/steps/internal/workspace"
        # pipeline is the top-level orchestrator: it composes every other
        # internal package to run a job's plan.
        Pipeline:
          files:
            - "**/internal/pipeline/**"
          allow:
            # venue is the tier ABOVE shell: shell decides host vs container,
            # venue decides this machine vs a worker and hands back to shell
            # when the answer is here. pipeline is what turns a step's tags:
            # into a machine, so it constructs runners through venue rather
            # than shell — the one import that moves, and the only place that
            # mapping is known.
            - "github.com/jtarchie/steps/internal/venue"
            - "$gostd"
            # goleak is test-only: goleak_test.go's TestMain fails this
            # package's tests if any leaves a goroutine running.
            - "go.uber.org/goleak"
            - "github.com/jtarchie/steps/internal/agent"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/events"
            - "github.com/jtarchie/steps/internal/merkle"
            - "github.com/jtarchie/steps/internal/outcome"
            - "github.com/jtarchie/steps/internal/resource"
            - "github.com/jtarchie/steps/internal/retry"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/workspace"
        # trigger polls resources with any get/trigger:true step and runs
        # affected jobs via pipeline.RunJob — the cross-job counterpart to
        # pipeline's single-job orchestration. It's the only package besides
        # pipeline itself that main is allowed to route through into
        # resource/store/workspace territory.
        Trigger:
          files:
            - "**/internal/trigger/**"
          allow:
            - "$gostd"
            # go-sdk/mcp is test-only here (mcp_test.go builds a fake MCP
            # server to prove the trigger loop needs no changes for an
            # mcp-backed resource type) — trigger's own non-test code never
            # imports it, reaching MCP only indirectly via resource.CheckVersions.
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            # goleak is test-only: goleak_test.go's TestMain fails this
            # package's tests if any leaves a goroutine running.
            - "go.uber.org/goleak"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/pipeline"
            - "github.com/jtarchie/steps/internal/resource"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/workspace"
        # web serves the UI. Like trigger, it sits above pipeline and reaches
        # execution territory only through pipeline.RunJob — never into
        # agent/resource/merkle directly, which is what keeps the UI a second
        # front end on one model rather than a second model.
        Web:
          files:
            - "**/internal/web/**"
          allow:
            - "$gostd"
            # goleak is test-only: goleak_test.go's TestMain fails this
            # package's tests if any leaves a goroutine running.
            - "go.uber.org/goleak"
            - "github.com/labstack/echo/v4"
            # goldmark (+ its chroma highlighting extension) renders the
            # embedded docs package at /docs, server-side — the terminal twin
            # (steps docs, via glamour) lives in main. docs itself stays a
            # render-free leaf.
            - "github.com/yuin/goldmark"
            - "github.com/yuin/goldmark/ast"
            - "github.com/yuin/goldmark/extension"
            - "github.com/yuin/goldmark/parser"
            - "github.com/yuin/goldmark-highlighting/v2"
            # renderer/text/util are goldmark's own extension points, needed
            # by the SECOND converter (prose.go) that renders model-authored
            # prose: an AST transformer that makes images inert, and node
            # renderers for links and fenced code. The docs converter needs
            # none of them because it renders text this repo wrote.
            - "github.com/yuin/goldmark/renderer"
            - "github.com/yuin/goldmark/text"
            - "github.com/yuin/goldmark/util"
            # chroma is goldmark-highlighting's engine; imported directly to
            # define the "steps" code style from the UI's own palette, and —
            # lexers/formatters — to reuse that same style for the fenced
            # blocks inside an agent's recorded response (prose.go). JSON is
            # NOT chroma's there: internal/web renders that itself, because
            # unescaping a document nested in a string needs a parser, not a
            # lexer.
            - "github.com/alecthomas/chroma/v2"
            - "github.com/alecthomas/chroma/v2/lexers"
            - "github.com/alecthomas/chroma/v2/formatters/html"
            - "github.com/jtarchie/steps/docs"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/events"
            - "github.com/jtarchie/steps/internal/pipeline"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/workspace"
