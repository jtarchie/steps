# golangci-lint v2 configuration for steps.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # default
    - errcheck      # unchecked errors are bugs (file I/O, exec)
    - govet         # go vet superset
    - ineffassign   # assignments to values never read
    - staticcheck   # the SA* suite (real bugs, deadcode, simplifications)
    - unused        # unused functions/vars/types
    # custom
    - misspell      # typos in identifiers/comments
    - bodyclose     # http.Response.Body not closed
    - errorlint     # %w vs %s on errors, typed nil
    - nilerr        # returning nil after an err
    - noctx         # http requests without context
    - unconvert     # unnecessary type conversions
    - unparam       # unused function parameters
    - gocritic      # common pitfalls
    - reassign      # reassigning package-level vars (http.DefaultClient)
    - tagalign
    - wrapcheck
    - sqlclosecheck
    - exhaustive
    - whitespace
    - noinlineerr
    - importas
    # nil
    - nilnil
    - nilnesserr
    # Correctness
    - musttag       # JSON tags required on marshaled structs
    - recvcheck     # consistent pointer vs value receivers
    - wastedassign  # assignments whose values are never read
    - nolintlint    # stale or malformed //nolint directives
    - errchkjson    # json.Marshal returns ignored where it shouldn't be
    - loggercheck   # slog key/value mismatch and even-arg invariants
    # Style / consistency
    - sloglint      # consistent slog usage
    - revive        # replacement for golint with a tight ruleset
    - gochecknoinits # init() side effects make wiring hard to trace
    # Modern Go idioms
    - intrange      # `for i := range n` (Go 1.22+)
    - copyloopvar   # loop-var capture safe by default (Go 1.22+)
    - mirror        # bytes/strings mirror function suggestions
    # Performance
    - perfsprint    # replace fmt.Sprintf/Errorf with faster alternatives
    - prealloc      # pre-allocate slices where capacity is known
    # Concurrency / context / HTTP safety
    - contextcheck  # context.Context must be propagated, not ignored
    - containedctx  # context.Context must not be stored in structs
    # Complexity
    - cyclop        # cyclomatic complexity per function
    - gocognit      # cognitive complexity (deeply nested / hard-to-read logic)
    - nestif        # deeply nested if blocks
    # Security
    - gosec         # Go security checker; respects existing //nolint:gosec markers
    # Architecture
    - depguard      # enforce the internal import-direction (no upward dep on the CLI layer)

  settings:
    depguard:
      rules:
        # Root (package main): a thin CLI entrypoint — parse flags, wire up
        # config/store/workspace, and hand off to internal/pipeline. It must
        # not reach past internal/pipeline into the packages pipeline itself
        # orchestrates (merkle/resource/agent/shell/template/retry).
        Main:
          files:
            - "$all"
            - "!**/internal/**"
          allow:
            - "$gostd"
            - "github.com/alecthomas/kong"
            - "github.com/lmittmann/tint"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/pipeline"
            # internal/mcp is a setup/tooling dependency here, not an
            # execution-path one: `steps mcp login`/`steps mcp tools` are
            # standalone auth bootstrap/discovery commands with no
            # relationship to pipeline.RunJob, the same way main already
            # reaches internal/workspace directly for provider setup rather
            # than through pipeline. It is NOT a precedent for main reaching
            # into resource/agent territory, which pipeline.RunJob still
            # exclusively orchestrates.
            - "github.com/jtarchie/steps/internal/mcp"
            # outcome is a stdlib-only leaf supplying the vocabulary main
            # needs at the process boundary: which exit code an error earns
            # (outcome.ExitCode). Classifying a failure as "the pipeline said
            # no" vs "the pipeline could not run" is the same distinction
            # pipeline already uses for hook dispatch, so main consumes it
            # rather than keeping a second, drifting copy.
            - "github.com/jtarchie/steps/internal/outcome"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/trigger"
            - "github.com/jtarchie/steps/internal/workspace"
        # Leaves: no internal deps, stdlib only.
        Shell:
          files:
            - "**/internal/shell/**"
          allow:
            - "$gostd"
        Template:
          files:
            - "**/internal/template/**"
          allow:
            - "$gostd"
            - "github.com/frioux/leatherman/pkg/shellquote"
            - "github.com/go-task/slim-sprig/v3"
        Retry:
          files:
            - "**/internal/retry/**"
          allow:
            - "$gostd"
        # outcome classifies a step/job error (failed/errored/aborted) for
        # hook dispatch; a leaf with no internal dependencies.
        Outcome:
          files:
            - "**/internal/outcome/**"
          allow:
            - "$gostd"
        Store:
          files:
            - "**/internal/store/**"
          allow:
            - "$gostd"
            - "modernc.org/sqlite"
        # config is the shared data-model root: it must not depend on any
        # other internal package (see CLAUDE.md's package-seam plan).
        Config:
          files:
            - "**/internal/config/**"
          allow:
            - "$gostd"
            - "gopkg.in/yaml.v3"
        Resource:
          files:
            - "**/internal/resource/**"
          allow:
            - "$gostd"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/mcp"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/template"
        Workspace:
          files:
            - "**/internal/workspace/**"
          allow:
            - "$gostd"
            - "golang.org/x/sys/unix"
            - "github.com/jtarchie/steps/internal/config"
        # mcp is the shared MCP client layer (internal/agent's tool source and
        # internal/resource's mcp: backend both build on it), sitting at the
        # same tier as resource/workspace: depends on config, nothing
        # execution-specific.
        MCP:
          files:
            - "**/internal/mcp/**"
          allow:
            - "$gostd"
            - "github.com/modelcontextprotocol/go-sdk/auth"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/modelcontextprotocol/go-sdk/oauthex"
            - "golang.org/x/oauth2"
            - "github.com/jtarchie/steps/internal/config"
            # shell is imported only for HostEnv: a stdio (command:) mcp
            # server is a host-executed subprocess and must see exactly the
            # same filtered environment every other host-executed command
            # does, rather than a second, drifting copy of the allowlist.
            # shell is a stdlib-only leaf, so this adds no
            # cycle — the same edge internal/resource already has.
            - "github.com/jtarchie/steps/internal/shell"
        # merkle plans/hashes steps; it depends on resource (to resolve get
        # versions the same way at plan time and run time) and config, but
        # nothing execution-specific (store, workspace, agent).
        Merkle:
          files:
            - "**/internal/merkle/**"
          allow:
            - "$gostd"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/resource"
        # agent runs an agent step's LLM tool-calling conversation. It needs
        # store/workspace/merkle for step-level hash/materialize/record
        # sequencing (RunStep), but not resource or pipeline.
        Agent:
          files:
            - "**/internal/agent/**"
          allow:
            - "$gostd"
            - "google.golang.org/adk/v2"
            - "google.golang.org/genai"
            - "github.com/achetronic/adk-utils-go"
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/mcp"
            - "github.com/jtarchie/steps/internal/merkle"
            - "github.com/jtarchie/steps/internal/outcome"
            - "github.com/jtarchie/steps/internal/retry"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/template"
            - "github.com/jtarchie/steps/internal/workspace"
        # pipeline is the top-level orchestrator: it composes every other
        # internal package to run a job's plan.
        Pipeline:
          files:
            - "**/internal/pipeline/**"
          allow:
            - "$gostd"
            - "github.com/jtarchie/steps/internal/agent"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/merkle"
            - "github.com/jtarchie/steps/internal/outcome"
            - "github.com/jtarchie/steps/internal/resource"
            - "github.com/jtarchie/steps/internal/retry"
            - "github.com/jtarchie/steps/internal/shell"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/workspace"
        # trigger polls resources with any get/trigger:true step and runs
        # affected jobs via pipeline.RunJob — the cross-job counterpart to
        # pipeline's single-job orchestration. It's the only package besides
        # pipeline itself that main is allowed to route through into
        # resource/store/workspace territory.
        Trigger:
          files:
            - "**/internal/trigger/**"
          allow:
            - "$gostd"
            # go-sdk/mcp is test-only here (mcp_test.go builds a fake MCP
            # server to prove the trigger loop needs no changes for an
            # mcp-backed resource type) — trigger's own non-test code never
            # imports it, reaching MCP only indirectly via resource.CheckVersions.
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "github.com/jtarchie/steps/internal/config"
            - "github.com/jtarchie/steps/internal/pipeline"
            - "github.com/jtarchie/steps/internal/resource"
            - "github.com/jtarchie/steps/internal/store"
            - "github.com/jtarchie/steps/internal/workspace"
